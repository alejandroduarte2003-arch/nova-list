<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="nova-icon.png">

  <title>Nova List</title>

  <style>

    /* =====================================================
       BASE
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;

      background: #ffffff;
      color: #000000;

      font-family:
        "Geometric Sans",
        "Montserrat",
        "Arial",
        sans-serif;

      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: #000;
      background: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input {
      max-width: 100%;
    }

    .app {
      width: min(100%, 920px);
      margin: 0 auto;

      padding:
        0
        clamp(16px, 4vw, 24px)
        35px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
      position: relative;

      padding-top: clamp(24px, 5vw, 30px);
      padding-bottom: clamp(28px, 6vw, 34px);
    }

    .brand {
      text-align: left;
      padding-right: 70px;
    }

    .brand-name {
      font-size: clamp(20px, 5vw, 23px);
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .brand-subtitle {
      margin-top: 3px;

      font-size: clamp(10px, 2.7vw, 11px);
      letter-spacing: 0.2px;
    }

    .greeting {
      margin-top: 19px;

      font-size: clamp(12px, 3vw, 13px);
      font-weight: 500;
    }


    /* =====================================================
       MENU 3 PUNTOS
    ===================================================== */

    .menu-container {
      position: absolute;

      top: 31px;
      right: 4px;

      width: 170px;
      min-height: 115px;

      pointer-events: none;
      z-index: 20;
    }

    .menu-dots {
      position: absolute;

      top: 3px;
      right: 0;

      display: flex;
      gap: 5px;
      align-items: center;

      pointer-events: auto;
      z-index: 30;
    }

    .dot {
      width: 5px;
      height: 5px;

      background: #000;
      border-radius: 50%;

      transition:
        transform 0.55s cubic-bezier(.22,1,.36,1),
        opacity 0.25s ease;
    }

    .menu-container.open .dot:nth-child(1) {
      transform: translate(-55px, 35px);
    }

    .menu-container.open .dot:nth-child(2) {
      transform: translate(-55px, 65px);
    }

    .menu-container.open .dot:nth-child(3) {
      transform: translate(-55px, 95px);
    }

    .menu-options {
      position: absolute;

      top: 0;
      right: 0;

      width: 145px;
      height: 115px;

      pointer-events: none;
    }

    .menu-option {
      position: absolute;

      right: 0;

      width: 135px;

      display: flex;
      align-items: center;
      gap: 9px;

      opacity: 0;
      transform: translateX(-8px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .menu-option:nth-child(1) {
      top: 34px;
    }

    .menu-option:nth-child(2) {
      top: 64px;
    }

    .menu-option:nth-child(3) {
      top: 94px;
    }

    .menu-line {
      width: 0;
      height: 1px;

      background: #000;

      flex-shrink: 0;

      transition:
        width 0.35s ease;
    }

    .menu-text {
      font-size: 12px;
      white-space: nowrap;
    }

    .menu-container.open .menu-option {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .menu-container.open .menu-option:nth-child(1) {
      transition-delay: 0.50s;
    }

    .menu-container.open .menu-option:nth-child(2) {
      transition-delay: 0.60s;
    }

    .menu-container.open .menu-option:nth-child(3) {
      transition-delay: 0.70s;
    }

    .menu-container.open .menu-line {
      width: 30px;
    }

    .close-menu {
      position: absolute;

      top: 3px;
      right: 0;

      font-size: 17px;
      line-height: 1;

      opacity: 0;
      pointer-events: none;

      z-index: 40;

      transition:
        opacity 0.25s ease;
    }

    .menu-container.open .close-menu {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-container.open .menu-dots {
      pointer-events: none;
    }

    .menu-container.open .menu-dots .dot {
      opacity: 0;
    }


    /* =====================================================
       ACCESOS SUPERIORES
    ===================================================== */

    .quick-actions {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: clamp(9px, 2.5vw, 14px);

      margin-bottom: 22px;
    }

    .quick-action {
      width: 100%;
      min-width: 0;

      min-height:
        clamp(100px, 25vw, 112px);

      border: 1px solid #000;
      border-radius: 2px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 12px 8px;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .quick-action:hover {
      background: #fafafa;
    }

    .quick-action:active {
      transform: scale(0.985);
    }

    .quick-icon {
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    /* Post-it */

    .post-it {
      width: 27px;
      height: 31px;

      border: 1.5px solid #000;

      position: relative;
      background: #fff;
    }

    .post-it::after {
      content: "";

      position: absolute;

      right: -1.5px;
      bottom: -1.5px;

      width: 9px;
      height: 9px;

      background: #fff;

      border-top: 1.5px solid #000;
      border-left: 1.5px solid #000;
    }

    .post-it::before {
      content: "";

      position: absolute;

      width: 12px;
      height: 1px;

      background: #000;

      left: 6px;
      top: 10px;

      box-shadow:
        0 6px 0 #000,
        0 12px 0 #000;
    }

    /* Estrella */

    .star-button {
      width: 36px;
      height: 36px;

      border: 1px solid #000;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .four-star {
      position: relative;

      width: 16px;
      height: 16px;
    }

    .four-star::before,
    .four-star::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 5px;
      height: 15px;

      background: #000;

      border-radius:
        100%
        100%
        100%
        100%;

      transform:
        translate(-50%, -50%);
    }

    .four-star::after {
      transform:
        translate(-50%, -50%)
        rotate(90deg);
    }

    .quick-title {
      margin-top: 8px;

      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 600;

      line-height: 1.3;
    }


    /* =====================================================
       FORMULARIO RECORDATORIO
    ===================================================== */

    .reminder-panel {
      display: none;

      width: 100%;

      border: 1px solid #000;

      padding:
        clamp(16px, 4vw, 20px);

      margin-bottom: 22px;

      animation:
        panelIn 0.25s ease;
    }

    .reminder-panel.open {
      display: block;
    }

    @keyframes panelIn {

      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;

      margin-bottom: 21px;
    }

    .field {
      width: 100%;
      margin-bottom: 20px;
    }

    .field-label {
      display: block;

      font-size: clamp(11px, 2.8vw, 12px);

      line-height: 1.4;

      margin-bottom: 9px;
    }

    .field-input {
      width: 100%;
      height: 43px;

      border: 1px solid #000;
      border-radius: 0;

      padding:
        0
        11px;

      outline: none;

      background: #fff;

      font-size: 13px;
    }

    .field-input:focus {
      border-width: 1.5px;
    }


    /* =====================================================
       SELECTOR LISTAS
    ===================================================== */

    .list-selector {
      position: relative;
      width: 100%;
    }

    .list-selector-main {
      width: 100%;
      min-height: 43px;

      border: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0
        11px;

      text-align: left;

      font-size: 13px;
    }

    .list-arrow {
      font-size: 18px;

      transition:
        transform 0.25s ease;
    }

    .list-selector.open .list-arrow {
      transform: rotate(90deg);
    }

    .list-dropdown {
      display: none;

      border: 1px solid #000;
      border-top: none;

      background: #fff;

      width: 100%;
    }

    .list-selector.open .list-dropdown {
      display: block;
    }

    .list-option {
      width: 100%;

      min-height: 43px;

      padding:
        10px
        11px;

      border-bottom: 1px solid #ddd;

      font-size: 12px;

      text-align: left;
    }

    .list-option:last-child {
      border-bottom: none;
    }

    .list-option:hover {
      background: #f6f6f6;
    }

    .new-list-button {
      width: 100%;

      min-height: 43px;

      padding:
        10px
        11px;

      border-top: 1px solid #000;

      font-size: 12px;

      text-align: left;
    }

    .new-list-button:hover {
      background: #f6f6f6;
    }


    /* =====================================================
       FECHA Y HORA
    ===================================================== */

    .date-row {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;

      width: 100%;
    }

    .date-row .field {
      min-width: 0;
    }

    .toggle-row {
      display: flex;

      gap: 8px;

      width: 100%;
    }

    .toggle-button {
      flex: 1;

      min-width: 0;

      height: 43px;

      border: 1px solid #000;

      font-size: 11px;
    }

    .toggle-button.active {
      background: #000;
      color: #fff;
    }

    .time-field {
      display: none;

      margin-top: 12px;
    }

    .time-field.visible {
      display: block;
    }


    /* =====================================================
       ALARMA
    ===================================================== */

    .alarm-row {
      display: flex;

      gap: 12px;

      margin-top: 4px;

      min-height: 48px;

      align-items: center;
    }

    .alarm-button {
      width: 44px;
      height: 44px;

      border: 1px solid #000;
      border-radius: 50%;

      font-size: 11px;

      flex-shrink: 0;
    }

    .alarm-button.active {
      background: #000;
      color: #fff;
    }


    /* =====================================================
       BOTONES PANEL
    ===================================================== */

    .panel-actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 25px;
    }

    .panel-cancel,
    .panel-save {
      min-height: 40px;

      padding:
        0
        17px;

      border: 1px solid #000;

      font-size: 11px;
    }

    .panel-save {
      background: #000;
      color: #fff;
    }


    /* =====================================================
       CALENDARIO + LISTAS
    ===================================================== */

    .dashboard-top {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: clamp(9px, 2.5vw, 16px);

      margin-bottom: 22px;

      width: 100%;
    }

    .calendar,
    .lists-panel {
      width: 100%;
      min-width: 0;

      border: 1px solid #000;

      padding:
        clamp(11px, 3vw, 17px);
    }

    .box-title {
      font-size: clamp(11px, 2.8vw, 13px);

      font-weight: 600;

      margin-bottom: 14px;
    }


    /* =====================================================
       CALENDARIO
    ===================================================== */

    .calendar-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .calendar-month {
      font-size: clamp(10px, 2.7vw, 12px);

      font-weight: 600;

      text-align: center;

      white-space: nowrap;
    }

    .month-button {
      font-size: 17px;
      line-height: 1;

      padding:
        2px 4px;

      flex-shrink: 0;
    }

    .weekdays,
    .calendar-days {
      display: grid;

      grid-template-columns:
        repeat(7, minmax(0, 1fr));

      gap: clamp(1px, 0.7vw, 3px);

      width: 100%;
    }

    .weekday {
      min-width: 0;

      text-align: center;

      font-size:
        clamp(7px, 2vw, 9px);

      margin-bottom: 4px;
    }

    .calendar-day {
      width: 100%;
      height:
        clamp(27px, 7vw, 31px);

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      font-size:
        clamp(8px, 2.3vw, 10px);
    }

    .calendar-day button {
      width:
        clamp(23px, 6vw, 27px);

      height:
        clamp(23px, 6vw, 27px);

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      flex-shrink: 0;
    }

    .calendar-day.today button {
      border: 1px solid #000;
    }

    .calendar-day.selected button {
      background: #000;
      color: #fff;
    }

    .task-dot {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #000;

      bottom: 1px;
    }


    /* =====================================================
       LISTAS
    ===================================================== */

    .lists {
      display: flex;
      flex-direction: column;

      width: 100%;
    }

    .list-item {
      min-height:
        clamp(38px, 10vw, 42px);

      border-top: 1px solid #ddd;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      cursor: pointer;
    }

    .list-item:first-child {
      border-top: none;
    }

    .list-name {
      min-width: 0;

      font-size:
        clamp(10px, 2.7vw, 12px);

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list-count {
      font-size: 10px;

      flex-shrink: 0;
    }

    .create-list {
      width: 100%;

      margin-top: 12px;

      border-top: 1px solid #000;

      padding-top: 12px;

      font-size: 11px;

      text-align: left;
    }


    /* =====================================================
       HOY / PRÓXIMAMENTE
    ===================================================== */

    .main-shortcuts {
      display: flex;
      flex-direction: column;

      gap: 10px;

      margin-bottom: 22px;
    }

    .day-button {
      width: 100%;

      min-height:
        clamp(54px, 14vw, 58px);

      border: 1px solid #000;

      display: flex;

      align-items: center;
      justify-content: space-between;

      padding:
        0
        clamp(13px, 4vw, 16px);

      text-align: left;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .day-button:hover {
      background: #fafafa;
    }

    .day-button:active {
      transform: scale(0.99);
    }

    .day-button-name {
      display: flex;

      align-items: center;

      gap: 8px;

      font-size:
        clamp(12px, 3vw, 13px);

      font-weight: 600;
    }

    .day-button-arrow {
      font-size: 17px;
    }


    /* =====================================================
       BADGE
    ===================================================== */

    .overdue-badge {
      min-width: 18px;
      height: 18px;

      padding:
        0 5px;

      background: #e00000;
      color: #fff;

      border-radius: 50%;

      display: none;

      align-items: center;
      justify-content: center;

      font-size: 9px;
      font-weight: 600;
    }

    .overdue-badge.visible {
      display: inline-flex;
    }


    /* =====================================================
       VISTAS DE TAREAS
    ===================================================== */

    .task-view {
      display: none;
    }

    .task-view.active {
      display: block;
    }

    .home-view.hidden {
      display: none;
    }

    .view-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .view-title {
      font-size:
        clamp(16px, 4.5vw, 18px);

      font-weight: 600;
    }

    .back-button {
      font-size: 12px;

      text-decoration: underline;

      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 11px;

      margin-bottom: 15px;
    }

    .task-list {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .task-card {
      width: 100%;

      border: 1px solid #000;

      padding: 14px;

      display: flex;

      align-items: center;

      gap: 12px;
    }

    .task-check {
      width: 18px;
      height: 18px;

      border: 1px solid #000;

      flex-shrink: 0;
    }

    .task-content {
      flex: 1;

      min-width: 0;
    }

    .task-title {
      font-size: 12px;

      font-weight: 600;

      word-break: break-word;
    }

    .task-meta {
      font-size: 10px;

      margin-top: 4px;

      word-break: break-word;
    }

    .task-overdue {
      font-size: 9px;

      margin-top: 5px;

      font-weight: 600;
    }


    /* =====================================================
       VISTA LISTA
    ===================================================== */

    .list-detail {
      display: none;
    }

    .list-detail.active {
      display: block;
    }

    .list-detail-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }

    .list-detail-title {
      font-size:
        clamp(16px, 4.5vw, 18px);

      font-weight: 600;

      min-width: 0;

      word-break: break-word;
    }

    .list-detail-count {
      font-size: 10px;
    }


    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {
      border-top: 1px solid #000;

      margin-top: 30px;

      padding-top: 16px;

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 5px;
    }

    .bottom-nav button {
      font-size:
        clamp(9px, 2.5vw, 10px);

      padding:
        8px 0;

      min-width: 0;
    }


    /* =====================================================
       MENSAJE VACÍO
    ===================================================== */

    .empty-state {
      width: 100%;

      border: 1px solid #ddd;

      padding:
        30px 20px;

      text-align: center;

      font-size: 11px;
    }


    /* =====================================================
       RESPONSIVE — TELÉFONO
    ===================================================== */

    @media (max-width: 600px) {

      .app {
        width: 100%;

        padding-left:
          clamp(13px, 4vw, 17px);

        padding-right:
          clamp(13px, 4vw, 17px);

        padding-bottom: 30px;
      }

      /*
        Calendario y listas permanecen siempre
        en dos columnas iguales.
      */

      .dashboard-top {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1fr);

        gap:
          clamp(8px, 2.5vw, 11px);
      }

      /*
        En móvil el formulario deja de poner
        fecha y hora lado a lado.
      */

      .date-row {
        grid-template-columns: 1fr;

        gap: 0;
      }

      /*
        La pregunta de hora ahora tiene
        espacio propio.
      */

      .date-row .field {
        margin-bottom: 21px;
      }

      /*
        Más espacio entre la pregunta
        y los botones Sí / No.
      */

      .toggle-row {
        margin-top: 4px;

        gap: 9px;
      }

      .toggle-button {
        height: 44px;
      }

      /*
        Alarma también tiene separación clara.
      */

      .alarm-row {
        margin-top: 8px;

        gap: 12px;
      }

      /*
        Botones inferiores del formulario.
      */

      .panel-actions {
        justify-content: stretch;

        margin-top: 27px;
      }

      .panel-cancel,
      .panel-save {
        flex: 1;

        min-height: 43px;
      }

    }


    /* =====================================================
       TELÉFONOS MUY PEQUEÑOS
    ===================================================== */

    @media (max-width: 360px) {

      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .dashboard-top {
        gap: 7px;
      }

      .calendar,
      .lists-panel {
        padding: 9px;
      }

      .box-title {
        margin-bottom: 11px;
      }

      .calendar-header {
        margin-bottom: 9px;
      }

      .weekday {
        font-size: 7px;
      }

      .calendar-day {
        height: 25px;
      }

      .calendar-day button {
        width: 21px;
        height: 21px;
      }

      .quick-actions {
        gap: 7px;
      }

      .quick-action {
        padding-left: 5px;
        padding-right: 5px;
      }

      .quick-title {
        font-size: 9px;
      }

      .reminder-panel {
        padding: 13px;
      }

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (min-width: 601px) and (max-width: 900px) {

      .dashboard-top {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1fr);
      }

    }


    /* =====================================================
       PANTALLAS GRANDES
    ===================================================== */

    @media (min-width: 901px) {

      .app {
        padding-left: 24px;
        padding-right: 24px;
      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- =========================
       HEADER
  ========================== -->

  <header id="mainHeader">

    <div class="brand">

      <div class="brand-name">
        Nova-List
      </div>

      <div class="brand-subtitle">
        una APP de Incorova
      </div>

      <div
        class="greeting"
        id="greeting"
      ></div>

    </div>


    <!-- MENÚ -->

    <div
      class="menu-container"
      id="menuContainer"
    >

      <button
        class="menu-dots"
        id="menuButton"
        aria-label="Abrir menú"
      >
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </button>


      <button
        class="close-menu"
        id="closeMenu"
        aria-label="Cerrar menú"
      >
        ×
      </button>


      <div class="menu-options">

        <button class="menu-option">
          <span class="menu-line"></span>
          <span class="menu-text">
            Listas
          </span>
        </button>

        <button class="menu-option">
          <span class="menu-line"></span>
          <span class="menu-text">
            Notas
          </span>
        </button>

        <button class="menu-option">
          <span class="menu-line"></span>
          <span class="menu-text">
            Dashboard
          </span>
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       VISTA PRINCIPAL
  ========================== -->

  <main
    id="homeView"
    class="home-view"
  >


    <!-- ACCIONES SUPERIORES -->

    <section class="quick-actions">


      <!-- NOTAS RÁPIDAS -->

      <button
        class="quick-action"
        id="quickNotesButton"
      >

        <div class="quick-icon">

          <span class="post-it"></span>

        </div>

        <div class="quick-title">
          Notas rápidas
        </div>

      </button>


      <!-- NUEVO RECORDATORIO -->

      <button
        class="quick-action"
        id="newReminderButton"
      >

        <div class="quick-icon">

          <span class="star-button">
            <span class="four-star"></span>
          </span>

        </div>

        <div class="quick-title">
          Agregar nuevo recordatorio
        </div>

      </button>

    </section>



    <!-- =========================
         FORMULARIO RECORDATORIO
    ========================== -->

    <section
      class="reminder-panel"
      id="reminderPanel"
    >

      <div class="panel-title">
        Nuevo recordatorio
      </div>


      <!-- ¿CUÁL? -->

      <div class="field">

        <label class="field-label">
          ¿Cuál es el recordatorio?
        </label>

        <input
          type="text"
          class="field-input"
          id="reminderTitle"
          placeholder="Escribe el recordatorio"
        >

      </div>


      <!-- LISTA -->

      <div class="field">

        <label class="field-label">
          ¿A qué lista deseas agregarlo?
        </label>

        <div
          class="list-selector"
          id="listSelector"
        >

          <button
            class="list-selector-main"
            id="listSelectorMain"
          >

            <span id="selectedList">
              Seleccionar lista
            </span>

            <span
              class="list-arrow"
              id="listArrow"
            >
              ›
            </span>

          </button>


          <div
            class="list-dropdown"
            id="listDropdown"
          ></div>

        </div>

      </div>


      <!-- FECHA / HORA -->

      <div class="date-row">

        <div class="field">

          <label class="field-label">
            ¿Qué día?
          </label>

          <input
            type="date"
            class="field-input"
            id="reminderDate"
          >

        </div>


        <!-- HORA -->

        <div class="field">

          <label class="field-label">
            ¿Deseas agregar hora?
          </label>

          <div class="toggle-row">

            <button
              class="toggle-button active"
              id="timeNo"
            >
              No
            </button>

            <button
              class="toggle-button"
              id="timeYes"
            >
              Sí
            </button>

          </div>

          <div
            class="time-field"
            id="timeField"
          >

            <input
              type="time"
              class="field-input"
              id="reminderTime"
            >

          </div>

        </div>

      </div>


      <!-- ALARMA -->

      <div class="field">

        <label class="field-label">
          ¿Deseas poner una alarma para el recordatorio?
        </label>

        <div class="alarm-row">

          <button
            class="alarm-button"
            id="alarmYes"
          >
            Sí
          </button>

          <button
            class="alarm-button active"
            id="alarmNo"
          >
            No
          </button>

        </div>

      </div>


      <!-- BOTONES -->

      <div class="panel-actions">

        <button
          class="panel-cancel"
          id="cancelReminder"
        >
          Cancelar
        </button>

        <button
          class="panel-save"
          id="saveReminder"
        >
          Guardar
        </button>

      </div>

    </section>



    <!-- =========================
         CALENDARIO + LISTAS
    ========================== -->

    <section class="dashboard-top">


      <!-- CALENDARIO -->

      <div class="calendar">

        <div class="box-title">
          Calendario
        </div>

        <div class="calendar-header">

          <button
            class="month-button"
            id="prevMonth"
          >
            ‹
          </button>

          <div
            class="calendar-month"
            id="calendarMonth"
          ></div>

          <button
            class="month-button"
            id="nextMonth"
          >
            ›
          </button>

        </div>


        <div
          class="weekdays"
          id="weekdays"
        ></div>

        <div
          class="calendar-days"
          id="calendarDays"
        ></div>

      </div>



      <!-- LISTAS -->

      <div class="lists-panel">

        <div class="box-title">
          Mis listas
        </div>

        <div
          class="lists"
          id="lists"
        ></div>

        <button
          class="create-list"
          id="createList"
        >
          + Nueva lista
        </button>

      </div>

    </section>



    <!-- =========================
         HOY / PRÓXIMAMENTE
    ========================== -->

    <section class="main-shortcuts">


      <!-- HOY -->

      <button
        class="day-button"
        id="todayButton"
      >

        <span class="day-button-name">

          <span>
            Hoy
          </span>

          <span
            class="overdue-badge"
            id="overdueBadge"
          >
            0
          </span>

        </span>

        <span class="day-button-arrow">
          ›
        </span>

      </button>


      <!-- PRÓXIMAMENTE -->

      <button
        class="day-button"
        id="upcomingButton"
      >

        <span class="day-button-name">
          Próximamente
        </span>

        <span class="day-button-arrow">
          ›
        </span>

      </button>

    </section>

  </main>



  <!-- =========================
       VISTA HOY
  ========================== -->

  <section
    class="task-view"
    id="todayView"
  >

    <div class="view-header">

      <div class="view-title">
        Hoy
      </div>

      <button
        class="back-button"
        data-back
      >
        Volver
      </button>

    </div>

    <div
      class="view-subtitle"
      id="todaySubtitle"
    ></div>

    <div
      class="task-list"
      id="todayTasks"
    ></div>

  </section>



  <!-- =========================
       VISTA PRÓXIMAMENTE
  ========================== -->

  <section
    class="task-view"
    id="upcomingView"
  >

    <div class="view-header">

      <div class="view-title">
        Próximamente
      </div>

      <button
        class="back-button"
        data-back
      >
        Volver
      </button>

    </div>

    <div class="view-subtitle">
      Pendientes dentro de las próximas 48 horas.
    </div>

    <div
      class="task-list"
      id="upcomingTasks"
    ></div>

  </section>



  <!-- =========================
       VISTA LISTA
  ========================== -->

  <section
    class="list-detail"
    id="listDetail"
  >

    <div class="list-detail-header">

      <div
        class="list-detail-title"
        id="listDetailTitle"
      ></div>

      <button
        class="back-button"
        data-back
      >
        Volver
      </button>

    </div>

    <div
      class="task-list"
      id="listDetailTasks"
    ></div>

  </section>



  <!-- =========================
       NAVEGACIÓN
  ========================== -->

  <nav class="bottom-nav">

    <button id="navLists">
      Listas
    </button>

    <button id="navNotes">
      Notas
    </button>

    <button id="navAgenda">
      Agenda
    </button>

    <button id="navDashboard">
      Dashboard
    </button>

  </nav>


</div>



<script>

  /* =====================================================
     DATOS
  ===================================================== */

  const defaultLists = [
    {
      id: "trabajo",
      name: "Trabajo"
    },
    {
      id: "personal",
      name: "Personal"
    },
    {
      id: "compras",
      name: "Compras"
    },
    {
      id: "proyectos",
      name: "Proyectos"
    }
  ];


  const defaultTasks = [
    {
      id: 1,
      type: "todo",
      title: "Revisar documentos pendientes",
      list: "trabajo",
      date: getDateStringOffset(-1),
      completed: false
    },
    {
      id: 2,
      type: "todo",
      title: "Enviar seguimiento",
      list: "trabajo",
      date: getDateStringOffset(0),
      completed: false
    },
    {
      id: 3,
      type: "todo",
      title: "Comprar concentrado",
      list: "compras",
      date: getDateStringOffset(1),
      completed: false
    }
  ];


  let lists =
    JSON.parse(
      localStorage.getItem("novaLists")
    ) || defaultLists;


  let tasks =
    JSON.parse(
      localStorage.getItem("novaTasks")
    ) || defaultTasks;


  function saveData() {

    localStorage.setItem(
      "novaLists",
      JSON.stringify(lists)
    );

    localStorage.setItem(
      "novaTasks",
      JSON.stringify(tasks)
    );

  }


  /* =====================================================
     FECHAS
  ===================================================== */

  function getDateString(date) {

    const year =
      date.getFullYear();

    const month =
      String(date.getMonth() + 1)
      .padStart(2, "0");

    const day =
      String(date.getDate())
      .padStart(2, "0");

    return `${year}-${month}-${day}`;

  }


  function getDateStringOffset(days) {

    const date = new Date();

    date.setDate(
      date.getDate() + days
    );

    return getDateString(date);

  }


  function formatDate(dateString) {

    const date =
      new Date(
        dateString + "T00:00:00"
      );

    return date.toLocaleDateString(
      "es-GT",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  }


  /* =====================================================
     SALUDO
  ===================================================== */

  function updateGreeting() {

    const hour =
      new Date().getHours();

    let greeting;

    if (hour < 12) {
      greeting = "Buenos días";
    }
    else if (hour < 18) {
      greeting = "Buenas tardes";
    }
    else {
      greeting = "Buenas noches";
    }

    document.getElementById(
      "greeting"
    ).textContent = greeting;

  }

  updateGreeting();


  /* =====================================================
     MENÚ
  ===================================================== */

  const menuContainer =
    document.getElementById(
      "menuContainer"
    );

  const menuButton =
    document.getElementById(
      "menuButton"
    );

  const closeMenu =
    document.getElementById(
      "closeMenu"
    );


  menuButton.addEventListener(
    "click",
    () => {

      menuContainer.classList.add(
        "open"
      );

    }
  );


  closeMenu.addEventListener(
    "click",
    () => {

      menuContainer.classList.remove(
        "open"
      );

    }
  );


  /* =====================================================
     VISTAS
  ===================================================== */

  const homeView =
    document.getElementById(
      "homeView"
    );

  const todayView =
    document.getElementById(
      "todayView"
    );

  const upcomingView =
    document.getElementById(
      "upcomingView"
    );

  const listDetail =
    document.getElementById(
      "listDetail"
    );


  function showHome() {

    homeView.classList.remove(
      "hidden"
    );

    todayView.classList.remove(
      "active"
    );

    upcomingView.classList.remove(
      "active"
    );

    listDetail.classList.remove(
      "active"
    );

  }


  function showView(view) {

    homeView.classList.add(
      "hidden"
    );

    todayView.classList.remove(
      "active"
    );

    upcomingView.classList.remove(
      "active"
    );

    listDetail.classList.remove(
      "active"
    );

    view.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll("[data-back]")
    .forEach(button => {

      button.addEventListener(
        "click",
        showHome
      );

    });


  /* =====================================================
     NOTAS RÁPIDAS
  ===================================================== */

  document
    .getElementById("quickNotesButton")
    .addEventListener(
      "click",
      () => {

        alert(
          "Aquí construiremos la página de Notas rápidas."
        );

      }
    );


  document
    .getElementById("navNotes")
    .addEventListener(
      "click",
      () => {

        alert(
          "Aquí construiremos la sección de Notas."
        );

      }
    );


  /* =====================================================
     LISTAS
  ===================================================== */

  function renderLists() {

    const container =
      document.getElementById("lists");

    container.innerHTML = "";

    lists.forEach(list => {

      const count =
        tasks.filter(
          task =>
            task.list === list.id &&
            !task.completed
        ).length;

      const button =
        document.createElement("div");

      button.className =
        "list-item";

      button.innerHTML = `
        <span class="list-name">
          ${escapeHTML(list.name)}
        </span>

        <span class="list-count">
          ${count}
        </span>
      `;

      button.addEventListener(
        "click",
        () => openList(list.id)
      );

      container.appendChild(button);

    });

  }


  function openList(listId) {

    const list =
      lists.find(
        item => item.id === listId
      );

    if (!list) return;

    document.getElementById(
      "listDetailTitle"
    ).textContent = list.name;

    const container =
      document.getElementById(
        "listDetailTasks"
      );

    const listTasks =
      tasks.filter(
        task =>
          task.list === list.id &&
          !task.completed
      );

    renderTaskCards(
      container,
      listTasks
    );

    showView(listDetail);

  }


  document
    .getElementById("createList")
    .addEventListener(
      "click",
      createNewList
    );


  function createNewList() {

    const name =
      prompt(
        "Nombre de la nueva lista:"
      );

    if (!name || !name.trim()) {
      return;
    }

    const id =
      "list-" +
      Date.now();

    lists.push({
      id,
      name: name.trim()
    });

    saveData();

    renderLists();

    renderListDropdown();

  }


  /* =====================================================
     SELECTOR DE LISTAS
  ===================================================== */

  const listSelector =
    document.getElementById(
      "listSelector"
    );

  const listSelectorMain =
    document.getElementById(
      "listSelectorMain"
    );

  const selectedList =
    document.getElementById(
      "selectedList"
    );

  const listDropdown =
    document.getElementById(
      "listDropdown"
    );


  let selectedReminderList = null;


  listSelectorMain.addEventListener(
    "click",
    () => {

      listSelector.classList.toggle(
        "open"
      );

    }
  );


  function renderListDropdown() {

    listDropdown.innerHTML = "";

    lists.forEach(list => {

      const button =
        document.createElement("button");

      button.className =
        "list-option";

      button.textContent =
        list.name;

      button.addEventListener(
        "click",
        () => {

          selectedReminderList =
            list.id;

          selectedList.textContent =
            list.name;

          listSelector.classList.remove(
            "open"
          );

        }
      );

      listDropdown.appendChild(
        button
      );

    });


    const newList =
      document.createElement("button");

    newList.className =
      "new-list-button";

    newList.textContent =
      "+ Crear nueva lista";

    newList.addEventListener(
      "click",
      () => {

        createNewList();

      }
    );

    listDropdown.appendChild(
      newList
    );

  }


  renderListDropdown();


  /* =====================================================
     PANEL RECORDATORIO
  ===================================================== */

  const reminderPanel =
    document.getElementById(
      "reminderPanel"
    );


  document
    .getElementById("newReminderButton")
    .addEventListener(
      "click",
      () => {

        reminderPanel.classList.toggle(
          "open"
        );

        if (
          reminderPanel.classList.contains(
            "open"
          )
        ) {

          document.getElementById(
            "reminderDate"
          ).value =
            getDateString(
              new Date()
            );

        }

      }
    );


  document
    .getElementById("cancelReminder")
    .addEventListener(
      "click",
      resetReminderForm
    );


  function resetReminderForm() {

    reminderPanel.classList.remove(
      "open"
    );

    document.getElementById(
      "reminderTitle"
    ).value = "";

    selectedReminderList = null;

    selectedList.textContent =
      "Seleccionar lista";

    listSelector.classList.remove(
      "open"
    );

    document.getElementById(
      "reminderDate"
    ).value =
      getDateString(
        new Date()
      );

    document.getElementById(
      "reminderTime"
    ).value = "";

    document
      .getElementById("timeNo")
      .classList.add("active");

    document
      .getElementById("timeYes")
      .classList.remove("active");

    document
      .getElementById("timeField")
      .classList.remove("visible");

    document
      .getElementById("alarmNo")
      .classList.add("active");

    document
      .getElementById("alarmYes")
      .classList.remove("active");

  }


  /* =====================================================
     HORA
  ===================================================== */

  document
    .getElementById("timeNo")
    .addEventListener(
      "click",
      () => {

        document
          .getElementById("timeNo")
          .classList.add("active");

        document
          .getElementById("timeYes")
          .classList.remove("active");

        document
          .getElementById("timeField")
          .classList.remove("visible");

      }
    );


  document
    .getElementById("timeYes")
    .addEventListener(
      "click",
      () => {

        document
          .getElementById("timeYes")
          .classList.add("active");

        document
          .getElementById("timeNo")
          .classList.remove("active");

        document
          .getElementById("timeField")
          .classList.add("visible");

      }
    );


  /* =====================================================
     ALARMA
  ===================================================== */

  document
    .getElementById("alarmYes")
    .addEventListener(
      "click",
      () => {

        document
          .getElementById("alarmYes")
          .classList.add("active");

        document
          .getElementById("alarmNo")
          .classList.remove("active");

      }
    );


  document
    .getElementById("alarmNo")
    .addEventListener(
      "click",
      () => {

        document
          .getElementById("alarmNo")
          .classList.add("active");

        document
          .getElementById("alarmYes")
          .classList.remove("active");

      }
    );


  /* =====================================================
     GUARDAR RECORDATORIO
  ===================================================== */

  document
    .getElementById("saveReminder")
    .addEventListener(
      "click",
      saveReminder
    );


  function saveReminder() {

    const title =
      document.getElementById(
        "reminderTitle"
      ).value.trim();

    const date =
      document.getElementById(
        "reminderDate"
      ).value;

    const hasTime =
      document
        .getElementById("timeYes")
        .classList.contains(
          "active"
        );

    const time =
      document.getElementById(
        "reminderTime"
      ).value;

    const alarm =
      document
        .getElementById("alarmYes")
        .classList.contains(
          "active"
        );


    if (!title) {

      alert(
        "Escribe cuál es el recordatorio."
      );

      return;

    }


    if (!selectedReminderList) {

      alert(
        "Selecciona una lista."
      );

      return;

    }


    if (!date) {

      alert(
        "Selecciona el día del recordatorio."
      );

      return;

    }


    if (hasTime && !time) {

      alert(
        "Selecciona la hora del recordatorio."
      );

      return;

    }


    if (alarm && !hasTime) {

      alert(
        "Para utilizar una alarma debes agregar una hora."
      );

      return;

    }


    tasks.push({

      id: Date.now(),

      type: "reminder",

      title,

      list: selectedReminderList,

      date,

      time:
        hasTime
          ? time
          : null,

      alarm,

      completed: false

    });


    saveData();

    renderLists();

    updateOverdueBadge();

    renderCalendar();

    resetReminderForm();


    alert(
      "Recordatorio guardado."
    );

  }


  /* =====================================================
     HOY
  ===================================================== */

  document
    .getElementById("todayButton")
    .addEventListener(
      "click",
      showToday
    );


  function showToday() {

    const today =
      getDateString(
        new Date()
      );

    const todayTasks =
      tasks.filter(
        task =>
          task.type === "todo" &&
          task.date === today
      );

    document.getElementById(
      "todaySubtitle"
    ).textContent =
      formatDate(today);

    renderTaskCards(
      document.getElementById(
        "todayTasks"
      ),
      todayTasks
    );

    showView(todayView);

  }


  /* =====================================================
     PRÓXIMAMENTE
  ===================================================== */

  document
    .getElementById("upcomingButton")
    .addEventListener(
      "click",
      showUpcoming
    );


  function showUpcoming() {

    const now =
      new Date();

    const limit =
      new Date(
        now.getTime() +
        (
          48 *
          60 *
          60 *
          1000
        )
      );


    const upcoming =
      tasks.filter(
        task => {

          if (
            task.type !== "todo" ||
            task.completed
          ) {

            return false;

          }

          const taskDate =
            new Date(
              task.date +
              "T23:59:59"
            );

          return (
            taskDate > now &&
            taskDate <= limit
          );

        }
      );


    renderTaskCards(
      document.getElementById(
        "upcomingTasks"
      ),
      upcoming
    );

    showView(
      upcomingView
    );

  }


  /* =====================================================
     TARJETAS
  ===================================================== */

  function renderTaskCards(
    container,
    taskArray
  ) {

    container.innerHTML = "";

    if (!taskArray.length) {

      container.innerHTML = `
        <div class="empty-state">
          No hay pendientes para mostrar.
        </div>
      `;

      return;

    }


    taskArray.forEach(task => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "task-card";


      const today =
        getDateString(
          new Date()
        );


      const overdue =
        task.type === "todo" &&
        task.date < today &&
        !task.completed;


      const list =
        lists.find(
          item =>
            item.id === task.list
        );


      let meta =
        list
          ? list.name
          : "Sin lista";


      if (task.date) {

        meta +=
          " · " +
          formatDate(
            task.date
          );

      }


      if (
        task.type === "reminder" &&
        task.time
      ) {

        meta +=
          " · " +
          task.time;

      }


      card.innerHTML = `

        <div class="task-check"></div>

        <div class="task-content">

          <div class="task-title">
            ${escapeHTML(task.title)}
          </div>

          <div class="task-meta">
            ${escapeHTML(meta)}
          </div>

          ${
            overdue
              ? `
                <div class="task-overdue">
                  Vencido
                </div>
              `
              : ""
          }

        </div>

      `;


      container.appendChild(
        card
      );

    });

  }


  /* =====================================================
     CONTADOR VENCIDOS
  ===================================================== */

  function updateOverdueBadge() {

    const today =
      getDateString(
        new Date()
      );


    const overdue =
      tasks.filter(
        task =>
          task.type === "todo" &&
          !task.completed &&
          task.date < today
      ).length;


    const badge =
      document.getElementById(
        "overdueBadge"
      );


    if (overdue > 0) {

      badge.textContent =
        overdue > 99
          ? "99+"
          : overdue;

      badge.classList.add(
        "visible"
      );

    }
    else {

      badge.classList.remove(
        "visible"
      );

    }

  }


  /* =====================================================
     CALENDARIO
  ===================================================== */

  const monthNames = [
    "Enero",
    "Febrero",
    "Marzo",
    "Abril",
    "Mayo",
    "Junio",
    "Julio",
    "Agosto",
    "Septiembre",
    "Octubre",
    "Noviembre",
    "Diciembre"
  ];


  const weekdayNames = [
    "D",
    "L",
    "M",
    "X",
    "J",
    "V",
    "S"
  ];


  let calendarDate =
    new Date();


  let selectedDate =
    getDateString(
      new Date()
    );


  function renderCalendar() {

    const year =
      calendarDate.getFullYear();

    const month =
      calendarDate.getMonth();


    document.getElementById(
      "calendarMonth"
    ).textContent =
      `${monthNames[month]} ${year}`;


    const weekdays =
      document.getElementById(
        "weekdays"
      );

    weekdays.innerHTML = "";


    weekdayNames.forEach(
      day => {

        const element =
          document.createElement(
            "div"
          );

        element.className =
          "weekday";

        element.textContent =
          day;

        weekdays.appendChild(
          element
        );

      }
    );


    const days =
      document.getElementById(
        "calendarDays"
      );

    days.innerHTML = "";


    const firstDay =
      new Date(
        year,
        month,
        1
      ).getDay();


    const daysInMonth =
      new Date(
        year,
        month + 1,
        0
      ).getDate();


    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      const empty =
        document.createElement(
          "div"
        );

      empty.className =
        "calendar-day";

      days.appendChild(
        empty
      );

    }


    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const date =
        new Date(
          year,
          month,
          day
        );


      const dateString =
        getDateString(
          date
        );


      const cell =
        document.createElement(
          "div"
        );

      cell.className =
        "calendar-day";


      if (
        dateString ===
        getDateString(
          new Date()
        )
      ) {

        cell.classList.add(
          "today"
        );

      }


      if (
        dateString ===
        selectedDate
      ) {

        cell.classList.add(
          "selected"
        );

      }


      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        day;


      button.addEventListener(
        "click",
        () => {

          selectedDate =
            dateString;

          renderCalendar();

        }
      );


      cell.appendChild(
        button
      );


      const hasTasks =
        tasks.some(
          task =>
            task.date ===
            dateString
        );


      if (hasTasks) {

        const indicator =
          document.createElement(
            "span"
          );

        indicator.className =
          "task-dot";

        cell.appendChild(
          indicator
        );

      }


      days.appendChild(
        cell
      );

    }

  }


  document
    .getElementById("prevMonth")
    .addEventListener(
      "click",
      () => {

        calendarDate.setMonth(
          calendarDate.getMonth() - 1
        );

        renderCalendar();

      }
    );


  document
    .getElementById("nextMonth")
    .addEventListener(
      "click",
      () => {

        calendarDate.setMonth(
          calendarDate.getMonth() + 1
        );

        renderCalendar();

      }
    );


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =====================================================
     NAVEGACIÓN
  ===================================================== */

  document
    .getElementById("navLists")
    .addEventListener(
      "click",
      () => {

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


  document
    .getElementById("navAgenda")
    .addEventListener(
      "click",
      () => {

        alert(
          "Aquí construiremos la Agenda."
        );

      }
    );


  document
    .getElementById("navDashboard")
    .addEventListener(
      "click",
      () => {

        alert(
          "Aquí construiremos el Dashboard."
        );

      }
    );


  /* =====================================================
     INICIALIZACIÓN
  ===================================================== */

  renderLists();

  renderListDropdown();

  renderCalendar();

  updateOverdueBadge();


  /* =====================================================
     SERVICE WORKER
  ===================================================== */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "service-worker.js"
          )
          .catch(
            error =>
              console.log(
                "Service Worker:",
                error
              )
          );

      }
    );

  }

</script>
