<script type="module">


/* =========================================================
   SUPABASE
   ========================================================= */

import {
  createClient
} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const SUPABASE_URL =
  'https://udvxmrbqymhrlaiojzex.supabase.co';


const SUPABASE_KEY =
  'sb_publishable_VaSGlZ8OA38jbM9QHCTwZw_eNVq__On';


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   HELPERS
   ========================================================= */

const $=s=>
  document.querySelector(s);


const S={

  todos:[],

  notes:[],

  lists:[

    {
      name:'Personal',
      secs:[]
    },

    {
      name:'Trabajo',
      secs:[]
    },

    {
      name:'Compras',
      secs:[]
    }

  ],

  view:'home',

  day:null,

  cur:0,

  user:null

};


let cloudReady=false;

let askingForName=false;


const arrow=
  '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';


const sd=d=>
  new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );


const key=d=>
  d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+
  String(d.getDate()).padStart(2,'0');


const esc=s=>
  String(s??'').replace(
    /[&<>"]/g,
    c=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'

    }[c])
  );


/* =========================================================
   NOMBRE DEL USUARIO
   ========================================================= */

const getUserName=()=>{

  const metadata=
    S.user?.user_metadata||{};

  const name=
    metadata.name||
    metadata.full_name||
    metadata.fullName||
    '';

  return String(name).trim();

};


/* =========================================================
   SALUDO
   ========================================================= */

const greeting=()=>{

  const h=
    new Date().getHours();

  const text=

    h<12
      ?'Buenos días'

      :h<19
        ?'Buenas tardes'

        :'Buenas noches';

  const name=
    getUserName();

  return name

    ?`${text}, ${esc(name)}`

    :text;

};


/* =========================================================
   FECHAS
   ========================================================= */

const at=t=>
  new Date(
    t.due+'T'+
    (t.time||'23:59')
  ).getTime();


const overdue=()=>
  S.todos.filter(
    t=>
      !t.done&&
      t.due&&
      at(t)<Date.now()
  );


const today=()=>
  S.todos.filter(
    t=>
      t.due===key(new Date())&&
      !(
        !t.done&&
        t.due&&
        at(t)<Date.now()
      )
  );


const soon=()=>{

  const e=
    sd(new Date()).getTime()+
    864e5;

  const l=
    e+
    1728e5;

  return S.todos.filter(t=>{

    if(!t.due)
      return false;

    const x=
      new Date(
        t.due+'T'+
        (t.time||'00:00')
      ).getTime();

    return x>=e&&x<=l;

  });

};


const upcoming=()=>
  S.todos

    .filter(
      t=>
        !t.done&&
        t.due&&
        at(t)>=Date.now()
    )

    .sort(
      (a,b)=>
        at(a)-at(b)
    )

    .slice(0,6);


const stat=n=>{

  const a=
    S.todos.filter(
      t=>t.list===n
    );

  const d=
    a.filter(
      t=>t.done
    ).length;

  return{

    total:a.length,

    done:d,

    p:a.length
      ?Math.round(
        d/a.length*100
      )
      :0

  };

};


const bar=p=>`

<div
  class="bar"
  role="progressbar"
  aria-valuenow="${p}"
  aria-valuemin="0"
  aria-valuemax="100">

  <i
    style="width:${p}%">
  </i>

</div>

`;


const opts=[

  ['lists','Mis listas',-22],

  ['settings','Ajustes',-11],

  ['about','Acerca de',0]

];


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

async function signInWithGoogle(){

  try{

    const {
      error
    }=
      await supabase.auth.signInWithOAuth({

        provider:'google',

        options:{

          redirectTo:
            window.location.origin

        }

      });


    if(error){

      console.error(
        'Google Login:',
        error
      );

      alert(
        'No se pudo iniciar sesión con Google:\n\n'+
        error.message
      );

    }

  }catch(error){

    console.error(error);

    alert(
      'Ocurrió un error al iniciar sesión.'
    );

  }

}


/* =========================================================
   NOMBRE
   ========================================================= */

async function askForName(){

  if(
    askingForName||
    getUserName()
  ){

    return true;

  }


  askingForName=true;


  let name='';


  while(!name){

    name=
      prompt(
        '¿Cómo te llamas?'
      );


    if(name===null){

      const continueWithoutName=
        confirm(
          'Necesitas ingresar un nombre para continuar con Nova List.'
        );


      if(!continueWithoutName){

        askingForName=false;

        await signOut();

        return false;

      }


      name='';

      continue;

    }


    name=
      name.trim();


    if(!name){

      alert(
        'Por favor, escribe tu nombre.'
      );

    }

  }


  try{

    const {
      data,
      error
    }=
      await supabase.auth.updateUser({

        data:{

   CLOUD
   ========================================================= */

async function loadCloud(){

  if(!S.user){

    render();

    return;

  }


  const uid=
    S.user.id;


  try{

    const [

      todosRes,

      notesRes,

      listsRes

    ]=
      await Promise.all([


        supabase

          .from('todos')

          .select('*')

          .eq(
            'user_id',
            uid
          )

          .order(
            'created_at',
            {
              ascending:true
            }
          ),


        supabase

          .from('notes')

          .select('*')

          .eq(
            'user_id',
            uid
          )

          .order(
            'created_at',
            {
              ascending:false
            }
          ),


        supabase

          .from('lists')

          .select('*')

          .eq(
            'user_id',
            uid
          )

          .order(
            'created_at',
            {
              ascending:true
            }
          )

    ]);


    /*
     * TO-DOS
     */

    if(todosRes.error){

      console.error(
        'ERROR TODOS:',
        todosRes.error
      );

    }else{

      S.todos=
        todosRes.data||[];

    }


    /*
     * NOTAS
     */

    if(notesRes.error){

      console.error(
        'ERROR NOTES:',
        notesRes.error
      );

    }else{

      S.notes=
        notesRes.data||[];

    }


    /*
     * LISTAS
     */

    if(listsRes.error){

      console.error(
        'ERROR LISTS:',
        listsRes.error
      );

    }else{

      if(
        listsRes.data&&
        listsRes.data.length
      ){

        S.lists=
          listsRes.data.map(
            l=>({

              id:l.id,

              name:l.name,

              secs:
                Array.isArray(l.secs)
                  ?l.secs
                  :[]

            })
          );

      }

    }


    /*
     * CREAR LISTAS INICIALES
     */

    if(

      !listsRes.error&&

      (
        !listsRes.data||
        !listsRes.data.length
      )

    ){

      const initial=[

        {
          name:'Personal',
          secs:[]
        },

        {
          name:'Trabajo',
          secs:[]
        },

        {
          name:'Compras',
          secs:[]
        }

      ];


      const rows=
        initial.map(
          l=>({

            user_id:uid,

            name:l.name,

            secs:l.secs

          })
        );


      const {
        data,
        error
      }=
        await supabase

          .from('lists')

          .insert(rows)

          .select();


      if(error){

        console.error(
          'ERROR CREANDO LISTAS:',
          error
        );

      }else{

        S.lists=
          (data||[]).map(
            l=>({

              id:l.id,

              name:l.name,

              secs:
                Array.isArray(l.secs)
                  ?l.secs
                  :[]

            })
          );

      }

    }


    cloudReady=true;


  }catch(error){

    console.error(
      'ERROR GENERAL SUPABASE:',
      error
    );

  }


  /*
   * SIEMPRE MOSTRAR LA APP
   */

  render();

}

   ========================================================= */

function getLocalData(){

  try{

    return JSON.parse(
      localStorage.getItem('nova')||'null'
    );

  }catch(error){

    console.error(error);

    return null;

  }

}


async function migrateLocalData(){

  if(!S.user)
    return;


  const local=
    getLocalData();


  if(!local)
    return;


  const hasLocal=

    (
      local.todos&&
      local.todos.length
    )

    ||

    (
      local.notes&&
      local.notes.length
    )

    ||

    (
      local.lists&&
      local.lists.length
    );


  if(!hasLocal)
    return;


  const answer=
    confirm(
      'Encontramos datos guardados anteriormente en este dispositivo. ¿Quieres subirlos a tu cuenta de Nova List?'
    );


  if(!answer)
    return;


  const uid=
    S.user.id;


  if(local.todos?.length){

    for(
      const t of local.todos
    ){

      const id=
        typeof t.id==='string'&&
        t.id.includes('-')

          ?t.id

          :crypto.randomUUID();


      await supabase

        .from('todos')

        .upsert({

          id:id,

          user_id:uid,

          title:t.title||'',

          list:t.list||'',

          sec:t.sec||'',

          due:t.due||null,

          time:t.time||null,

          done:!!t.done

        });

    }

  }


  if(local.notes?.length){

    for(
      const n of local.notes
    ){

      const id=
        typeof n.id==='string'&&
        n.id.includes('-')

          ?n.id

          :crypto.randomUUID();


      await supabase

        .from('notes')

        .upsert({

          id:id,

          user_id:uid,

          text:n.text||''

        });

    }

  }


  if(local.lists?.length){

    for(
      const l of local.lists
    ){

      await supabase

        .from('lists')

        .insert({

          user_id:uid,

          name:l.name||'Sin nombre',

          secs:
            Array.isArray(l.secs)
              ?l.secs
              :[]

        });

    }

  }


  localStorage.removeItem('nova');


  await loadCloud();

}

/* =========================================================
   CALENDARIO
   ========================================================= */

function calendar(){

  const n=
    new Date();


  const y=
    n.getFullYear();


  const m=
    n.getMonth();


  const first=
    new Date(
      y,
      m,
      1
    ).getDay();


  const dim=
    new Date(
      y,
      m+1,
      0
    ).getDate();


  const due=
    new Set(
      S.todos
        .map(t=>t.due)
        .filter(Boolean)
    );


  let c='';


  [
    'D',
    'L',
    'M',
    'M',
    'J',
    'V',
    'S'

  ].forEach(
    d=>
      c+=`<b>${d}</b>`
  );


  for(
    let i=0;
    i<first;
    i++
  ){

    c+=
      '<span></span>';

  }


  for(
    let d=1;
    d<=dim;
    d++
  ){

    const k=
      key(
        new Date(
          y,
          m,
          d
        )
      );


    c+=`

      <button

        data-day="${k}"

        aria-label="Día ${d}"

        class="${
          d===n.getDate()
            ?'today'
            :''
        } ${
          due.has(k)
            ?'has'
            :''
        }">

        ${d}

      </button>

    `;

  }


  const month=
    n.toLocaleDateString(
      'es',
      {
        month:'long',
        year:'numeric'
      }
    );


  return `

    <div class="cal">

      <h3>
        ${
          month.charAt(0)
            .toUpperCase()+
          month.slice(1)
        }
      </h3>

      <div class="grid">

        ${c}

      </div>

    </div>

  `;

}

                ?`

                  <h3 class="sec">

                    ${
                      g
                        ?esc(g)
                        :'Sin subtítulo'
                    }

                  </h3>

                `

                :''
              )


              +


              items(a)


              +


              `

                <div class="add">

                  <input
                    placeholder="Agregar tarea">


                  <button
                    data-addt="${i}"
                    aria-label="Agregar tarea">

                    +

                  </button>

                </div>

              `;

          }
        ).join('')

      }


      <h3 class="sec">
        Nuevo subtítulo
      </h3>


      <div class="add">

        <input
          placeholder="Ej. Esta semana">


        <button
          data-addsec
          aria-label="Crear subtítulo">

          +

        </button>

      </div>


      <p style="margin-top:32px">

        <button
          class="pri"
          data-go="lists">

          Listo

        </button>

      </p>


      <p style="margin-top:28px">

        <button
          class="n2t"
          data-dellist>

          Eliminar esta lista

        </button>

      </p>

    `

  );

},


settings:()=>page(

  'Ajustes',


  `

    <button
      class="pri"
      data-theme>

      Cambiar claro / oscuro

    </button>


    <p style="margin-top:20px">

      <button
        class="n2t"

    <p style="margin-top:28px">

        class="n2t"

  `

),


about:()=>page(

      para ordenar notas, pendientes y

)

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  try{

    $('#app').innerHTML=
      V[S.view]();

    window.scrollTo(
      0,
      0
    );

  }catch(error){

    console.error(
      'ERROR RENDER:',
      error
    );


    $('#app').innerHTML=`

      <div
        style="
          padding-top:60px;
          text-align:center
        ">

        <h2>
          Nova-List
        </h2>

        <p
          style="
            color:var(--mut);
            margin-top:12px
          ">

          Ocurrió un problema al cargar
          la interfaz.

        </p>

        <button
          class="pri"
          style="margin-top:24px"
          onclick="location.reload()">

          Recargar

        </button>

      </div>

    `;

  }

}


function go(v){

  S.view=
    v;

  render();

}


const keep=()=>{

  const y=
    window.scrollY;


  render();


  window.scrollTo(
    0,
    y
  );

};


/* =========================================================
   EVENTOS
   ========================================================= */

document.addEventListener(
  'click',
  async e=>{

    const t=
      e.target.closest('button');


    const menu=
      $('#menu');


    const open=
      menu&&
      menu.classList.contains(
        'open'
      );


    if(

      open&&

      !(

        t&&
        t.classList.contains('opt')

      )

    ){

      menu.classList.remove(
        'open'
      );

    }


    if(!t)
      return;


    const D=
      t.dataset;


    if(
      t.id==='googleLogin'
    ){

      await signInWithGoogle();

      return;

    }


    if(
      t.hasAttribute(
        'data-logout'
      )
    ){

      await signOut();

      return;

    }


    if(
      t.hasAttribute(
        'data-changename'
      )
    ){

      await changeName();

      return;

    }


    if(
      t.classList.contains(
        'opt'
      )
    ){

      if(!open){

        menu.classList.add(
          'open'
        );

        return;

      }


      return go(D.go);

    }


    if(D.go)
      return go(D.go);


    if(D.day){

      S.day=
        D.day;

      return go('day');

    }


    if(
      D.open!==undefined
    ){

      S.cur=
        +D.open;

      return go('list');

    }


    if(D.done){

      const x=
        S.todos.find(
          i=>i.id===D.done
        );


      if(!x)
        return;


      x.done=
        !x.done;


      await saveTodo(x);


      return keep();

    }


    if(D.del){

      S.todos=
        S.todos.filter(
          i=>i.id!==D.del
        );


      await deleteTodo(
        D.del
      );


      return keep();

    }


    if(D.delnote){

      S.notes=
        S.notes.filter(
          i=>i.id!==D.delnote
        );


      await deleteNote(
        D.delnote
      );


      return render();

    }


    if(D.n2t){

      const n=
        S.notes.find(
          i=>i.id===D.n2t
        );


      if(!n)
        return;


      const todo={

        id:crypto.randomUUID(),

        title:
          n.text.slice(
            0,
            120
          ),

        list:
          S.lists[0]?.name||
          'Personal',

        sec:'',

        due:
          key(new Date()),

        time:'',

        done:false

      };


      S.todos.push(
        todo
      );


      S.notes=
        S.notes.filter(
          i=>i!==n
        );


      await saveTodo(
        todo
      );


      await deleteNote(
        n.id
      );


      return keep();

    }


    if(
      t.hasAttribute(
        'data-addnote'
      )
    ){

      const v=
        $('#nt')
          .value
          .trim();


      if(!v){

        $('#nt').focus();

        return;

      }


      const note={

        id:crypto.randomUUID(),

        text:v

      };


      S.notes.unshift(
        note
      );


      await saveNote(
        note
      );


      return render();

    }


    if(
      t.hasAttribute(
        'data-newlist'
      )
    ){

      const v=
        $('#nl')
          .value
          .trim();


      if(

        !v||

        S.lists.some(
          l=>l.name===v
        )

      ){

        $('#nl').focus();

        return;

      }


      const list={

        name:v,

        secs:[]

      };


      await saveList(
        list
      );


      S.lists.push(
        list
      );


      return render();

    }


    if(
      D.addt!==undefined
    ){

      const l=
        S.lists[S.cur];


      if(!l)
        return;


      const input=
        t.previousElementSibling;


      const v=
        input.value.trim();


      if(!v){

        input.focus();

        return;

      }


      const todo={

        id:crypto.randomUUID(),

        title:v,

        list:l.name,

        sec:
          [
            '',
            ...l.secs
          ][+D.addt],

        due:'',

        time:'',

        done:false

      };


      S.todos.push(
        todo
      );


      await saveTodo(
        todo
      );


      return keep();

    }


    if(
      t.hasAttribute(
        'data-addsec'
      )
    ){

      const l=
        S.lists[S.cur];


      if(!l)
        return;


      const input=
        t.previousElementSibling;


      const v=
        input.value.trim();


      if(

        !v||

        l.secs.includes(v)

      ){

        input.focus();

        return;

      }


      l.secs.push(
        v
      );


      await saveList(
        l
      );


      return keep();

    }


    if(
      t.hasAttribute(
        'data-dellist'
      )
    ){

      const l=
        S.lists[S.cur];


      if(

        !l||

        S.lists.length<2||

        !confirm(
          '¿Eliminar "'+
          l.name+
          '" y sus tareas?'
        )

      ){

        return;

      }


      const oldTodos=
        S.todos.filter(
          x=>x.list===l.name
        );


      S.todos=
        S.todos.filter(
          x=>x.list!==l.name
        );


      for(
        const todo of oldTodos
      ){

        await deleteTodo(
          todo.id
        );

      }


      await deleteList(
        l.id
      );


      S.lists.splice(
        S.cur,
        1
      );


      return go('lists');

    }


    if(

      t.hasAttribute(
        'data-addtodo'
      )

      ||

      t.hasAttribute(
        'data-addday'
      )

    ){

      const v=
        $('#ti')
          .value
          .trim();


      if(!v){

        $('#ti').focus();

        return;

      }


      const inDay=
        t.hasAttribute(
          'data-addday'
        );


      const todo={

        id:crypto.randomUUID(),

        title:v,

        list:
          $('#tl').value,

        sec:'',

        due:

          inDay

            ?S.day

            :(
              $('#td').value||
              key(new Date())
            ),

        time:
          $('#tt').value,

        done:false

      };


      S.todos.push(
        todo
      );


      await saveTodo(
        todo
      );


      return inDay
        ?render()
        :go('home');

    }


    if(
      t.hasAttribute(
        'data-theme'
      )
    ){

      const r=
        document.documentElement;


      const current=
        r.dataset.theme;


      if(current==='dark'){

        r.dataset.theme=
          'light';

      }else{

        r.dataset.theme=
          'dark';

      }


      return;

    }

  }
);

   AUTH STATE
   ========================================================= */

supabase.auth.onAuthStateChange(
  (event,session)=>{

    setTimeout(
      async()=>{

        try{

          if(session?.user){

            S.user=
              session.user;


            $('#auth')
              .classList
              .remove('show');


            if(
              !getUserName()
            ){

              const ok=
                await askForName();


              if(!ok)
                return;

            }


            if(!cloudReady){

              await loadCloud();

              await migrateLocalData();

            }else{

              render();

            }

          }else{

            S.user=
              null;


            $('#auth')
              .classList
              .add('show');


            $('#app')
              .innerHTML='';

          }

        }catch(error){

          console.error(
            'AUTH ERROR:',
            error
          );


          render();

        }

      },
      0
    );

  }
);


/* =========================================================
   INICIO
   ========================================================= */

async function init(){

  try{

    const {
      data:{
        session
      }
    }=
      await supabase.auth.getSession();


    if(session?.user){

      S.user=
        session.user;


      $('#auth')
        .classList
        .remove('show');


      if(
        !getUserName()
      ){

        const ok=
          await askForName();


        if(!ok)
          return;

      }


      await loadCloud();


      await migrateLocalData();


    }else{

      $('#auth')
        .classList
        .add('show');

    }


  }catch(error){

    console.error(
      'INIT ERROR:',
      error
    );


    /*
     * Si Supabase falla,
     * mostramos la pantalla de login
     * en lugar de dejar la aplicación
     * completamente en blanco.
     */

    $('#auth')
      .classList
      .add('show');

  }


  $('#loading')
    .classList
    .add('hide');

}


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
  'keydown',
  e=>{

    if(e.key==='Escape'){

      $('#menu')
        ?.classList
        .remove('open');

    }

  }
);


/* =========================================================
   ACTUALIZACIÓN DEL SALUDO
   ========================================================= */

setInterval(
  ()=>{

    if(

      S.view==='home'&&

      !$('#menu')
        ?.classList
        .contains('open')

    ){

      keep();

    }

  },
  60000
);


/* =========================================================
   START
   ========================================================= */

init();

</script>
