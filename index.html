<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Nova List - INCOROVA">

    <link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" sizes="180x180" href="nova-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="nova-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="nova-icon.png">

    <title>Nova List</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        .app {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 25px 20px 100px;
        }

        /* HEADER */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .menu {
            width: 42px;
            height: 42px;
            border: 1px solid #111111;
            border-radius: 50%;
            background: #ffffff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            display: block;
            width: auto;
            height: 32px;
            max-width: 180px;
            object-fit: contain;
        }

        .space {
            width: 42px;
        }

        /* DATE */

        .date {
            color: #777777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        /* TITLE */

        h1 {
            font-size: 32px;
            margin-bottom: 28px;
        }

        /* ADD TASK */

        .add {
            display: flex;
            border: 1px solid #dddddd;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .add input {
            flex: 1;
            border: none;
            outline: none;
            padding: 16px;
            font-size: 15px;
            background: #ffffff;
        }

        .add button {
            width: 55px;
            border: none;
            background: #111111;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 35px;
        }

        .stat {
            border: 1px solid #e2e2e2;
            border-radius: 14px;
            padding: 15px;
        }

        .number {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .label {
            color: #777777;
            font-size: 12px;
        }

        /* SECTION */

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title h2 {
            font-size: 18px;
        }

        .section-title span {
            color: #777777;
            font-size: 12px;
        }

        /* TASKS */

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border: 1px solid #e1e1e1;
            border-radius: 14px;
            background: #ffffff;
        }

        .check {
            width: 22px;
            height: 22px;
            border: 1px solid #111111;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task.done .check {
            background: #111111;
        }

        .task-title {
            flex: 1;
            font-size: 15px;
        }

        .task.done .task-title {
            text-decoration: line-through;
            color: #999999;
        }

        .delete {
            border: none;
            background: none;
            color: #999999;
            font-size: 20px;
            cursor: pointer;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 35px 20px;
            color: #888888;
            border: 1px dashed #dddddd;
            border-radius: 14px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .app {
                padding: 20px 16px 80px;
            }

            h1 {
                font-size: 28px;
            }

            .stats {
                gap: 8px;
            }

            .stat {
                padding: 12px;
            }

            .number {
                font-size: 21px;
            }

            .logo img {
                height: 28px;
                max-width: 150px;
            }

        }

    </style>
</head>

<body>

<div class="app">

    <header>

        <button
            class="menu"
            onclick="openMenu()"
            aria-label="Abrir menú"
        >
            ⋯
        </button>

        <div class="logo">
            <img
                src="nova-logo.png"
                alt="Nova List"
            >
        </div>

        <div class="space"></div>

    </header>


    <div
        class="date"
        id="date"
    ></div>


    <h1>
        Mis pendientes
    </h1>


    <div class="add">

        <input
            id="taskInput"
            type="text"
            placeholder="¿Qué necesitas hacer?"
            autocomplete="off"
        >

        <button
            onclick="addTask()"
            aria-label="Agregar tarea"
        >
            +
        </button>

    </div>


    <div class="stats">

        <div class="stat">

            <div
                class="number"
                id="total"
            >
                0
            </div>

            <div class="label">
                Pendientes
            </div>

        </div>


        <div class="stat">

            <div
                class="number"
                id="completed"
            >
                0
            </div>

            <div class="label">
                Completadas
            </div>

        </div>


        <div class="stat">

            <div
                class="number"
                id="remaining"
            >
                0
            </div>

            <div class="label">
                Restantes
            </div>

        </div>

    </div>


    <div class="section-title">

        <h2>
            Mis tareas
        </h2>

        <span id="count">
            0 tareas
        </span>

    </div>


    <div
        class="tasks"
        id="tasks"
    ></div>

</div>


<script>

    /* =========================
       DATOS
    ========================= */

    let tasks =
        JSON.parse(
            localStorage.getItem("novaListTasks")
        ) || [];


    /* =========================
       GUARDAR
    ========================= */

    function save() {

        localStorage.setItem(
            "novaListTasks",
            JSON.stringify(tasks)
        );

    }


    /* =========================
       AGREGAR TAREA
    ========================= */

    function addTask() {

        const input =
            document.getElementById("taskInput");

        const title =
            input.value.trim();

        if (!title) {
            return;
        }

        tasks.unshift({

            id: Date.now(),

            title: title,

            completed: false

        });

        input.value = "";

        save();

        render();

    }


    /* =========================
       COMPLETAR TAREA
    ========================= */

    function toggleTask(id) {

        tasks = tasks.map(task => {

            if (task.id === id) {

                task.completed =
                    !task.completed;

            }

            return task;

        });

        save();

        render();

    }


    /* =========================
       ELIMINAR TAREA
    ========================= */

    function deleteTask(id) {

        tasks =
            tasks.filter(
                task => task.id !== id
            );

        save();

        render();

    }


    /* =========================
       MOSTRAR TAREAS
    ========================= */

    function render() {

        const container =
            document.getElementById("tasks");


        if (tasks.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No tienes pendientes todavía.
                </div>
            `;

        } else {

            container.innerHTML =
                tasks.map(task => `

                    <div class="task ${
                        task.completed
                            ? "done"
                            : ""
                    }">

                        <button
                            class="check"
                            onclick="toggleTask(${task.id})"
                            aria-label="Completar tarea"
                        ></button>

                        <div class="task-title">
                            ${escapeHTML(task.title)}
                        </div>

                        <button
                            class="delete"
                            onclick="deleteTask(${task.id})"
                            aria-label="Eliminar tarea"
                        >
                            ×
                        </button>

                    </div>

                `).join("");

        }

        updateStats();

    }


    /* =========================
       ESTADÍSTICAS
    ========================= */

    function updateStats() {

        const total =
            tasks.length;


        const completed =
            tasks.filter(
                task => task.completed
            ).length;


        const remaining =
            total - completed;


        document.getElementById("total")
            .textContent = total;


        document.getElementById("completed")
            .textContent = completed;


        document.getElementById("remaining")
            .textContent = remaining;


        document.getElementById("count")
            .textContent =
            `${total} ${
                total === 1
                    ? "tarea"
                    : "tareas"
            }`;

    }


    /* =========================
       SEGURIDAD HTML
    ========================= */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /* =========================
       MENÚ
    ========================= */

    function openMenu() {

        alert(
            "El menú de Nova List estará disponible próximamente."
        );

    }


    /* =========================
       ENTER PARA AGREGAR
    ========================= */

    document
        .getElementById("taskInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            }
        );


    /* =========================
       FECHA
    ========================= */

    const today =
        new Date();


    document.getElementById("date")
        .textContent =
        today.toLocaleDateString(
            "es-ES",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        );


    /* =========================
       INICIAR APP
    ========================= */

    render();


    /* =========================
       SERVICE WORKER
    ========================= */

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function() {

                navigator.serviceWorker.register(
                    "service-worker.js"
                );

            }
        );

    }

</script>

</body>
</html>
