<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Nova-List - una APP de Incorova"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="/nova-icon.png"
    >

    <title>Nova-List</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #777777;
            --border: #e8e8e8;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            background: #ffffff;

            color: #000000;

            font-family:
                "Geometric Sans",
                "Century Gothic",
                "Avenir Next",
                Avenir,
                Montserrat,
                Arial,
                sans-serif;

            overflow: hidden;
        }


        /* =========================
           PÁGINA
        ========================= */

        .nova-page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            background: #ffffff;

            overflow: hidden;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        .header {

            position: absolute;

            top: 38px;

            left: 50%;

            transform:
                translateX(-50%);

            text-align: center;

            z-index: 10;

            white-space: nowrap;
        }


        .brand-name {

            font-size:
                clamp(34px, 5vw, 62px);

            font-weight: 500;

            letter-spacing: -3px;

            line-height: 1;
        }


        .brand-subtitle {

            margin-top: 10px;

            font-size: 10px;

            letter-spacing: 2.7px;

            color: #777777;
        }


        /* =========================
           NOTIFICACIONES
        ========================= */

        .notification-panel {

            position: absolute;

            top: 35px;

            right: 35px;

            width: 260px;

            z-index: 20;

            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .notification {

            width: 100%;

            padding: 16px 18px;

            border: 1px solid var(--border);

            background: #ffffff;

            opacity: 0;

            transform:
                translateY(-30px);

            animation:
                notificationIn
                .8s cubic-bezier(.16,1,.3,1)
                forwards;
        }


        .notification:nth-child(1) {
            animation-delay: .15s;
        }


        .notification:nth-child(2) {
            animation-delay: .35s;
        }


        .notification:nth-child(3) {
            animation-delay: .55s;
        }


        .notification-label {

            font-size: 8px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #888888;

            margin-bottom: 7px;
        }


        .notification-title {

            font-size: 13px;

            font-weight: 500;
        }


        .notification-time {

            margin-top: 6px;

            font-size: 10px;

            color: #777777;
        }


        @keyframes notificationIn {

            from {

                opacity: 0;

                transform:
                    translateY(-30px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           MENÚ
        ========================= */

        .menu {

            position: fixed;

            top: 0;

            left: 0;

            width: 500px;

            height: 250px;

            z-index: 50;

            pointer-events: none;
        }


        /* =========================
           BOTÓN
        ========================= */

        .menu-trigger {

            position: absolute;

            top: 0;

            left: 0;

            width: 58px;

            height: 58px;

            border: none;

            background: transparent;

            cursor: pointer;

            pointer-events: auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .trigger-dots {

            position: relative;

            width: 22px;

            height: 8px;

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: space-between;

            transition:
                transform .7s cubic-bezier(.16,1,.3,1);
        }


        .trigger-dot {

            width: 4px;

            height: 4px;

            background: #000000;

            border-radius: 50%;

            transition:
                transform .7s cubic-bezier(.16,1,.3,1),
                opacity .3s ease;
        }


        /* Hover */

        @media (hover: hover) {

            .menu-trigger:hover
            .trigger-dots {

                width: 28px;
            }

        }


        /* =========================
           OPCIONES
        ========================= */

        .options {

            position: absolute;

            top: 58px;

            left: 0;

            width: 450px;

            height: 170px;
        }


        .option {

            position: absolute;

            left: 0;

            width: 450px;

            height: 45px;

            pointer-events: none;
        }


        /*
         * Posiciones verticales
         */

        .option:nth-child(1) {
            top: 0;
        }


        .option:nth-child(2) {
            top: 55px;
        }


        .option:nth-child(3) {
            top: 110px;
        }


        /* =========================
           PUNTO DE CADA OPCIÓN
        ========================= */

        .option-dot {

            position: absolute;

            left: 27px;

            top: 50%;

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background: #000000;

            opacity: 0;

            transform:
                translate(-27px, -50%);

            transition:
                opacity .2s ease,
                transform .75s cubic-bezier(.16,1,.3,1);
        }


        /* =========================
           LÍNEA
        ========================= */

        .option-line {

            position: absolute;

            left: 31px;

            top: 50%;

            width: 0;

            height: 1px;

            background: #000000;

            transform:
                translateY(-50%);

            transition:
                width .7s cubic-bezier(.16,1,.3,1);
        }


        /* =========================
           TEXTO
        ========================= */

        .option-text {

            position: absolute;

            left: 31px;

            top: 50%;

            transform:
                translateY(-50%)
                translateX(12px);

            margin-left: 15px;

            font-size: 10px;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity .35s ease,
                transform .45s cubic-bezier(.16,1,.3,1);
        }


        /* =========================
           ABRIR MENÚ
        ========================= */

        .menu.open {

            pointer-events: auto;
        }


        /*
         * Cada punto sale del botón
         * y baja hasta su posición.
         */

        .menu.open
        .option {

            pointer-events: auto;
        }


        .menu.open
        .option-dot {

            opacity: 1;

            transform:
                translate(0, -50%);
        }


        /*
         * El primer punto llega primero.
         */

        .menu.open
        .option:nth-child(1)
        .option-dot {

            transition-delay: .05s;
        }


        .menu.open
        .option:nth-child(2)
        .option-dot {

            transition-delay: .25s;
        }


        .menu.open
        .option:nth-child(3)
        .option-dot {

            transition-delay: .45s;
        }


        /*
         * La línea aparece después
         * de que el punto llega.
         */

        .menu.open
        .option:nth-child(1)
        .option-line {

            width: 210px;

            transition-delay: .65s;
        }


        .menu.open
        .option:nth-child(2)
        .option-line {

            width: 250px;

            transition-delay: .85s;
        }


        .menu.open
        .option:nth-child(3)
        .option-line {

            width: 290px;

            transition-delay: 1.05s;
        }


        /*
         * El texto aparece solamente
         * cuando la línea terminó.
         */

        .menu.open
        .option:nth-child(1)
        .option-text {

            opacity: 1;

            transform:
                translateY(-50%)
                translateX(0);

            transition-delay: 1.35s;
        }


        .menu.open
        .option:nth-child(2)
        .option-text {

            opacity: 1;

            transform:
                translateY(-50%)
                translateX(0);

            transition-delay: 1.55s;
        }


        .menu.open
        .option:nth-child(3)
        .option-text {

            opacity: 1;

            transform:
                translateY(-50%)
                translateX(0);

            transition-delay: 1.75s;
        }


        /* =========================
           PUNTOS ORIGINALES
        ========================= */

        .menu.open
        .trigger-dot {

            opacity: 0;
        }


        /*
         * Los tres puntos originales
         * salen visualmente de su lugar
         * para dar sensación de que
         * cada uno se convierte en
         * una opción.
         */

        .menu.open
        .trigger-dot:nth-child(1) {

            transform:
                translate(
                    0,
                    0
                );
        }


        .menu.open
        .trigger-dot:nth-child(2) {

            transform:
                translate(
                    0,
                    0
                );
        }


        .menu.open
        .trigger-dot:nth-child(3) {

            transform:
                translate(
                    0,
                    0
                );
        }


        /* =========================
           CERRAR
        ========================= */

        .menu:not(.open)
        .option-dot {

            opacity: 0;

            transform:
                translate(-27px, -50%);

            transition-delay: 0s;
        }


        .menu:not(.open)
        .option-line {

            width: 0;

            transition-delay: 0s;
        }


        .menu:not(.open)
        .option-text {

            opacity: 0;

            transform:
                translateY(-50%)
                translateX(12px);

            transition-delay: 0s;
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .header {

                top: 30px;
            }


            .brand-name {

                font-size: 40px;

                letter-spacing: -2px;
            }


            .brand-subtitle {

                font-size: 8px;

                letter-spacing: 2px;
            }


            .notification-panel {

                top: 100px;

                right: 15px;

                width: 210px;
            }


            .notification {

                padding: 13px 15px;
            }


            .notification-title {

                font-size: 12px;
            }


            .menu {

                width: 350px;
            }


            .options {

                width: 330px;
            }


            .option {

                width: 330px;
            }


            .menu.open
            .option:nth-child(1)
            .option-line {

                width: 150px;
            }


            .menu.open
            .option:nth-child(2)
            .option-line {

                width: 185px;
            }


            .menu.open
            .option:nth-child(3)
            .option-line {

                width: 220px;
            }

        }

    </style>

</head>


<body>


<div class="nova-page">


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header class="header">

        <h1 class="brand-name">
            Nova-List
        </h1>

        <p class="brand-subtitle">
            una APP de Incorova
        </p>

    </header>


    <!-- =========================
         NOTIFICACIONES
    ========================== -->

    <aside class="notification-panel">

        <div class="notification">

            <div class="notification-label">
                Próximo
            </div>

            <div class="notification-title">
                Revisar pendiente
            </div>

            <div class="notification-time">
                Requiere atención
            </div>

        </div>


        <div class="notification">

            <div class="notification-label">
                Hoy
            </div>

            <div class="notification-title">
                Tarea pendiente
            </div>

            <div class="notification-time">
                Próxima a vencer
            </div>

        </div>


        <div class="notification">

            <div class="notification-label">
                Atención
            </div>

            <div class="notification-title">
                Tienes un pendiente
            </div>

            <div class="notification-time">
                Revisar ahora
            </div>

        </div>

    </aside>


    <!-- =========================
         MENÚ
    ========================== -->

    <div
        class="menu"
        id="menu"
    >


        <!-- BOTÓN -->

        <button
            class="menu-trigger"
            id="menuTrigger"
            aria-label="Abrir menú"
            aria-expanded="false"
        >

            <span class="trigger-dots">

                <span class="trigger-dot"></span>

                <span class="trigger-dot"></span>

                <span class="trigger-dot"></span>

            </span>

        </button>


        <!-- OPCIONES -->

        <nav class="options">


            <div class="option">

                <span class="option-dot"></span>

                <span class="option-line"></span>

                <span class="option-text">
                    Listas
                </span>

            </div>


            <div class="option">

                <span class="option-dot"></span>

                <span class="option-line"></span>

                <span class="option-text">
                    Notas
                </span>

            </div>


            <div class="option">

                <span class="option-dot"></span>

                <span class="option-line"></span>

                <span class="option-text">
                    Dashboard
                </span>

            </div>


        </nav>

    </div>


</div>


<script>


    const menu =
        document.getElementById(
            "menu"
        );


    const menuTrigger =
        document.getElementById(
            "menuTrigger"
        );


    menuTrigger.addEventListener(
        "click",
        function() {

            const isOpen =
                menu.classList.toggle(
                    "open"
                );


            menuTrigger.setAttribute(
                "aria-expanded",
                isOpen
            );

        }
    );


    /*
     * Service Worker
     */

    if (
        "serviceWorker"
        in navigator
    ) {

        window.addEventListener(
            "load",
            function() {

                navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            }
        );

    }

</script>


</body>

</html>
