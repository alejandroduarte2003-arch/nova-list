<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Nova-List</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/nova-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #000000;
    }

    body {
      font-family:
        "Geometric Sans",
        "Century Gothic",
        "Avenir Next",
        Avenir,
        Montserrat,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      white-space: nowrap;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      opacity: 0.55;
    }


    /* =========================
       NOTIFICACIONES
    ========================= */

    .notification-panel {
      position: fixed;
      top: 30px;
      right: 24px;
      width: 145px;
      z-index: 15;
    }

    .notification {
      padding: 9px 0;
      border-bottom: 1px solid #000000;

      opacity: 0;
      transform: translateY(-15px);

      animation: notificationIn 0.7s ease forwards;
    }

    .notification:nth-child(2) {
      animation-delay: 0.2s;
    }

    .notification:nth-child(3) {
      animation-delay: 0.4s;
    }

    .notification-label {
      font-size: 7px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.45;
      margin-bottom: 3px;
    }

    .notification-title {
      font-size: 10px;
      letter-spacing: 0.03em;
    }

    .notification-time {
      margin-top: 3px;
      font-size: 7px;
      opacity: 0.45;
    }

    @keyframes notificationIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       MENU
    ========================= */

    .menu {
      position: fixed;
      top: 112px;
      left: 0;
      width: 330px;
      height: 190px;
      z-index: 30;
    }

    .menu-trigger {
      position: absolute;
      top: 0;
      left: 0;

      width: 45px;
      height: 35px;

      border: none;
      background: transparent;

      cursor: pointer;
      padding: 0;
    }

    .trigger-dots {
      position: absolute;
      top: 14px;
      left: 0;

      display: flex;
      gap: 5px;

      transition: opacity 0.2s ease;
    }

    .trigger-dot {
      width: 5px;
      height: 5px;
      background: #000000;
      border-radius: 50%;

      transition:
        transform 0.8s cubic-bezier(.65,0,.35,1),
        opacity 0.3s ease;
    }


    /* =========================
       OPCIONES
    ========================= */

    .options {
      position: absolute;
      top: 0;
      left: 0;

      width: 320px;
      height: 180px;

      pointer-events: none;
    }

    .option {
      position: absolute;
      left: 0;

      height: 25px;
      display: flex;
      align-items: center;

      opacity: 0;
    }

    .option:nth-child(1) {
      top: 43px;
    }

    .option:nth-child(2) {
      top: 82px;
    }

    .option:nth-child(3) {
      top: 121px;
    }


    /* =========================
       PUNTO DE CADA OPCIÓN
    ========================= */

    .option-dot {
      position: absolute;
      left: 0;

      width: 5px;
      height: 5px;

      border-radius: 50%;
      background: #000000;

      opacity: 0;

      transform: translateY(-40px);

      transition:
        transform 0.7s cubic-bezier(.65,0,.35,1),
        opacity 0.25s ease;
    }


    /* =========================
       LÍNEA
    ========================= */

    .option-line {
      position: absolute;

      left: 10px;
      top: 50%;

      width: 0;
      height: 1px;

      background: #000000;

      transform: translateY(-50%);

      transition:
        width 0.45s cubic-bezier(.65,0,.35,1);
    }


    /* =========================
       TEXTO
    ========================= */

    .option-text {
      position: absolute;

      left: 43px;

      font-size: 11px;
      letter-spacing: 0.08em;

      white-space: nowrap;

      opacity: 0;
      transform: translateX(-5px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }


    /* =========================
       X PARA CERRAR
    ========================= */

    .close-menu {
      position: absolute;

      top: 0;
      left: 0;

      width: 24px;
      height: 24px;

      border: none;
      background: transparent;

      cursor: pointer;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s ease;
    }

    .close-menu::before,
    .close-menu::after {
      content: "";

      position: absolute;

      top: 11px;
      left: 5px;

      width: 13px;
      height: 1px;

      background: #000000;
    }

    .close-menu::before {
      transform: rotate(45deg);
    }

    .close-menu::after {
      transform: rotate(-45deg);
    }


    /* =========================
       MENU ABIERTO
    ========================= */

    .menu.open .trigger-dots {
      opacity: 0;
      pointer-events: none;
    }

    .menu.open .option {
      opacity: 1;
    }

    /* Punto 1 */
    .menu.open .option:nth-child(1) .option-dot {
      opacity: 1;
      transform: translateY(0);

      transition-delay: 0.05s;
    }

    /* Punto 2 */
    .menu.open .option:nth-child(2) .option-dot {
      opacity: 1;
      transform: translateY(0);

      transition-delay: 0.28s;
    }

    /* Punto 3 */
    .menu.open .option:nth-child(3) .option-dot {
      opacity: 1;
      transform: translateY(0);

      transition-delay: 0.51s;
    }


    /* Líneas más cortas */

    .menu.open .option:nth-child(1) .option-line {
      width: 22px;
      transition-delay: 0.72s;
    }

    .menu.open .option:nth-child(2) .option-line {
      width: 22px;
      transition-delay: 0.95s;
    }

    .menu.open .option:nth-child(3) .option-line {
      width: 22px;
      transition-delay: 1.18s;
    }


    /* Texto aparece después de la línea */

    .menu.open .option:nth-child(1) .option-text {
      opacity: 1;
      transform: translateX(0);
      transition-delay: 1.17s;
    }

    .menu.open .option:nth-child(2) .option-text {
      opacity: 1;
      transform: translateX(0);
      transition-delay: 1.40s;
    }

    .menu.open .option:nth-child(3) .option-text {
      opacity: 1;
      transform: translateX(0);
      transition-delay: 1.63s;
    }


    /* X */

    .menu.open .close-menu {
      opacity: 1;
      pointer-events: auto;

      transition-delay: 1.75s;
    }


    /* =========================
       CIERRE
    ========================= */

    .menu.closing .option-text {
      opacity: 0;
      transform: translateX(-5px);
      transition-delay: 0s;
    }

    .menu.closing .option-line {
      width: 0;
      transition-delay: 0.08s;
    }

    .menu.closing .option-dot {
      opacity: 0;
      transform: translateY(-40px);

      transition-delay: 0.25s;
    }

    .menu.closing .close-menu {
      opacity: 0;
      pointer-events: none;
    }

    .menu.closing .trigger-dots {
      opacity: 1;

      transition-delay: 0.65s;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .header {
        top: 25px;
      }

      .brand-name {
        font-size: 21px;
      }

      .notification-panel {
        top: 27px;
        right: 17px;
        width: 115px;
      }

      .menu {
        top: 105px;
      }
    }

  </style>
</head>


<body>

  <!-- HEADER -->

  <header class="header">
    <h1 class="brand-name">Nova-List</h1>
    <p class="brand-subtitle">una APP de Incorova</p>
  </header>


  <!-- NOTIFICACIONES -->

  <aside class="notification-panel">

    <div class="notification">
      <div class="notification-label">Próximo</div>
      <div class="notification-title">Revisar pendiente</div>
      <div class="notification-time">Requiere atención</div>
    </div>

    <div class="notification">
      <div class="notification-label">Hoy</div>
      <div class="notification-title">Nueva tarea</div>
      <div class="notification-time">Pendiente</div>
    </div>

  </aside>


  <!-- MENU -->

  <div class="menu" id="menu">

    <!-- Tres puntos -->

    <button
      class="menu-trigger"
      id="menuTrigger"
      aria-label="Abrir menú"
      aria-expanded="false"
    >
      <span class="trigger-dots">

        <span class="trigger-dot"></span>
        <span class="trigger-dot"></span>
        <span class="trigger-dot"></span>

      </span>
    </button>


    <!-- X -->

    <button
      class="close-menu"
      id="closeMenu"
      aria-label="Cerrar menú"
    ></button>


    <!-- OPCIONES -->

    <nav class="options">

      <div class="option">

        <span class="option-dot"></span>

        <span class="option-line"></span>

        <span class="option-text">
          Listas
        </span>

      </div>


      <div class="option">

        <span class="option-dot"></span>

        <span class="option-line"></span>

        <span class="option-text">
          Notas
        </span>

      </div>


      <div class="option">

        <span class="option-dot"></span>

        <span class="option-line"></span>

        <span class="option-text">
          Dashboard
        </span>

      </div>

    </nav>

  </div>


  <script>

    const menu = document.getElementById("menu");
    const menuTrigger = document.getElementById("menuTrigger");
    const closeMenu = document.getElementById("closeMenu");


    /* ABRIR */

    menuTrigger.addEventListener("click", () => {

      menu.classList.remove("closing");

      menu.classList.add("open");

      menuTrigger.setAttribute("aria-expanded", "true");

    });


    /* CERRAR */

    closeMenu.addEventListener("click", () => {

      menu.classList.remove("open");

      menu.classList.add("closing");

      menuTrigger.setAttribute("aria-expanded", "false");


      setTimeout(() => {

        menu.classList.remove("closing");

      }, 900);

    });


    /* SERVICE WORKER */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker.register("/service-worker.js")
          .catch(error => {
            console.log("Service Worker:", error);
          });

      });

    }

  </script>

</body>
</html>
