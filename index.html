<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova-List</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/nova-icon.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #000;
      font-family:
        "Avenir Next",
        "Montserrat",
        "Helvetica Neue",
        Arial,
        sans-serif;
      min-height: 100vh;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    .app {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding-bottom: 100px;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: relative;
      padding-top: 30px;
      padding-bottom: 34px;
      transition: padding-bottom 0.45s ease;
    }

    header.menu-open {
      padding-bottom: 185px;
    }

    .header-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo-title {
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -1px;
      line-height: 1;
    }

    .incorova {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .greeting {
      margin-top: 13px;
      font-size: 13px;
    }


    /* =========================
       MENU
    ========================= */

    .menu-container {
      position: absolute;
      top: 31px;
      right: 14px;
      width: 220px;
      min-height: 170px;
      pointer-events: none;
      z-index: 20;
    }

    .menu-dots {
      position: absolute;
      top: 3px;
      right: 0;

      display: flex;
      gap: 5px;
      align-items: center;

      pointer-events: auto;
      z-index: 30;
    }

    .dot {
      width: 5px;
      height: 5px;
      background: #000;
      border-radius: 50%;

      transition:
        transform 0.55s cubic-bezier(.22,1,.36,1),
        opacity 0.25s ease;
    }

    /*
      Cada punto se convierte en su propia opción.
      Las posiciones quedan dentro del espacio
      ampliado del header.
    */

    .menu-container.open .dot:nth-child(1) {
      transform: translate(-105px, 45px);
    }

    .menu-container.open .dot:nth-child(2) {
      transform: translate(-105px, 87px);
    }

    .menu-container.open .dot:nth-child(3) {
      transform: translate(-105px, 129px);
    }

    .menu-options {
      position: absolute;
      top: 0;
      right: 0;

      width: 180px;
      height: 170px;

      pointer-events: none;
    }

    .menu-option {
      position: absolute;
      right: 0;

      width: 165px;

      display: flex;
      align-items: center;
      gap: 11px;

      opacity: 0;
      transform: translateX(-10px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .menu-option:nth-child(1) {
      top: 44px;
    }

    .menu-option:nth-child(2) {
      top: 86px;
    }

    .menu-option:nth-child(3) {
      top: 128px;
    }

    .menu-line {
      width: 0;
      height: 1px;
      background: #000;
      flex-shrink: 0;

      transition: width 0.35s ease;
    }

    .menu-text {
      font-size: 13px;
      white-space: nowrap;
    }

    .menu-container.open .menu-option {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .menu-container.open .menu-option:nth-child(1) {
      transition-delay: 0.50s;
    }

    .menu-container.open .menu-option:nth-child(2) {
      transition-delay: 0.60s;
    }

    .menu-container.open .menu-option:nth-child(3) {
      transition-delay: 0.70s;
    }

    .menu-container.open .menu-line {
      width: 45px;
    }

    .close-menu {
      position: absolute;
      top: 3px;
      right: 0;

      font-size: 17px;
      line-height: 1;

      opacity: 0;
      pointer-events: none;

      z-index: 40;

      transition: opacity 0.25s ease;
    }

    .menu-container.open .close-menu {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-container.open .menu-dots {
      pointer-events: none;
    }

    .menu-container.open .menu-dots .dot {
      opacity: 0;
    }


    /* =========================
       OVERVIEW
    ========================= */

    .overview {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      border-top: 1px solid #000;
      border-bottom: 1px solid #000;

      padding: 18px 0;
      margin-bottom: 28px;
    }

    .overview-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .overview-number {
      font-size: 22px;
      font-weight: 500;
    }

    .overview-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* =========================
       CALENDAR + LISTS
    ========================= */

    .dashboard-top {
      display: grid;
      grid-template-columns: 44% 1fr;
      gap: 18px;
      align-items: stretch;

      margin-bottom: 34px;
    }


    /* =========================
       CALENDAR
    ========================= */

    .calendar {
      width: 100%;
      border: 1px solid #000;
      padding: 14px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 13px;
    }

    .calendar-month {
      font-size: 13px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .calendar-arrow {
      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .calendar-weekdays {
      margin-bottom: 5px;
    }

    .calendar-weekday {
      text-align: center;
      font-size: 8px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .calendar-day {
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      font-size: 10px;
      cursor: pointer;
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.today {
      border: 1px solid #000;
    }

    .calendar-day.selected {
      background: #000;
      color: #fff;
    }

    .calendar-day.has-task::after {
      content: "";

      position: absolute;
      bottom: 3px;

      width: 3px;
      height: 3px;

      background: #000;
      border-radius: 50%;
    }

    .calendar-day.selected.has-task::after {
      background: #fff;
    }


    /* =========================
       LIST PANEL
    ========================= */

    .lists-panel {
      border: 1px solid #000;
      padding: 14px;

      min-width: 0;
    }

    .lists-title {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .lists-title h2 {
      font-size: 13px;
      font-weight: 500;
    }

    .lists-title span {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .list-item {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-top: 1px solid #ddd;

      padding: 10px 0;

      text-align: left;

      transition:
        padding-left 0.2s ease;
    }

    .list-item:first-of-type {
      border-top: 1px solid #000;
    }

    .list-item:hover {
      padding-left: 5px;
    }

    .list-name {
      font-size: 11px;
    }

    .list-count {
      font-size: 9px;
      min-width: 18px;
      text-align: right;
    }

    .create-list {
      border-top: 1px solid #ddd;

      padding-top: 10px;
      margin-top: 1px;

      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-bottom: 34px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;

      margin-bottom: 13px;
    }

    .section-title h2 {
      font-size: 13px;
      font-weight: 500;
    }

    .section-title span {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* =========================
       TASKS
    ========================= */

    .task {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;

      border-top: 1px solid #ddd;

      padding: 13px 0;
    }

    .task:first-child {
      border-top: 1px solid #000;
    }

    .task-name {
      font-size: 13px;
      line-height: 1.4;
    }

    .task-meta {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .task-overdue {
      font-size: 9px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .more {
      border-top: 1px solid #ddd;

      padding-top: 13px;

      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* =========================
       LIST DETAIL VIEW
    ========================= */

    #listView {
      display: none;
    }

    .list-detail-header {
      display: flex;
      align-items: center;
      gap: 15px;

      border-bottom: 1px solid #000;

      padding-bottom: 15px;
      margin-bottom: 18px;
    }

    .back-button {
      font-size: 20px;
      line-height: 1;
    }

    .list-detail-title {
      font-size: 18px;
      font-weight: 500;
    }

    .list-detail-task {
      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid #ddd;

      padding: 15px 0;
    }

    .list-detail-task-name {
      font-size: 13px;
    }

    .list-detail-task-date {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }


    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      width: min(680px, calc(100% - 40px));

      background: #fff;

      border: 1px solid #000;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      z-index: 30;
    }

    .nav-item {
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .nav-item + .nav-item {
      border-left: 1px solid #000;
    }

    .nav-item.active {
      background: #000;
      color: #fff;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .app {
        width: calc(100% - 30px);
      }

      header {
        padding-top: 24px;
      }

      .logo-title {
        font-size: 24px;
      }

      .dashboard-top {
        grid-template-columns: 44% 1fr;
        gap: 12px;
      }

      .calendar {
        padding: 11px;
      }

      .calendar-day {
        height: 27px;
      }

      .lists-panel {
        padding: 11px;
      }

      .list-name {
        font-size: 10px;
      }

      .overview-number {
        font-size: 19px;
      }

      .menu-container {
        right: 5px;
      }
    }


    @media (max-width: 430px) {

      .dashboard-top {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .calendar {
        padding: 9px;
      }

      .lists-panel {
        padding: 9px;
      }

      .calendar-day {
        height: 25px;
        font-size: 9px;
      }

      .calendar-month {
        font-size: 11px;
      }

      .calendar-weekday {
        font-size: 7px;
      }

      .list-name {
        font-size: 9px;
      }

      .list-count {
        font-size: 8px;
      }

      .overview-number {
        font-size: 17px;
      }

      .overview-label {
        font-size: 8px;
      }
    }


    @media (max-width: 350px) {

      .dashboard-top {
        grid-template-columns: 1fr;
      }

      .calendar {
        width: 48%;
      }

      .lists-panel {
        width: 100%;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header id="mainHeader">

      <div class="header-info">

        <div class="logo-title">

        </div>

    <!-- =========================

    <main id="homeView">

          <button

          <button

          <button

      <!-- =========================

    </main>


    <!-- =========================

  </div>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button class="nav-item active">
      Listas
    </button>

    <button class="nav-item">
      Notas
    </button>

    <button class="nav-item">
      Agenda
    </button>

    <button class="nav-item">
      Dashboard
    </button>

  </nav>


  <script>


    /* =========================
       GREETING
    ========================== */

    function updateGreeting() {

      const hour =
        new Date().getHours();

      let greeting;

      if (hour >= 5 && hour < 12) {

        greeting = "Buenos días";

      } else if (hour >= 12 && hour < 19) {

        greeting = "Buenas tardes";

      } else {

        greeting = "Buenas noches";

      }

      document.getElementById(
        "greeting"
      ).textContent = greeting;

    }

    updateGreeting();


    /* =========================
       MENU
    ========================== */

    const menuContainer =
      document.getElementById(
        "menuContainer"
      );

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const closeMenu =
      document.getElementById(
        "closeMenu"
      );

    const mainHeader =
      document.getElementById(
        "mainHeader"
      );


    menuButton.addEventListener(
      "click",
      () => {

        menuContainer.classList.add(
          "open"
        );

        mainHeader.classList.add(
          "menu-open"
        );

      }
    );


    closeMenu.addEventListener(
      "click",
      () => {

        menuContainer.classList.remove(
          "open"
        );

        mainHeader.classList.remove(
          "menu-open"
        );

      }
    );


    /* =========================
       CALENDAR
    ========================== */

    const calendarMonth =
      document.getElementById(
        "calendarMonth"
      );

    const calendarDays =
      document.getElementById(
        "calendarDays"
      );

    const prevMonth =
      document.getElementById(
        "prevMonth"
      );

    const nextMonth =
      document.getElementById(
        "nextMonth"
      );


    const today =
      new Date();

    let currentMonth =
      today.getMonth();

    let currentYear =
      today.getFullYear();

    let selectedDate =
      today.getDate();


    const taskDays = {

      "2026-10-03": true,
      "2026-10-06": true,
      "2026-10-08": true,
      "2026-10-13": true,
      "2026-10-17": true

    };


    function formatDate(
      year,
      month,
      day
    ) {

      const monthString =
        String(month + 1)
          .padStart(2, "0");

      const dayString =
        String(day)
          .padStart(2, "0");

      return `${year}-${monthString}-${dayString}`;

    }


    function renderCalendar() {

      calendarDays.innerHTML = "";


      const firstDay =
        new Date(
          currentYear,
          currentMonth,
          1
        ).getDay();


      const daysInMonth =
        new Date(
          currentYear,
          currentMonth + 1,
          0
        ).getDate();


      const adjustedFirstDay =
        firstDay === 0
          ? 6
          : firstDay - 1;


      const monthName =
        new Date(
          currentYear,
          currentMonth,
          1
        ).toLocaleDateString(
          "es-ES",
          {
            month: "long",
            year: "numeric"
          }
        );


      calendarMonth.textContent =
        monthName;


      for (
        let i = 0;
        i < adjustedFirstDay;
        i++
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "calendar-day empty";

        calendarDays.appendChild(
          empty
        );

      }


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const dayElement =
          document.createElement(
            "button"
          );

        dayElement.className =
          "calendar-day";

        dayElement.textContent =
          day;


        const dateKey =
          formatDate(
            currentYear,
            currentMonth,
            day
          );


        if (
          day === today.getDate() &&
          currentMonth === today.getMonth() &&
          currentYear === today.getFullYear()
        ) {

          dayElement.classList.add(
            "today"
          );

        }


        if (
          day === selectedDate &&
          currentMonth === today.getMonth() &&
          currentYear === today.getFullYear()
        ) {

          dayElement.classList.add(
            "selected"
          );

        }


        if (
          taskDays[dateKey]
        ) {

          dayElement.classList.add(
            "has-task"
          );

        }


        dayElement.addEventListener(
          "click",
          () => {

            selectedDate = day;

            renderCalendar();

          }
        );


        calendarDays.appendChild(
          dayElement
        );

      }

    }


    prevMonth.addEventListener(
      "click",
      () => {

        currentMonth--;

        if (currentMonth < 0) {

          currentMonth = 11;
          currentYear--;

        }

        selectedDate = 1;

        renderCalendar();

      }
    );


    nextMonth.addEventListener(
      "click",
      () => {

        currentMonth++;

        if (currentMonth > 11) {

          currentMonth = 0;
          currentYear++;

        }

        selectedDate = 1;

        renderCalendar();

      }
    );


    renderCalendar();


    /* =========================
       LISTAS
    ========================== */

    const listData = {

      "Trabajo": [
        ["Enviar documentos", "HOY"],
        ["Revisar propuesta", "16:00"],
        ["Llamar a cliente", "18:30"],
        ["Dar seguimiento", "06 OCT"],
        ["Preparar informe", "08 OCT"]
      ],

      "Personal": [
        ["Comprar concentrado", "HOY"],
        ["Ir al gimnasio", "18:00"],
        ["Organizar habitación", "05 OCT"]
      ],

      "Compras": [
        ["Concentrado", "HOY"],
        ["Comprar artículos", "07 OCT"]
      ],

      "Proyectos": [
        ["Revisar Nova List", "HOY"],
        ["Actualizar INCOROVA", "10 OCT"]
      ]

    };


    const homeView =
      document.getElementById(
        "homeView"
      );

    const listView =
      document.getElementById(
        "listView"
      );

    const listDetailTitle =
      document.getElementById(
        "listDetailTitle"
      );

    const listTasks =
      document.getElementById(
        "listTasks"
      );


    function openList(
      listName
    ) {

      listDetailTitle.textContent =
        listName;

      listTasks.innerHTML = "";


      const tasks =
        listData[listName] || [];


      tasks.forEach(
        task => {

          const taskElement =
            document.createElement(
              "div"
            );

          taskElement.className =
            "list-detail-task";


          taskElement.innerHTML = `

            <span class="list-detail-task-name">
              ${task[0]}
            </span>

            <span class="list-detail-task-date">
              ${task[1]}
            </span>

          `;


          listTasks.appendChild(
            taskElement
          );

        }
      );


      homeView.style.display =
        "none";

      listView.style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    document
      .querySelectorAll(
        ".list-item"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const listName =
                button.dataset.list;

              openList(
                listName
              );

            }
          );

        }
      );


    /* =========================
       VOLVER
    ========================== */

    document
      .getElementById(
        "backToHome"
      )
      .addEventListener(
        "click",
        () => {

          listView.style.display =
            "none";

          homeView.style.display =
            "block";

        }
      );


    /* =========================
       NUEVA LISTA
    ========================== */

    document
      .getElementById(
        "createList"
      )
      .addEventListener(
        "click",
        () => {

          const name =
            prompt(
              "Nombre de la nueva lista:"
            );

          if (
            name &&
            name.trim()
          ) {

            alert(
              `La lista "${name.trim()}" se creará aquí.`
            );

          }

        }
      );


    /* =========================
       SERVICE WORKER
    ========================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "/service-worker.js"
            )
            .catch(() => {});

        }
      );

    }

  </script>

</body>
</html>
