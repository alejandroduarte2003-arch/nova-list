<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="nova-icon.png">

  <title>Nova List</title>

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #ffffff;
      color: #000000;
      font-family: "GEOMETRIC SANS", "Montserrat", "Avenir Next",
        "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input,
    textarea,
    select {
      -webkit-appearance: none;
      appearance: none;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      width: 100%;
      max-width: 920px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(16px, 3vw, 24px);
      padding-bottom: 100px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .main-header {
      position: relative;
      width: 100%;
      min-height: 90px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
      z-index: 1000;
    }

    .header-left {
      min-width: 0;
    }

    .app-name {
      font-size: clamp(22px, 3vw, 29px);
      font-weight: 600;
      letter-spacing: -0.7px;
      line-height: 1.05;
    }

    .app-subtitle {
      margin-top: 5px;
      font-size: clamp(10px, 1.6vw, 12px);
      font-weight: 400;
      letter-spacing: 0.1px;
    }

    .greeting {
      margin-top: 20px;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 500;
      line-height: 1.1;
    }

    /* =========================================================
       THREE DOT MENU
       ========================================================= */

    .menu-container {
      position: relative;
      flex: 0 0 42px;
      width: 42px;
      height: 76px;
      z-index: 1100;
    }

    .dots-button {
      position: absolute;
      top: 2px;
      right: 0;

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 1110;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #000000;

      transition:
        transform 0.28s ease,
        opacity 0.2s ease;
    }

    /* =========================================================
       MENU OPTIONS
       ========================================================= */

    .menu-option {
      position: absolute;

      right: 3px;

      height: 24px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;

      white-space: nowrap;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: translateX(8px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0s linear 0.25s;

      z-index: 1105;
    }

    .menu-option:nth-child(1) {
      top: 4px;
    }

    .menu-option:nth-child(2) {
      top: 34px;
    }

    .menu-option:nth-child(3) {
      top: 64px;
    }

    .menu-option span {
      font-size: 12px;
      line-height: 1;
    }

    .menu-line {
      width: 0;
      height: 1px;
      background: #000000;

      transition: width 0.25s ease;
      flex: 0 0 auto;
    }

    /* =========================================================
       OPEN MENU
       ========================================================= */

    .menu-container.open .dot:nth-child(1) {
      transform: translate(-7px, 0);
    }

    .menu-container.open .dot:nth-child(2) {
      transform: translate(-7px, 30px);
    }

    .menu-container.open .dot:nth-child(3) {
      transform: translate(-7px, 60px);
    }

    .menu-container.open .menu-option {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform: translateX(0);

      transition-delay: 0.22s;
    }

    .menu-container.open .menu-line {
      width: 25px;
    }

    /* =========================================================
       CLOSE BUTTON
       ========================================================= */

    .close-menu {
      position: absolute;
      top: 0;
      right: 0;

      width: 34px;
      height: 34px;

      display: none;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: 300;

      z-index: 1120;
    }

    .menu-container.open .dots-button {
      display: none;
    }

    .menu-container.open .close-menu {
      display: flex;
    }

    /* =========================================================
       QUICK ACTIONS
       ========================================================= */

    .quick-actions {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(10px, 2vw, 18px);
      margin-bottom: 18px;
    }

    .quick-action {
      min-width: 0;
      min-height: 108px;

      border: 1px solid #000000;
      padding: clamp(14px, 3vw, 20px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .quick-action:active {
      transform: scale(0.98);
    }

    .quick-action-icon {
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 9px;
    }

    .quick-action-title {
      font-size: clamp(11px, 1.7vw, 13px);
      line-height: 1.25;
      font-weight: 500;
    }

    /* Post-it */

    .post-it {
      width: 27px;
      height: 27px;
      border: 1.5px solid #000000;
      position: relative;
    }

    .post-it::after {
      content: "";
      position: absolute;
      right: -1.5px;
      bottom: -1.5px;
      width: 8px;
      height: 8px;
      border-top: 1.5px solid #000000;
      border-left: 1.5px solid #000000;
      background: #ffffff;
    }

    /* Star */

    .star-circle {
      width: 30px;
      height: 30px;
      border: 1.5px solid #000000;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .star {
      position: relative;
      width: 11px;
      height: 11px;
    }

    .star::before,
    .star::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 1px;
      background: #000000;
      transform-origin: center;
    }

    .star::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .star::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    /* =========================================================
       REMINDER PANEL
       ========================================================= */

    .reminder-panel {
      display: none;
      width: 100%;
      border: 1px solid #000000;
      padding: clamp(17px, 3vw, 24px);
      margin-bottom: 18px;
    }

    .reminder-panel.active {
      display: block;
    }

    .panel-title {
      font-size: clamp(17px, 2.5vw, 21px);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: clamp(12px, 1.8vw, 14px);
      font-weight: 500;
      margin-bottom: 9px;
    }

    .text-input,
    .date-input,
    .time-input {
      width: 100%;
      min-width: 0;

      height: 46px;

      border: 1px solid #000000;
      border-radius: 0;

      padding: 0 13px;

      background: #ffffff;
      color: #000000;

      font-size: 16px;
      line-height: 1.2;

      outline: none;
    }

    .text-input:focus,
    .date-input:focus,
    .time-input:focus {
      outline: 1px solid #000000;
      outline-offset: -1px;
    }

    /* =========================================================
       LIST SELECTOR
       ========================================================= */

    .list-selector {
      width: 100%;
      border: 1px solid #000000;
    }

    .list-selector-main {
      min-height: 46px;
      padding: 0 13px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      cursor: pointer;
    }

    .selected-list {
      font-size: 16px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .list-arrow {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;

      transition: transform 0.2s ease;
    }

    .list-selector.open .list-arrow {
      transform: rotate(90deg);
    }

    .list-options {
      display: none;
      border-top: 1px solid #000000;
    }

    .list-selector.open .list-options {
      display: block;
    }

    .list-option {
      width: 100%;
      min-height: 42px;

      padding: 10px 13px;

      display: flex;
      align-items: center;

      border-bottom: 1px solid #000000;

      font-size: 14px;
      text-align: left;
    }

    .list-option:last-child {
      border-bottom: none;
    }

    .create-list-button {
      width: 100%;
      min-height: 42px;

      padding: 10px 13px;

      display: flex;
      align-items: center;

      font-size: 13px;
      text-align: left;

      border-top: 1px solid #000000;
    }

    /* =========================================================
       DATE + TIME
       ========================================================= */

    .date-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(12px, 2vw, 18px);
    }

    .date-column {
      min-width: 0;
    }

    .time-question {
      width: 100%;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toggle-button {
      min-width: 54px;
      height: 38px;

      padding: 0 13px;

      border: 1px solid #000000;

      font-size: 13px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-button.active {
      background: #000000;
      color: #ffffff;
    }

    .time-field {
      display: none;
      margin-top: 10px;
    }

    .time-field.active {
      display: block;
    }

    /* =========================================================
       ALARM
       ========================================================= */

    .alarm-options {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .save-reminder {
      width: 100%;
      height: 46px;

      margin-top: 5px;

      background: #000000;
      color: #ffffff;

      font-size: 13px;
      font-weight: 500;
    }

    .cancel-reminder {
      width: 100%;
      height: 42px;

      margin-top: 8px;

      border: 1px solid #000000;

      font-size: 13px;
    }

    /* =========================================================
       CALENDAR + LISTS
       ========================================================= */

    .dashboard-top {
      width: 100%;

      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

      gap: clamp(10px, 2vw, 18px);

      margin-bottom: 18px;
    }

    .dashboard-card {
      min-width: 0;
      width: 100%;

      border: 1px solid #000000;

      padding: clamp(12px, 2.5vw, 18px);
    }

    .card-title {
      font-size: clamp(12px, 1.8vw, 14px);
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* =========================================================
       CALENDAR
       ========================================================= */

    .calendar-header {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 10px;
    }

    .calendar-month {
      font-size: clamp(11px, 1.7vw, 13px);
      font-weight: 500;
    }

    .calendar-nav {
      display: flex;
      gap: 4px;
    }

    .calendar-nav button {
      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
    }

    .calendar-weekdays,
    .calendar-grid {
      width: 100%;

      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(2px, 0.6vw, 5px);
    }

    .calendar-weekdays {
      margin-bottom: 5px;
    }

    .weekday {
      text-align: center;
      font-size: clamp(8px, 1.3vw, 10px);
      font-weight: 500;
    }

    .calendar-day {
      width: 100%;
      aspect-ratio: 1 / 1;

      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(9px, 1.6vw, 12px);

      position: relative;
    }

    .calendar-day.empty {
      pointer-events: none;
    }

    .calendar-day.today {
      border: 1px solid #000000;
    }

    .calendar-day.selected {
      background: #000000;
      color: #ffffff;
    }

    .calendar-day.has-items::after {
      content: "";
      position: absolute;

      bottom: 3px;
      left: 50%;

      width: 3px;
      height: 3px;

      border-radius: 50%;
      background: currentColor;

      transform: translateX(-50%);
    }

    /* =========================================================
       LISTS
       ========================================================= */

    .lists-container {
      width: 100%;
    }

    .list-item {
      width: 100%;
      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 9px 0;

      border-bottom: 1px solid #e5e5e5;

      cursor: pointer;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .list-marker {
      width: 6px;
      height: 6px;

      border: 1px solid #000000;
      border-radius: 50%;

      flex: 0 0 6px;
    }

    .list-name {
      min-width: 0;

      font-size: clamp(10px, 1.7vw, 13px);

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list-count {
      flex: 0 0 auto;

      font-size: 10px;
      min-width: 18px;
      text-align: right;
    }

    .create-list-small {
      width: 100%;

      margin-top: 8px;

      padding-top: 10px;

      border-top: 1px solid #000000;

      text-align: left;

      font-size: 11px;
    }

    /* =========================================================
       TODAY / UPCOMING
       ========================================================= */

    .main-sections {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .section-button {
      width: 100%;
      min-height: 54px;

      border: 1px solid #000000;

      padding: 0 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      text-align: left;
    }

    .section-left {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 500;
    }

    .section-arrow {
      font-size: 16px;
    }

    /* =========================================================
       OVERDUE BADGE
       ========================================================= */

    .overdue-badge {
      min-width: 17px;
      height: 17px;

      padding: 0 5px;

      border-radius: 999px;

      background: #ff3b30;
      color: #ffffff;

      font-size: 10px;
      font-weight: 600;

      display: none;
      align-items: center;
      justify-content: center;
    }

    .overdue-badge.visible {
      display: flex;
    }

    /* =========================================================
       VIEWS
       ========================================================= */

    .view {
      display: none;
      width: 100%;
    }

    .view.active {
      display: block;
    }

    .view-header {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .back-button {
      font-size: 13px;
    }

    .view-title {
      font-size: 20px;
      font-weight: 600;
    }

    /* =========================================================
       TASK CARDS
       ========================================================= */

    .task-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .task-card {
      width: 100%;

      border: 1px solid #000000;

      padding: 14px;

      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-check {
      width: 18px;
      height: 18px;

      border: 1px solid #000000;

      flex: 0 0 18px;

      margin-top: 1px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-check.completed::after {
      content: "✓";
      font-size: 12px;
    }

    .task-content {
      min-width: 0;
      flex: 1;
    }

    .task-title {
      font-size: 13px;
      line-height: 1.35;
    }

    .task-meta {
      margin-top: 5px;

      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      font-size: 10px;
    }

    .task-overdue {
      color: #ff3b30;
    }

    /* =========================================================
       LIST DETAIL
       ========================================================= */

    .list-detail-header {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 18px;
    }

    .list-detail-title {
      min-width: 0;

      font-size: 20px;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================================================
       EMPTY STATE
       ========================================================= */

    .empty-state {
      width: 100%;

      padding: 45px 20px;

      text-align: center;

      border: 1px solid #000000;
    }

    .empty-state-title {
      font-size: 14px;
      font-weight: 500;
    }

    .empty-state-text {
      margin-top: 7px;
      font-size: 11px;
    }

    /* =========================================================
       BOTTOM NAV
       ========================================================= */

    .bottom-nav {
      position: fixed;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: min(920px, 100%);

      padding:
        10px
        max(16px, env(safe-area-inset-left))
        calc(10px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-right));

      background: rgba(255,255,255,0.96);

      border-top: 1px solid #000000;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      z-index: 900;
    }

    .bottom-nav-button {
      min-height: 42px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      font-size: 9px;
    }

    .bottom-nav-icon {
      font-size: 15px;
      line-height: 1;
    }

    /* =========================================================
       RESPONSIVE - TABLET
       ========================================================= */

    @media screen and (max-width: 700px) {

      .app {
        padding-inline: clamp(14px, 4vw, 20px);
      }

      .main-header {
        min-height: 86px;
      }

      .dashboard-card {
        padding: 13px;
      }

      .quick-action {
        min-height: 102px;
      }
    }

    /* =========================================================
       RESPONSIVE - PHONE
       ========================================================= */

    @media screen and (max-width: 600px) {

      /* -------------------------------------------------------
         EVITAR ZOOM AUTOMÁTICO DE IOS
         ------------------------------------------------------- */

      input,
      textarea,
      select,
      button {
        font-size: 16px;
      }

      .text-input,
      .date-input,
      .time-input {
        font-size: 16px !important;
      }

      /* -------------------------------------------------------
         APP
         ------------------------------------------------------- */

      .app {
        width: 100%;
        padding-top: 16px;
        padding-left: clamp(12px, 4vw, 18px);
        padding-right: clamp(12px, 4vw, 18px);
        padding-bottom: 95px;
      }

      /* -------------------------------------------------------
         HEADER
         ------------------------------------------------------- */

      .main-header {
        min-height: 82px;
        margin-bottom: 17px;
      }

      .app-name {
        font-size: 23px;
      }

      .app-subtitle {
        font-size: 10px;
      }

      .greeting {
        margin-top: 17px;
        font-size: 15px;
      }

      /* -------------------------------------------------------
         MENU
         ------------------------------------------------------- */

      .menu-container {
        width: 38px;
        flex-basis: 38px;
        height: 70px;
      }

      .dots-button,
      .close-menu {
        width: 32px;
        height: 32px;
      }

      .menu-container.open .dot:nth-child(1) {
        transform: translate(-5px, 0);
      }

      .menu-container.open .dot:nth-child(2) {
        transform: translate(-5px, 27px);
      }

      .menu-container.open .dot:nth-child(3) {
        transform: translate(-5px, 54px);
      }

      .menu-option {
        height: 22px;
        gap: 6px;
      }

      .menu-option:nth-child(1) {
        top: 3px;
      }

      .menu-option:nth-child(2) {
        top: 30px;
      }

      .menu-option:nth-child(3) {
        top: 57px;
      }

      .menu-option span {
        font-size: 11px;
      }

      .menu-container.open .menu-line {
        width: 20px;
      }

      /* -------------------------------------------------------
         QUICK ACTIONS
         ------------------------------------------------------- */

      .quick-actions {
        gap: 9px;
      }

      .quick-action {
        min-height: 100px;
        padding: 12px 8px;
      }

      .quick-action-title {
        font-size: 11px;
      }

      /* -------------------------------------------------------
         REMINDER
         ------------------------------------------------------- */

      .reminder-panel {
        padding: 15px;
      }

      .panel-title {
        margin-bottom: 18px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      /*
        IMPORTANTE:
        En teléfono fecha y "¿Deseas agregar hora?"
        van uno debajo del otro para que nunca se encimen.
      */

      .date-row {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .time-question {
        margin-top: 1px;
      }

      .toggle-row,
      .alarm-options {
        gap: 8px;
      }

      .toggle-button {
        min-width: 58px;
        height: 40px;
        font-size: 13px;
      }

      /* -------------------------------------------------------
         CALENDAR + LISTS
         ------------------------------------------------------- */

      .dashboard-top {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1fr);

        gap: 8px;
      }

      .dashboard-card {
        width: 100%;
        min-width: 0;
        padding: 10px;
      }

      .card-title {
        font-size: 11px;
        margin-bottom: 11px;
      }

      .calendar-header {
        margin-bottom: 8px;
      }

      .calendar-month {
        font-size: 10px;
      }

      .calendar-nav button {
        width: 21px;
        height: 21px;
        font-size: 13px;
      }

      .calendar-weekdays,
      .calendar-grid {
        gap: 2px;
      }

      .weekday {
        font-size: 7px;
      }

      .calendar-day {
        font-size: 9px;
      }

      .calendar-day.has-items::after {
        bottom: 2px;
        width: 2px;
        height: 2px;
      }

      .list-item {
        padding: 8px 0;
      }

      .list-left {
        gap: 6px;
      }

      .list-marker {
        width: 5px;
        height: 5px;
        flex-basis: 5px;
      }

      .list-name {
        font-size: 9px;
      }

      .list-count {
        font-size: 8px;
        min-width: 15px;
      }

      .create-list-small {
        font-size: 9px;
        margin-top: 5px;
        padding-top: 8px;
      }

      /* -------------------------------------------------------
         TODAY / UPCOMING
         ------------------------------------------------------- */

      .main-sections {
        gap: 8px;
      }

      .section-button {
        min-height: 51px;
        padding: 0 13px;
      }

      .section-title {
        font-size: 12px;
      }

      /* -------------------------------------------------------
         TASKS
         ------------------------------------------------------- */

      .task-card {
        padding: 12px;
      }

      .task-title {
        font-size: 12px;
      }

      .task-meta {
        font-size: 9px;
      }

      /* -------------------------------------------------------
         BOTTOM NAV
         ------------------------------------------------------- */

      .bottom-nav-button {
        font-size: 8px;
      }
    }

    /* =========================================================
       PHONE MUY PEQUEÑO
       ========================================================= */

    @media screen and (max-width: 390px) {

      .app {
        padding-left: 11px;
        padding-right: 11px;
      }

      .app-name {
        font-size: 21px;
      }

      .greeting {
        font-size: 14px;
      }

      .dashboard-top {
        gap: 7px;
      }

      .dashboard-card {
        padding: 8px;
      }

      .card-title {
        font-size: 10px;
      }

      .calendar-month {
        font-size: 9px;
      }

      .calendar-nav button {
        width: 19px;
        height: 19px;
      }

      .weekday {
        font-size: 6px;
      }

      .calendar-day {
        font-size: 8px;
      }

      .list-name {
        font-size: 8px;
      }

      .list-count {
        font-size: 7px;
      }

      .menu-option span {
        font-size: 10px;
      }

      .menu-container.open .menu-line {
        width: 17px;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="main-header" id="mainHeader">

      <div class="header-left">

        <div class="app-name">
          Nova-List
        </div>

        <div class="app-subtitle">
          una APP de Incorova
        </div>

        <div class="greeting" id="greeting">
          Buenos días
        </div>

      </div>


      <!-- MENU -->

      <div class="menu-container" id="menuContainer">

        <button
          class="dots-button"
          id="dotsButton"
          aria-label="Abrir menú"
        >
          <span class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </button>


        <button
          class="close-menu"
          id="closeMenu"
          aria-label="Cerrar menú"
        >
          ×
        </button>


        <button
          class="menu-option"
          id="menuListas"
        >
          <span class="menu-line"></span>
          <span>Listas</span>
        </button>


        <button
          class="menu-option"
          id="menuNotas"
        >
          <span class="menu-line"></span>
          <span>Notas</span>
        </button>


        <button
          class="menu-option"
          id="menuDashboard"
        >
          <span class="menu-line"></span>
          <span>Dashboard</span>
        </button>

      </div>

    </header>


    <!-- =====================================================
         HOME
         ===================================================== -->

    <main
      class="view active"
      id="homeView"
    >

      <!-- QUICK ACTIONS -->

      <section class="quick-actions">

        <button
          class="quick-action"
          id="quickNotesButton"
        >

          <div class="quick-action-icon">
            <div class="post-it"></div>
          </div>

          <div class="quick-action-title">
            Notas rápidas
          </div>

        </button>


        <button
          class="quick-action"
          id="newReminderButton"
        >

          <div class="quick-action-icon">

            <div class="star-circle">
              <div class="star"></div>
            </div>

          </div>

          <div class="quick-action-title">
            Agregar nuevo recordatorio
          </div>

        </button>

      </section>


      <!-- ===================================================
           REMINDER FORM
           =================================================== -->

      <section
        class="reminder-panel"
        id="reminderPanel"
      >

        <div class="panel-title">
          Nuevo recordatorio
        </div>


        <!-- RECORDATORIO -->

        <div class="form-group">

          <label
            class="form-label"
            for="reminderTitle"
          >
            ¿Cuál es el recordatorio?
          </label>

          <input
            id="reminderTitle"
            class="text-input"
            type="text"
            placeholder="Escribe aquí..."
            autocomplete="off"
          >

        </div>


        <!-- LISTA -->

        <div class="form-group">

          <label class="form-label">
            ¿A qué lista deseas agregarlo?
          </label>

          <div
            class="list-selector"
            id="reminderListSelector"
          >

            <button
              class="list-selector-main"
              id="reminderListMain"
            >

              <span
                class="selected-list"
                id="selectedListName"
              >
                Personal
              </span>

              <span class="list-arrow">
                ›
              </span>

            </button>


            <div
              class="list-options"
              id="reminderListOptions"
            >
            </div>

          </div>

        </div>


        <!-- DATE + TIME -->

        <div class="date-row">

          <!-- DATE -->

          <div class="date-column">

            <div class="form-group">

              <label
                class="form-label"
                for="reminderDate"
              >
                ¿Qué día?
              </label>

              <input
                id="reminderDate"
                class="date-input"
                type="date"
              >

            </div>

          </div>


          <!-- TIME -->

          <div class="date-column time-question">

            <div class="form-group">

              <label class="form-label">
                ¿Deseas agregar hora?
              </label>

              <div class="toggle-row">

                <button
                  class="toggle-button"
                  id="timeYes"
                  type="button"
                >
                  Sí
                </button>

                <button
                  class="toggle-button active"
                  id="timeNo"
                  type="button"
                >
                  No
                </button>

              </div>


              <div
                class="time-field"
                id="timeField"
              >

                <label
                  class="form-label"
                  for="reminderTime"
                >
                  Hora
                </label>

                <input
                  id="reminderTime"
                  class="time-input"
                  type="time"
                >

              </div>

            </div>

          </div>

        </div>


        <!-- ALARM -->

        <div class="form-group">

          <label class="form-label">
            ¿Deseas poner una alarma para el recordatorio?
          </label>

          <div class="alarm-options">

            <button
              class="toggle-button"
              id="alarmYes"
              type="button"
            >
              Sí
            </button>

            <button
              class="toggle-button active"
              id="alarmNo"
              type="button"
            >
              No
            </button>

          </div>

        </div>


        <button
          class="save-reminder"
          id="saveReminder"
        >
          Guardar recordatorio
        </button>


        <button
          class="cancel-reminder"
          id="cancelReminder"
        >
          Cancelar
        </button>

      </section>


      <!-- ===================================================
           CALENDAR + LISTS
           =================================================== -->

      <section class="dashboard-top">

        <!-- CALENDAR -->

        <div class="dashboard-card">

          <div class="card-title">
            Calendario
          </div>


          <div class="calendar-header">

            <div
              class="calendar-month"
              id="calendarMonth"
            >
              Enero 2026
            </div>

            <div class="calendar-nav">

              <button
                id="prevMonth"
                aria-label="Mes anterior"
              >
                ‹
              </button>

              <button
                id="nextMonth"
                aria-label="Mes siguiente"
              >
                ›
              </button>

            </div>

          </div>


          <div class="calendar-weekdays">

            <div class="weekday">L</div>
            <div class="weekday">M</div>
            <div class="weekday">X</div>
            <div class="weekday">J</div>
            <div class="weekday">V</div>
            <div class="weekday">S</div>
            <div class="weekday">D</div>

          </div>


          <div
            class="calendar-grid"
            id="calendarGrid"
          >
          </div>

        </div>


        <!-- LISTS -->

        <div class="dashboard-card">

          <div class="card-title">
            Listas
          </div>


          <div
            class="lists-container"
            id="listsContainer"
          >
          </div>


          <button
            class="create-list-small"
            id="createListSmall"
          >
            + Crear nueva lista
          </button>

        </div>

      </section>


      <!-- ===================================================
           TODAY / UPCOMING
           =================================================== -->

      <section class="main-sections">

        <button
          class="section-button"
          id="todayButton"
        >

          <div class="section-left">

            <span class="section-title">
              Hoy
            </span>

            <span
              class="overdue-badge"
              id="overdueBadge"
            >
              0
            </span>

          </div>

          <span class="section-arrow">
            ›
          </span>

        </button>


        <button
          class="section-button"
          id="upcomingButton"
        >

          <div class="section-left">

            <span class="section-title">
              Próximamente
            </span>

          </div>

          <span class="section-arrow">
            ›
          </span>

        </button>

      </section>

    </main>


    <!-- =====================================================
         TODAY VIEW
         ===================================================== -->

    <section
      class="view"
      id="todayView"
    >

      <div class="view-header">

        <button
          class="back-button"
          data-back
        >
          ← Volver
        </button>

        <div class="view-title">
          Hoy
        </div>

        <div></div>

      </div>


      <div
        class="task-list"
        id="todayTaskList"
      >
      </div>

    </section>


    <!-- =====================================================
         UPCOMING VIEW
         ===================================================== -->

    <section
      class="view"
      id="upcomingView"
    >

      <div class="view-header">

        <button
          class="back-button"
          data-back
        >
          ← Volver
        </button>

        <div class="view-title">
          Próximamente
        </div>

        <div></div>

      </div>


      <div
        class="task-list"
        id="upcomingTaskList"
      >
      </div>

    </section>


    <!-- =====================================================
         LIST DETAIL
         ===================================================== -->

    <section
      class="view"
      id="listDetailView"
    >

      <div class="list-detail-header">

        <button
          class="back-button"
          data-back
        >
          ← Volver
        </button>

        <div
          class="list-detail-title"
          id="listDetailTitle"
        >
          Lista
        </div>

      </div>


      <div
        class="task-list"
        id="listDetailTasks"
      >
      </div>

    </section>

  </div>


  <!-- =======================================================
       BOTTOM NAV
       ======================================================= -->

  <nav class="bottom-nav">

    <button
      class="bottom-nav-button"
      id="navHome"
    >

      <span class="bottom-nav-icon">
        ○
      </span>

      <span>
        Inicio
      </span>

    </button>


    <button
      class="bottom-nav-button"
      id="navLists"
    >

      <span class="bottom-nav-icon">
        ≡
      </span>

      <span>
        Listas
      </span>

    </button>


    <button
      class="bottom-nav-button"
      id="navNotes"
    >

      <span class="bottom-nav-icon">
        □
      </span>

      <span>
        Notas
      </span>

    </button>


    <button
      class="bottom-nav-button"
      id="navDashboard"
    >

      <span class="bottom-nav-icon">
        ◇
      </span>

      <span>
        Dashboard
      </span>

    </button>

  </nav>


  <script>

    /* =========================================================
       DATA
       ========================================================= */

    const defaultLists = [
      {
        id: "trabajo",
        name: "Trabajo"
      },
      {
        id: "personal",
        name: "Personal"
      },
      {
        id: "compras",
        name: "Compras"
      },
      {
        id: "proyectos",
        name: "Proyectos"
      }
    ];


    const todayDate = new Date();

    const formatDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    };


    const yesterday = new Date(todayDate);
    yesterday.setDate(yesterday.getDate() - 1);


    const tomorrow = new Date(todayDate);
    tomorrow.setDate(tomorrow.getDate() + 1);


    const defaultTasks = [
      {
        id: crypto.randomUUID(),
        type: "todo",
        title: "Revisar documentos pendientes",
        listId: "trabajo",
        date: formatDate(yesterday),
        priority: "normal",
        completed: false
      },

      {
        id: crypto.randomUUID(),
        type: "todo",
        title: "Enviar seguimiento",
        listId: "trabajo",
        date: formatDate(todayDate),
        priority: "normal",
        completed: false
      },

      {
        id: crypto.randomUUID(),
        type: "todo",
        title: "Comprar concentrado",
        listId: "compras",
        date: formatDate(tomorrow),
        priority: "normal",
        completed: false
      }
    ];


    let lists =
      JSON.parse(localStorage.getItem("novaLists")) ||
      defaultLists;


    let tasks =
      JSON.parse(localStorage.getItem("novaTasks")) ||
      defaultTasks;


    let selectedReminderList =
      lists[0]?.id || "personal";


    let calendarDate = new Date();


    let selectedCalendarDate =
      formatDate(todayDate);


    /* =========================================================
       SAVE
       ========================================================= */

    function saveData() {

      localStorage.setItem(
        "novaLists",
        JSON.stringify(lists)
      );

      localStorage.setItem(
        "novaTasks",
        JSON.stringify(tasks)
      );
    }


    /* =========================================================
       GREETING
       ========================================================= */

    function updateGreeting() {

      const hour = new Date().getHours();

      let greeting = "Buenos días";

      if (hour >= 12 && hour < 19) {
        greeting = "Buenas tardes";
      }

      if (hour >= 19) {
        greeting = "Buenas noches";
      }

      document.getElementById("greeting").textContent =
        greeting;
    }


    /* =========================================================
       MENU
       ========================================================= */

    const menuContainer =
      document.getElementById("menuContainer");

    const dotsButton =
      document.getElementById("dotsButton");

    const closeMenu =
      document.getElementById("closeMenu");


    dotsButton.addEventListener("click", () => {

      menuContainer.classList.add("open");

    });


    closeMenu.addEventListener("click", () => {

      menuContainer.classList.remove("open");

    });


    document
      .getElementById("menuListas")
      .addEventListener("click", () => {

        showLists();

      });


    document
      .getElementById("menuNotas")
      .addEventListener("click", () => {

        alert("Notas próximamente.");

      });


    document
      .getElementById("menuDashboard")
      .addEventListener("click", () => {

        alert("Dashboard próximamente.");

      });


    /* =========================================================
       VIEW CONTROL
       ========================================================= */

    const views = {
      home: document.getElementById("homeView"),
      today: document.getElementById("todayView"),
      upcoming: document.getElementById("upcomingView"),
      listDetail: document.getElementById("listDetailView")
    };


    function showView(name) {

      Object.values(views).forEach(view => {
        view.classList.remove("active");
      });

      if (views[name]) {
        views[name].classList.add("active");
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    document.querySelectorAll("[data-back]")
      .forEach(button => {

        button.addEventListener("click", () => {
          showView("home");
        });

      });


    /* =========================================================
       QUICK NOTES
       ========================================================= */

    document
      .getElementById("quickNotesButton")
      .addEventListener("click", () => {

        alert("Notas rápidas próximamente.");

      });


    /* =========================================================
       REMINDER PANEL
       ========================================================= */

    const reminderPanel =
      document.getElementById("reminderPanel");


    document
      .getElementById("newReminderButton")
      .addEventListener("click", () => {

        reminderPanel.classList.add("active");

        reminderPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      });


    document
      .getElementById("cancelReminder")
      .addEventListener("click", () => {

        resetReminderForm();

      });


    function resetReminderForm() {

      reminderPanel.classList.remove("active");

      document.getElementById("reminderTitle").value = "";

      document.getElementById("reminderDate").value =
        formatDate(new Date());

      document.getElementById("reminderTime").value = "";

      document
        .getElementById("timeNo")
        .classList.add("active");

      document
        .getElementById("timeYes")
        .classList.remove("active");

      document
        .getElementById("alarmNo")
        .classList.add("active");

      document
        .getElementById("alarmYes")
        .classList.remove("active");

      document
        .getElementById("timeField")
        .classList.remove("active");

    }


    /* =========================================================
       LIST SELECTOR
       ========================================================= */

    const listSelector =
      document.getElementById("reminderListSelector");

    const listOptions =
      document.getElementById("reminderListOptions");

    const selectedListName =
      document.getElementById("selectedListName");


    document
      .getElementById("reminderListMain")
      .addEventListener("click", () => {

        listSelector.classList.toggle("open");

        renderReminderLists();

      });


    function renderReminderLists() {

      listOptions.innerHTML = "";

      lists.forEach(list => {

        const button =
          document.createElement("button");

        button.className = "list-option";

        button.textContent = list.name;

        button.addEventListener("click", () => {

          selectedReminderList = list.id;

          selectedListName.textContent =
            list.name;

          listSelector.classList.remove("open");

        });

        listOptions.appendChild(button);

      });


      const createButton =
        document.createElement("button");

      createButton.className =
        "create-list-button";

      createButton.textContent =
        "+ Crear nueva lista";

      createButton.addEventListener("click", () => {

        createNewList();

      });

      listOptions.appendChild(createButton);

    }


    /* =========================================================
       CREATE LIST
       ========================================================= */

    function createNewList() {

      const name =
        prompt("Nombre de la nueva lista:");

      if (!name || !name.trim()) {
        return;
      }

      const newList = {
        id: crypto.randomUUID(),
        name: name.trim()
      };

      lists.push(newList);

      selectedReminderList = newList.id;

      selectedListName.textContent =
        newList.name;

      saveData();

      renderLists();

      renderReminderLists();

      listSelector.classList.remove("open");

    }


    document
      .getElementById("createListSmall")
      .addEventListener("click", () => {

        createNewList();

      });


    /* =========================================================
       TIME YES / NO
       ========================================================= */

    const timeYes =
      document.getElementById("timeYes");

    const timeNo =
      document.getElementById("timeNo");

    const timeField =
      document.getElementById("timeField");


    timeYes.addEventListener("click", () => {

      timeYes.classList.add("active");
      timeNo.classList.remove("active");

      timeField.classList.add("active");

    });


    timeNo.addEventListener("click", () => {

      timeNo.classList.add("active");
      timeYes.classList.remove("active");

      timeField.classList.remove("active");

    });


    /* =========================================================
       ALARM
       ========================================================= */

    const alarmYes =
      document.getElementById("alarmYes");

    const alarmNo =
      document.getElementById("alarmNo");


    alarmYes.addEventListener("click", () => {

      alarmYes.classList.add("active");
      alarmNo.classList.remove("active");

    });


    alarmNo.addEventListener("click", () => {

      alarmNo.classList.add("active");
      alarmYes.classList.remove("active");

    });


    /* =========================================================
       SAVE REMINDER
       ========================================================= */

    document
      .getElementById("saveReminder")
      .addEventListener("click", () => {

        const title =
          document
            .getElementById("reminderTitle")
            .value
            .trim();


        const date =
          document
            .getElementById("reminderDate")
            .value;


        const hasTime =
          timeYes.classList.contains("active");


        const time =
          document
            .getElementById("reminderTime")
            .value;


        const alarm =
          alarmYes.classList.contains("active");


        if (!title) {

          alert(
            "Escribe cuál es el recordatorio."
          );

          return;
        }


        if (!date) {

          alert(
            "Selecciona el día del recordatorio."
          );

          return;
        }


        if (hasTime && !time) {

          alert(
            "Selecciona la hora."
          );

          return;
        }


        const reminder = {

          id: crypto.randomUUID(),

          type: "reminder",

          title,

          listId: selectedReminderList,

          date,

          time: hasTime ? time : null,

          alarm,

          completed: false

        };


        tasks.push(reminder);

        saveData();

        renderCalendar();

        updateOverdueBadge();

        resetReminderForm();

        alert(
          "Recordatorio guardado."
        );

      });


    /* =========================================================
       LISTS RENDER
       ========================================================= */

    function renderLists() {

      const container =
        document.getElementById("listsContainer");

      container.innerHTML = "";


      lists.forEach(list => {

        const count =
          tasks.filter(task =>
            task.listId === list.id &&
            !task.completed
          ).length;


        const item =
          document.createElement("button");

        item.className = "list-item";


        const left =
          document.createElement("div");

        left.className = "list-left";


        const marker =
          document.createElement("span");

        marker.className = "list-marker";


        const name =
          document.createElement("span");

        name.className = "list-name";

        name.textContent = list.name;


        left.appendChild(marker);
        left.appendChild(name);


        const countElement =
          document.createElement("span");

        countElement.className =
          "list-count";

        countElement.textContent =
          count;


        item.appendChild(left);
        item.appendChild(countElement);


        item.addEventListener("click", () => {

          showListDetail(list.id);

        });


        container.appendChild(item);

      });

    }


    /* =========================================================
       TODAY VIEW
       ========================================================= */

    document
      .getElementById("todayButton")
      .addEventListener("click", () => {

        renderTodayTasks();

        showView("today");

      });


    function renderTodayTasks() {

      const container =
        document.getElementById("todayTaskList");

      container.innerHTML = "";


      const today =
        formatDate(new Date());


      const todayTasks =
        tasks.filter(task =>
          task.type === "todo" &&
          task.date === today
        );


      if (!todayTasks.length) {

        showEmptyState(
          container,
          "Nada pendiente para hoy",
          "Tu día está limpio."
        );

        return;

      }


      todayTasks.forEach(task => {

        container.appendChild(
          createTaskCard(task)
        );

      });

    }


    /* =========================================================
       UPCOMING
       ========================================================= */

    document
      .getElementById("upcomingButton")
      .addEventListener("click", () => {

        renderUpcomingTasks();

        showView("upcoming");

      });


    function renderUpcomingTasks() {

      const container =
        document.getElementById("upcomingTaskList");

      container.innerHTML = "";


      const now =
        new Date();


      const limit =
        new Date(now);

      limit.setHours(
        limit.getHours() + 48
      );


      const upcoming =
        tasks.filter(task => {

          if (
            task.type !== "todo" ||
            task.completed
          ) {
            return false;
          }


          const taskDate =
            new Date(task.date + "T23:59:59");


          return (
            taskDate > now &&
            taskDate <= limit
          );

        });


      if (!upcoming.length) {

        showEmptyState(
          container,
          "Nada próximamente",
          "No tienes pendientes dentro de las próximas 48 horas."
        );

        return;

      }


      upcoming.forEach(task => {

        container.appendChild(
          createTaskCard(task)
        );

      });

    }


    /* =========================================================
       TASK CARD
       ========================================================= */

    function createTaskCard(task) {

      const card =
        document.createElement("div");

      card.className = "task-card";


      const check =
        document.createElement("button");

      check.className = "task-check";

      if (task.completed) {
        check.classList.add("completed");
      }


      check.addEventListener("click", () => {

        task.completed =
          !task.completed;

        saveData();

        renderAll();

      });


      const content =
        document.createElement("div");

      content.className =
        "task-content";


      const title =
        document.createElement("div");

      title.className =
        "task-title";

      title.textContent =
        task.title;


      const meta =
        document.createElement("div");

      meta.className =
        "task-meta";


      const list =
        lists.find(
          item => item.id === task.listId
        );


      const listText =
        document.createElement("span");

      listText.textContent =
        list ? list.name : "Sin lista";


      const dateText =
        document.createElement("span");

      dateText.textContent =
        task.date;


      meta.appendChild(listText);
      meta.appendChild(dateText);


      if (
        task.type === "todo" &&
        task.date < formatDate(new Date()) &&
        !task.completed
      ) {

        dateText.classList.add(
          "task-overdue"
        );

      }


      content.appendChild(title);
      content.appendChild(meta);


      card.appendChild(check);
      card.appendChild(content);


      return card;

    }


    /* =========================================================
       EMPTY STATE
       ========================================================= */

    function showEmptyState(
      container,
      title,
      text
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-state";


      const titleElement =
        document.createElement("div");

      titleElement.className =
        "empty-state-title";

      titleElement.textContent =
        title;


      const textElement =
        document.createElement("div");

      textElement.className =
        "empty-state-text";

      textElement.textContent =
        text;


      empty.appendChild(titleElement);
      empty.appendChild(textElement);

      container.appendChild(empty);

    }


    /* =========================================================
       LIST DETAIL
       ========================================================= */

    function showListDetail(listId) {

      const list =
        lists.find(
          item => item.id === listId
        );


      if (!list) {
        return;
      }


      document
        .getElementById("listDetailTitle")
        .textContent = list.name;


      const container =
        document.getElementById(
          "listDetailTasks"
        );


      container.innerHTML = "";


      const listTasks =
        tasks.filter(
          task => task.listId === listId
        );


      if (!listTasks.length) {

        showEmptyState(
          container,
          "Lista vacía",
          "Todavía no hay elementos aquí."
        );

      } else {

        listTasks.forEach(task => {

          container.appendChild(
            createTaskCard(task)
          );

        });

      }


      showView("listDetail");

    }


    function showLists() {

      menuContainer.classList.remove("open");

      renderLists();

      showView("home");

    }


    /* =========================================================
       OVERDUE BADGE
       ========================================================= */

    function updateOverdueBadge() {

      const badge =
        document.getElementById(
          "overdueBadge"
        );


      const today =
        formatDate(new Date());


      const overdue =
        tasks.filter(task => {

          return (
            task.type === "todo" &&
            !task.completed &&
            task.date < today
          );

        }).length;


      if (overdue > 0) {

        badge.textContent =
          overdue;

        badge.classList.add(
          "visible"
        );

      } else {

        badge.classList.remove(
          "visible"
        );

      }

    }


    /* =========================================================
       CALENDAR
       ========================================================= */

    function renderCalendar() {

      const grid =
        document.getElementById(
          "calendarGrid"
        );


      const monthLabel =
        document.getElementById(
          "calendarMonth"
        );


      grid.innerHTML = "";


      const year =
        calendarDate.getFullYear();


      const month =
        calendarDate.getMonth();


      const monthName =
        calendarDate.toLocaleDateString(
          "es-GT",
          {
            month: "long",
            year: "numeric"
          }
        );


      monthLabel.textContent =
        monthName.charAt(0).toUpperCase() +
        monthName.slice(1);


      const firstDay =
        new Date(
          year,
          month,
          1
        );


      let startingDay =
        firstDay.getDay();


      /*
        JavaScript:
        Domingo = 0
        Lunes = 1

        Nuestro calendario:
        Lunes = 0
      */

      startingDay =
        startingDay === 0
          ? 6
          : startingDay - 1;


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();


      for (
        let i = 0;
        i < startingDay;
        i++
      ) {

        const empty =
          document.createElement("div");

        empty.className =
          "calendar-day empty";

        grid.appendChild(empty);

      }


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const date =
          new Date(
            year,
            month,
            day
          );


        const dateString =
          formatDate(date);


        const button =
          document.createElement("button");

        button.className =
          "calendar-day";


        button.textContent =
          day;


        if (
          dateString ===
          formatDate(new Date())
        ) {

          button.classList.add(
            "today"
          );

        }


        if (
          dateString ===
          selectedCalendarDate
        ) {

          button.classList.add(
            "selected"
          );

        }


        const hasItems =
          tasks.some(task =>
            task.date === dateString
          );


        if (hasItems) {

          button.classList.add(
            "has-items"
          );

        }


        button.addEventListener(
          "click",
          () => {

            selectedCalendarDate =
              dateString;

            renderCalendar();

          }
        );


        grid.appendChild(button);

      }

    }


    /* =========================================================
       MONTH NAVIGATION
       ========================================================= */

    document
      .getElementById("prevMonth")
      .addEventListener("click", () => {

        calendarDate.setMonth(
          calendarDate.getMonth() - 1
        );

        renderCalendar();

      });


    document
      .getElementById("nextMonth")
      .addEventListener("click", () => {

        calendarDate.setMonth(
          calendarDate.getMonth() + 1
        );

        renderCalendar();

      });


    /* =========================================================
       BOTTOM NAV
       ========================================================= */

    document
      .getElementById("navHome")
      .addEventListener("click", () => {

        showView("home");

      });


    document
      .getElementById("navLists")
      .addEventListener("click", () => {

        showLists();

      });


    document
      .getElementById("navNotes")
      .addEventListener("click", () => {

        alert("Notas próximamente.");

      });


    document
      .getElementById("navDashboard")
      .addEventListener("click", () => {

        alert("Dashboard próximamente.");

      });


    /* =========================================================
       RENDER ALL
       ========================================================= */

    function renderAll() {

      renderLists();

      renderCalendar();

      updateOverdueBadge();

    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    function initialize() {

      updateGreeting();

      document
        .getElementById("reminderDate")
        .value =
        formatDate(new Date());


      selectedReminderList =
        lists[0]?.id || null;


      if (lists[0]) {

        selectedListName.textContent =
          lists[0].name;

      }


      renderReminderLists();

      renderAll();

    }


    initialize();


    /* =========================================================
       SERVICE WORKER
       ========================================================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("sw.js")
            .catch(error => {

              console.log(
                "Service Worker error:",
                error
              );

            });

        }
      );

    }

  </script>

</body>
</html>
