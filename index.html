<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://udvxmrbqymhrlaiojzex.supabase.co; base-uri 'none'; form-action 'none'">
<title>Nova-List</title>
<link rel="apple-touch-icon" sizes="180x180" href="nova-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="nova-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6e6e73;--line:#e5e5ea;--card:#f7f7f9;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.9);--gb:rgba(0,0,0,.08);--hl:rgba(255,255,255,.9);--sh:rgba(0,0,0,.14);--red:#ff3b30;--maxw:560px;--LW:clamp(40px,24vw,120px);--pad:clamp(20px,6vw,32px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){:root{--maxw:860px;--LW:140px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--mut:#98989d;--line:#2a2a2d;--card:#111113;--glass:rgba(44,44,48,.5);--glass2:rgba(120,120,128,.38);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.25);--sh:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--mut:#98989d;--line:#2a2a2d;--card:#111113;--glass:rgba(44,44,48,.5);--glass2:rgba(120,120,128,.38);--gb:rgba(255,255,255,.16);--hl:rgba(255,255,255,.25);--sh:rgba(0,0,0,.6)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#app{max-width:var(--maxw);margin:0 auto;padding:clamp(22px,5vw,36px) var(--pad) calc(150px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-weight:800;font-size:clamp(28px,7vw,38px);letter-spacing:-.04em;line-height:1}
.sub{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:10px}
.hi{font-size:clamp(13px,3.6vw,15px);font-weight:500;margin-top:6px;overflow-wrap:anywhere}
.row.first{margin-top:clamp(32px,8vw,48px)}
svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* menú */
.menu{position:relative;width:34px;height:34px;flex:none;z-index:20}
.scrim{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .3s}
.menu.open .scrim{opacity:.95;pointer-events:auto}
.opt{position:absolute;right:0;top:calc(var(--i)*40px);width:34px;height:34px;display:grid;place-items:center;translate:calc(var(--dx)*1px) 0;transform:translateY(calc(var(--i)*-40px));transition:translate .25s ease,transform .35s ease}
.menu.open .opt{translate:0 0;transform:none;transition:translate .25s ease,transform .35s ease .25s}
.opt i{width:6px;height:6px;border-radius:50%;background:var(--fg)}
.opt .ln{position:absolute;right:24px;top:50%;height:1px;width:var(--LW);background:var(--fg);transform:scaleX(0);transform-origin:right;transition:transform .2s ease;pointer-events:none}
.menu.open .opt .ln{transform:scaleX(1);transition:transform .4s ease .6s}
.opt .lb{position:absolute;right:calc(24px + var(--LW) + 10px);top:50%;translate:0 -50%;white-space:nowrap;font-size:clamp(15px,4vw,18px);opacity:0;pointer-events:none;transition:opacity .15s}
.menu.open .opt .lb{opacity:1;pointer-events:auto;transition:opacity .3s ease 1s}
/* inicio */
.row{display:flex;gap:clamp(12px,3vw,20px);align-items:stretch}
.cal{width:50%;min-width:0;border:1px solid var(--fg);border-radius:20px;padding:clamp(8px,2vw,16px)}
.plan-cal .cal{width:100%}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ch button{width:24px;height:24px;font-size:16px;text-align:center;color:var(--mut);flex:none}
.ch .ct{flex:1;width:auto;font-size:clamp(11px,3vw,14px);font-weight:600;color:var(--fg);text-align:center}
.cp .ch b{font-size:13px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mg button{padding:8px 0;border-radius:10px;font-size:12px;text-align:center}
.mg button.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:clamp(9px,2.6vw,14px)}
.grid b{color:var(--mut);font-weight:400}
.grid button{aspect-ratio:1;padding:0;border-radius:50%;font-size:inherit;position:relative;text-align:center}
.grid .today{background:var(--fg);color:var(--bg)}
.grid .has::after{content:"";position:absolute;bottom:2px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor}
.ov{flex:1;min-width:0;background:var(--card);border-radius:20px;padding:clamp(12px,3vw,18px);font-size:clamp(12px,3.2vw,15px);display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .2s}
.ov:active{transform:scale(.97)}
.ov .h{display:flex;justify-content:space-between;font-weight:600}
.ov .r{display:flex;justify-content:space-between;gap:6px}.ov em{font-style:normal;color:var(--mut)}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;padding:20px 4px;border-bottom:1px solid var(--line);font-size:clamp(19px,5vw,24px);font-weight:600;letter-spacing:-.02em}
.big svg{width:22px;height:22px}
.big:first-of-type{margin-top:clamp(22px,5vw,32px);border-top:1px solid var(--line)}
.lbl{position:relative;display:inline-block}
.bdg{position:absolute;top:-10px;right:-26px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
/* Liquid Glass */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 28px),460px);display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--gb);box-shadow:0 12px 34px var(--sh),inset 0 1px 0 var(--hl);z-index:10;overflow:hidden}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:999px;font-size:clamp(10px,2.9vw,12px);font-weight:600;color:var(--mut);text-align:center;transition:background .3s,color .3s,transform .2s}
nav button.on{color:var(--fg);background:var(--glass2)}
nav button:active{transform:scale(.95)}
nav svg{width:24px;height:24px}
/* páginas */
.back{font-size:13px;color:var(--mut);margin:clamp(24px,6vw,36px) 0 18px;display:inline-flex}
h2.t{font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:-.035em;margin-bottom:20px}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.chk{width:22px;height:22px;border:1.5px solid var(--fg);border-radius:50%;flex:none;margin-top:1px}
.chk.on{background:var(--fg)}
.item small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.item small.late,.late{color:var(--red)}
.item .x{margin-left:auto;color:var(--mut);font-size:20px;padding:0 6px;line-height:1}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--mut);padding:12px 0 4px;font-size:14px}
input,select,textarea{font:inherit;font-size:16px;width:100%;background:none;color:var(--fg);border:0;border-bottom:1px solid var(--fg);padding:12px 0;margin-bottom:16px;border-radius:0;color-scheme:light dark}
textarea{min-height:46vh;resize:vertical;border:1px solid var(--gb);border-radius:26px;padding:18px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:0 10px 28px var(--sh),inset 0 1px 0 var(--hl);line-height:1.55}
.pri{background:var(--fg);color:var(--bg);padding:14px 26px;border-radius:99px;font-weight:600;text-align:center;display:inline-block}
.pri.sm{padding:10px 20px;font-size:14px}
.acts{display:flex;gap:18px;align-items:center;margin-top:18px}
.sec{font-size:15px;font-weight:600;margin:30px 0 4px}
.add{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.add input{margin:0;padding:10px 0}
.add button{width:36px;height:36px;flex:none;border:1px solid var(--fg);border-radius:50%;text-align:center;font-size:20px;line-height:1}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.n2t{font-size:13px;color:var(--mut);text-decoration:underline;white-space:nowrap;padding:4px 0}
.lst{display:block;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.lst div{display:flex;justify-content:space-between;font-weight:600}.lst span{color:var(--mut);font-weight:400;font-size:13px}
.lead{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:18px}
.nc{display:block;width:100%;background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:12px;text-align:left}
.nc b{display:block;font-size:15px;margin-bottom:4px;overflow-wrap:anywhere}
.nc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:13px;line-height:1.4}
/* formulario */
.todo-form{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:8px}
.todo-title{font-size:18px;font-weight:600;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--bg);margin-bottom:18px}
.todo-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.todo-field{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:11px 14px 8px}
.todo-field:focus-within{border-color:var(--fg)}
.todo-field label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:3px}
.todo-field select,.todo-field input{border:0;padding:2px 0 4px;margin:0;font-size:14px;font-weight:600}
.todo-actions{display:flex;align-items:center;gap:12px;margin-top:16px}
@media(max-width:560px){.todo-fields{grid-template-columns:1fr}.todo-form{padding:16px}}
/* planificador */
.plan-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 22px}
.plan-panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;min-height:110px;transition:border-color .2s}
.plan-panel.on{border-color:var(--fg)}
.plan-panel b{display:block;font-size:14px}.plan-panel small{display:block;color:var(--mut);font-size:12px;line-height:1.4;margin-top:6px}
.plan-panel .pnumb{font-size:25px;font-weight:800;letter-spacing:-.04em;margin-top:10px;display:block}
.plan-panel.late .pnumb{color:var(--red)}
.pd{background:var(--card);border-radius:20px;padding:16px;margin:0 0 22px;border:1px solid var(--line)}
.plan-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 22px}
.plan-mode{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left;min-height:84px}
.plan-mode.on{background:var(--fg);color:var(--bg)}
.plan-mode b{display:block;font-size:14px}.plan-mode span{display:block;font-size:11px;margin-top:5px;opacity:.65}
.wd{display:block;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.wd.tod{border-color:var(--fg)}
.wh{display:flex;align-items:baseline;gap:10px}.wh b{font-size:15px}.wh em{font-style:normal;color:var(--mut);font-weight:500;margin-left:6px}.wh span{margin-left:auto;font-size:12px;color:var(--mut)}
.plan-note{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:9px}
.plan-note-title{font-size:14px;font-weight:700;margin-bottom:5px;overflow-wrap:anywhere}
.plan-note-text{font-size:12px;color:var(--mut);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-note-actions{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.plan-convert{margin-top:12px;padding:13px;background:var(--bg);border-radius:15px;border:1px solid var(--line)}
@media(max-width:620px){.plan-summary{grid-template-columns:1fr 1fr}.plan-panel:last-child{grid-column:1/-1;min-height:96px}.plan-modes{grid-template-columns:1fr}.plan-mode{min-height:68px}}
/* notas en cristal */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(128,128,136,.20),transparent 42%),radial-gradient(circle at 92% 64%,rgba(128,128,136,.16),transparent 48%)}
.nbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.gpill,.sbar{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--gb);box-shadow:0 8px 22px var(--sh),inset 0 1px 0 var(--hl)}
.gpill{padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;text-align:center;transition:transform .2s}
.gpill:active{transform:scale(.96)}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.ngrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ncard{position:relative;display:flex;flex-direction:column;gap:6px;min-height:138px;max-height:168px;padding:16px;border-radius:26px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--gb);box-shadow:0 10px 28px var(--sh),inset 0 1px 0 var(--hl),inset 0 -1px 0 var(--gb);transition:transform .2s,box-shadow .2s;text-align:left}
.ncard::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,var(--hl),transparent 42%);opacity:.35;pointer-events:none}
.ncard:active{transform:scale(.97)}
.ncard b,.ncard .tx{position:relative;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.ncard b{font-size:14px;line-height:1.3;-webkit-line-clamp:2;padding-right:24px}
.ncard .tx{font-size:12px;color:var(--mut);line-height:1.45;-webkit-line-clamp:4}
.ncard.on{box-shadow:0 0 0 2px var(--fg),0 10px 28px var(--sh)}
.nchk{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;z-index:1;transition:background .2s}
.ncard.on .nchk{background:var(--fg);color:var(--bg)}
.nchk svg{width:14px;height:14px;stroke-width:2.4;opacity:0;transition:opacity .2s}.ncard.on .nchk svg{opacity:1}
.sbar{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 28px),460px);display:flex;align-items:center;gap:6px;padding:8px 8px 8px 18px;border-radius:999px;z-index:11}
.sbar span{flex:1;font-size:13px;font-weight:600;color:var(--mut)}
.sbar button{padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;text-align:center;background:var(--glass2)}
.sbar button:disabled{opacity:.35;cursor:default}
.sbar .dng{background:var(--red);color:#fff}
/* glass unificado + libro + planificador */
.ov,.cal,.plan-panel,.pd,.todo-form,.lst,.acc,.mkl,.plan-note,.wd{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--gb);box-shadow:0 10px 28px var(--sh),inset 0 1px 0 var(--hl),inset 0 -1px 0 var(--gb)}
.lst{padding:16px 18px;border-radius:24px;margin-bottom:12px}
.mkl{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 20px;border-radius:999px;margin-bottom:22px}
.mkl input{margin:0;border:0;padding:10px 0}
.add button{width:auto;height:auto;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.2;border:0;background:var(--fg);color:var(--bg)}
.grid .sel{box-shadow:inset 0 0 0 1.5px var(--fg)}
.acc{border-radius:24px;margin-bottom:12px;overflow:hidden}
.acc-h{display:flex;width:100%;align-items:center;justify-content:space-between;padding:18px 20px}
.acc-h b{display:block;font-size:15px}.acc-h small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.acc-h i{font-style:normal;font-size:22px;color:var(--mut);transition:transform .35s}
.acc.open .acc-h i{transform:rotate(90deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-in{min-height:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .45s}
.acc.open .acc-in{opacity:1;visibility:visible;transition:opacity .3s .12s,visibility 0s}
.acc-pad{padding:0 18px 18px}
.pnv{display:flex;align-items:center;gap:10px;margin-bottom:12px}.pnv b{flex:1;text-align:center;font-size:14px}
.pnv .gpill{width:40px;height:40px;padding:0;font-size:18px}
.wstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x mandatory}
.wk{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:18px;scroll-snap-align:center;text-align:center}
.wk small{font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase}.wk b{font-size:16px}
.wk i{width:4px;height:4px;border-radius:50%;background:currentColor}
.wk.tod{box-shadow:inset 0 0 0 1px var(--fg)}.wk.sel{background:var(--fg);color:var(--bg)}.wk.sel small{color:var(--bg);opacity:.7}
.tl{position:relative;max-height:min(56vh,460px);overflow-y:auto;border-radius:16px}
.hr{display:flex;gap:12px;min-height:54px;border-top:1px solid var(--line);padding:8px 0}
.hr>b{width:44px;flex:none;font-size:11px;color:var(--mut);font-weight:600;padding-top:6px}
.hs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.slot{align-self:flex-end;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);color:var(--mut);text-align:center;line-height:1;font-size:16px;opacity:.6}
.tk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--glass2);font-size:14px;margin-bottom:6px}
.tk span{flex:1;min-width:0;overflow-wrap:anywhere}.tk span.dn{text-decoration:line-through;color:var(--mut)}.tk small{color:var(--mut);font-size:11px}
.tk .chk{width:20px;height:20px;margin:0}
.nh{margin-bottom:10px}.nh>small{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-bottom:6px}
.book{position:relative;height:min(58vh,480px);width:min(100%,380px);margin:6px auto 0;perspective:1600px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pg{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;border-radius:6px 26px 26px 6px;background:linear-gradient(90deg,var(--gb),transparent 9%),var(--card);border:1px solid var(--gb);box-shadow:0 18px 40px var(--sh),inset 0 1px 0 var(--hl);padding:26px 24px 20px 30px;overflow:hidden;display:flex;flex-direction:column;gap:12px;cursor:pointer}
#pgU:empty{visibility:hidden}
.pg b{font-size:20px;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
.pg .tx{flex:1;font-size:14px;line-height:1.6;color:var(--mut);white-space:pre-line;overflow:hidden;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.pg .pnum{font-size:11px;color:var(--mut);text-align:center;letter-spacing:.1em}
.pg .plus{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-size:28px;margin:auto auto 0}
.pg.nw{align-items:center;text-align:center}

.wctl{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:6}

/* acceso */
.auth{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:28px}
.auth.show{display:flex}
.authbox{width:min(100%,420px);text-align:center}
.authbox h2{font-size:40px;font-weight:800;letter-spacing:-.04em;margin-bottom:10px}
.authbox p{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:30px}
.google{width:100%;border:1px solid var(--fg);border-radius:999px;padding:15px 20px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}

/* guardado */
.saved{position:fixed;left:50%;top:50%;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--gb);box-shadow:0 16px 40px var(--sh);z-index:300;opacity:0;pointer-events:none}
.saved svg{position:absolute;width:52px;height:52px}
.saved .sv1{stroke:var(--fg);stroke-width:1.6;opacity:0}

.saved.go .sv1{animation:svStar 1.5s ease forwards}
.saved.go .sv2{animation:svCk 1.5s ease forwards}
.saved.go .sv2 path{animation:svDraw 1.5s ease forwards}
@keyframes svBox{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1)}86%{opacity:1}100%{opacity:0;transform:scale(.94)}}
@keyframes svStar{0%{opacity:1;transform:rotate(0) scale(.6)}38%{opacity:1;transform:rotate(600deg) scale(1)}46%,100%{opacity:0;transform:rotate(760deg) scale(.2)}}
@keyframes svCk{0%,40%{opacity:0;transform:scale(.5)}52%{opacity:1;transform:scale(1.12)}60%,100%{opacity:1;transform:scale(1)}}
@keyframes svDraw{0%,42%{stroke-dashoffset:24}60%,100%{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.in{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
/* bienvenida y entrada */
.onb,.entry{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:var(--bg);transition:opacity .3s}

.onb.out,.entry.out{opacity:0;pointer-events:none}
.orb,.entry-card{width:min(100%,400px);padding:30px 26px 28px;border-radius:36px;background:var(--card);border:1px solid var(--gb);box-shadow:0 22px 54px var(--sh);text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}

.ostar{width:26px;height:26px;display:block;margin:0 auto}
.ostar.spin{animation:ospin .7s cubic-bezier(.3,.7,.3,1)}
.orb-body{transition:opacity .22s,transform .22s}
.orb-body.out{opacity:0;transform:translateY(6px)}
.orb h2,.entry-card h2{font-size:clamp(24px,6.5vw,30px);font-weight:800;letter-spacing:-.035em;line-height:1.15;margin:14px 0 10px}
.orb p,.entry-summary{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:22px}
.entry-summary b{color:var(--fg)}

.orb input{text-align:center;margin-bottom:22px}
.obr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{padding:14px 26px;border-radius:99px;border:1px solid var(--fg);font-weight:600;text-align:center}
.entry-main{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--fg);color:var(--bg);padding:15px 22px;border-radius:999px;font-weight:600}
.entry-main svg{width:18px;height:18px}
.entry-note{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px;color:var(--mut);font-size:12px;font-weight:500}

@keyframes orbfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ospin{to{transform:rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<body>
<div id="loading" class="loading">Nova-List</div>
<div id="auth" class="auth"><div class="authbox">
  <h2>Nova-List</h2>
  <p>Inicia sesión para guardar tus datos y acceder a ellos desde cualquier dispositivo.</p>
  <button class="google" id="googleLogin">
    <svg viewBox="0 0 24 24"><path d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.2c1.9-1.8 3.1-4.4 3.1-7.5z" fill="currentColor" stroke="none"/><path d="M12 22c2.7 0 5-.9 6.7-2.5l-3.2-2.6c-.9.6-2 1-3.5 1-2.7 0-5-1.8-5.8-4.2H2.9v2.7A10 10 0 0 0 12 22z" fill="currentColor" stroke="none"/><path d="M6.2 13.7A6 6 0 0 1 5.9 12c0-.6.1-1.2.3-1.7V7.6H2.9A10 10 0 0 0 2 12c0 1.6.4 3.1 1 4.4l3.2-2.7z" fill="currentColor" stroke="none"/><path d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.8-2.8C17 3.1 14.7 2 12 2a10 10 0 0 0-9.1 5.6l3.3 2.7C7 7.9 9.3 6.1 12 6.1z" fill="currentColor" stroke="none"/></svg>
    Iniciar sesión</button>
  <button class="authother" id="googleOther">Iniciar sesión con otra cuenta</button>
  <p class="authsmall">Tus listas, notas y pendientes se guardarán en tu cuenta.</p>
</div></div>
<div id="app"></div>
<div id="saved" class="saved"><svg class="sv1" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3Q12 12 21 12Q12 12 12 21Q12 12 3 12Q12 12 12 3Z"/></svg><svg class="sv2" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="sr" role="status"></span></div>
<nav aria-label="Principal">
  <button data-go="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>Inicio</button>
  <button data-go="notes"><svg viewBox="0 0 24 24"><path d="M5 4h14v10l-5 6H5z"/><path d="M14 20v-6h5"/><path d="M8 9h8M8 13h4"/></svg>Notas rápidas</button>
  <button data-go="new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6Q12 12 18 12Q12 12 12 18Q12 12 6 12Q12 12 12 6Z"/></svg>Nuevo to-do</button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L15 6l3 3L8 19z"/><path d="M13 8l3 3"/><path d="M19.5 2l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z" stroke-width="1.2"/></svg>Planificador</button>
</nav>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb=createClient('https://udvxmrbqymhrlaiojzex.supabase.co','sb_publishable_VaSGlZ8OA38jbM9QHCTwZw_eNVq__On');

/* ---------- estado y utilidades ---------- */
const $=s=>document.querySelector(s);
const DEF=['Personal','Trabajo','Compras'];
const DEFL=[{k:'cal',s:'S'},{k:'lists',s:'S'},{k:'today',s:'W'},{k:'soon',s:'W'}];
const now=new Date();
const S={todos:[],notes:[],lists:[],view:'home',day:null,cur:0,user:null,adding:false,planMode:'day',planFilter:'',planNote:null,wk:null,cal:{y:now.getFullYear(),m:now.getMonth()},calPick:false,layout:DEFL.map(d=>({...d})),homeIds:[],edit:false,pickL:false,noClick:false,hist:[],pday:"",pre:null,nview:"book",bi:0,sheet:null,flip:false,selMode:false,picked:[],onb:false,fin:false,entry:false,ob:{step:'welcome',n:0,busy:false}};
let cloudReady=false,booting=false;
const arrow='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const STAR='<svg class="ostar" id="ostar" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3Q12 12 21 12Q12 12 12 21Q12 12 3 12Q12 12 12 3Z"/></svg>';
const sd=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();
const getUserName=()=>String(S.user?.user_metadata?.name||S.user?.user_metadata?.full_name||'').trim();
const hello=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'};
const at=t=>new Date(t.due+'T'+(t.time||'23:59')).getTime();
const isLate=t=>!t.done&&t.due&&at(t)<Date.now();
const overdue=()=>S.todos.filter(isLate);
const endToday=()=>sd(new Date()).getTime()+864e5;
const today=()=>S.todos.filter(t=>t.due===key(new Date())&&!isLate(t));
const soon=()=>{const e=endToday(),l=e+1728e5;return S.todos.filter(t=>{if(!t.due)return false;const x=new Date(t.due+'T'+(t.time||'00:00')).getTime();return x>=e&&x<=l})};
const stat=n=>{const a=S.todos.filter(t=>t.list===n),d=a.filter(t=>t.done).length;return{total:a.length,done:d,p:a.length?Math.round(d/a.length*100):0}};
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%;background:hsl(${p*1.2} 75% 45%)"></i></div>`;
const fmtD=d=>{const [y,m,x]=d.split('-').map(Number);return new Date(y,m-1,x).toLocaleDateString('es',{day:'numeric',month:'short'})};
const opts=[['lists','Mis listas',-22],['settings','Ajustes',-11],['about','Acerca de',0]];
const norm=t=>({id:t.id,title:t.title||'',list:t.list||'',sec:t.sec||'',due:t.due||'',time:(t.time||'').slice(0,5),done:!!t.done});
const mapList=l=>({id:l.id,name:l.name,secs:Array.isArray(l.secs)?l.secs:[]});
const mon=d=>{const x=sd(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseK=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const NAMES={home:'Inicio',plan:'Planificador',notes:'Notas',lists:'Mis listas',list:'Lista',today:'Hoy',soon:'Próximamente',new:'Nuevo to-do',day:'Día',ws:'Nota',settings:'Ajustes',about:'Acerca de'};
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const todosOn=k=>S.todos.filter(t=>t.due===k).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
/* las notas se guardan como texto plano; las antiguas con HTML se convierten a texto */
const noteText=n=>{const t=n.text||'';if(!t.startsWith('<!--h-->'))return t;
  return new DOMParser().parseFromString(t.slice(8).replace(/<\/(div|p|li)>|<br\s*\/?>/gi,'$&\n'),'text/html').body.textContent||''};
const noteLines=n=>noteText(n).split('\n').map(x=>x.trim()).filter(Boolean);
const notify=m=>{const d=document.createElement('div');d.className='toast';d.setAttribute('role','alert');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)};
function flash(){const el=$('#saved');if(!el)return;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');const r=el.querySelector('.sr');r.textContent='Guardado';setTimeout(()=>r.textContent='',1800)}

/* ---------- nube ---------- */
const run=async p=>{try{const r=await p;if(r.error){console.error(r.error);notify('No se pudo guardar. Revisa tu conexión.');return null}return r.data??true}catch(e){console.error(e);notify('No se pudo guardar. Revisa tu conexión.');return null}};
const saveTodo=t=>S.user&&run(sb.from('todos').upsert({id:t.id,user_id:S.user.id,title:t.title,list:t.list,sec:t.sec||'',due:t.due||null,time:t.time||null,done:!!t.done}));
const deleteTodo=id=>S.user&&run(sb.from('todos').delete().eq('id',id).eq('user_id',S.user.id));
const saveNote=n=>S.user&&run(sb.from('notes').upsert({id:n.id,user_id:S.user.id,text:n.text}));
const deleteNote=id=>S.user&&run(sb.from('notes').delete().eq('id',id).eq('user_id',S.user.id));
async function saveList(l){if(!S.user)return false;const row={user_id:S.user.id,name:l.name,secs:l.secs||[]};if(l.id)row.id=l.id;
  const d=await run(sb.from('lists').upsert(row).select().single());if(!d)return false;if(d!==true)l.id=d.id;return true}
const deleteList=id=>S.user&&id&&run(sb.from('lists').delete().eq('id',id).eq('user_id',S.user.id));

async function fetchT(t,asc){
  let r=await sb.from(t).select('*').eq('user_id',S.user.id).order('created_at',{ascending:asc});
  if(r.error)r=await sb.from(t).select('*').eq('user_id',S.user.id);
  return r;
}
async function loadCloud(){
  initHome();
  try{
    const [a,b,c]=await Promise.all([fetchT('todos',true),fetchT('notes',false),fetchT('lists',true)]);
    if(a.error||b.error||c.error)notify('No se pudieron cargar algunos datos.');
    S.todos=(a.data||[]).map(norm);S.notes=b.data||[];S.lists=(c.data||[]).map(mapList);
    if(!c.error){
      if(!S.user.user_metadata?.onboarded){S.ob.step=!getUserName()?'welcome':!S.lists.length?'list':'more';S.onb=true}
      else if(!S.lists.length){
        const r=await sb.from('lists').insert(DEF.map(name=>({user_id:S.user.id,name,secs:[]}))).select();
        if(!r.error)S.lists=(r.data||[]).map(mapList);
      }
    }
  }catch(e){console.error(e);notify('Error de conexión.')}
  cloudReady=true;render();
  if(S.user?.user_metadata?.onboarded&&!S.onb)setTimeout(showEntry,80);
}

/* ---------- entrada al volver a abrir ---------- */
function showEntry(){
  if(S.entry||S.onb||!S.user)return;S.entry=true;
  const pending=today().length,late=overdue().length;
  document.body.insertAdjacentHTML('beforeend',`<div class="entry" id="entry" role="dialog" aria-modal="true"><div class="entry-card">${STAR.replace(' id="ostar"','')}
    <h2>${hello()}, ${esc(getUserName()||'bienvenido')}</h2>
    <p class="entry-summary">Tienes <b>${pending} ${pending===1?'pendiente':'pendientes'} para hoy</b>.</p>
    ${late?`<p class="entry-overdue">Además, tienes ${late} ${late===1?'tarea vencida':'tareas vencidas'}.</p>`:''}
    <button class="entry-main" data-entry-main>Entrar a Nova-List ${arrow}</button>
    <button class="entry-note" data-entry-note><svg viewBox="0 0 24 24"><path d="M5 4h14v10l-5 6H5z"/><path d="M14 20v-6h5"/><path d="M8 9h8M8 13h4"/></svg>Agregar nota rápida</button></div></div>`);
}
function closeEntry(){const el=$('#entry');S.entry=false;if(!el)return;el.classList.add('out');setTimeout(()=>el.remove(),320)}

/* ---------- sesión ---------- */
async function signInWithGoogle(other=false){
  try{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname,queryParams:other?{prompt:'select_account'}:undefined}});
    if(error)notify('No se pudo iniciar sesión: '+error.message)}
  catch(e){console.error(e);notify('Ocurrió un error al iniciar sesión.')}
}
async function changeName(){
  let name=prompt('Escribe tu nuevo nombre:',getUserName());
  if(name===null)return;name=name.trim().slice(0,40);
  if(!name)return notify('El nombre no puede estar vacío.');
  const {data,error}=await sb.auth.updateUser({data:{name}});
  if(error){console.error(error);return notify('No se pudo cambiar tu nombre.')}
  S.user=data.user||S.user;render();
}
async function signOut(){
  try{await sb.auth.signOut()}catch(e){console.error(e)}
  Object.assign(S,{user:null,todos:[],notes:[],lists:[],view:'home',onb:false,fin:false,entry:false,ob:{step:'welcome',n:0,busy:false}});
  cloudReady=false;$('#onb')?.remove();$('#entry')?.remove();$('#app').innerHTML='';$('#auth').classList.add('show');
}

/* ---------- bienvenida (primer inicio) ---------- */
const ONB={
  welcome:()=>`<h2>Bienvenido a Nova-List</h2><p>la app para organizar mejor tus to-do y cumplir objetivos.</p><input id="obn" placeholder="¿Cómo te llamas?" maxlength="40" autocomplete="name" aria-label="Tu nombre"><button class="pri" data-ob="saveName">Continuar</button>`,
  list:()=>`<h2>${S.ob.n?'Creemos otra lista':'Creemos tu primera lista'}</h2><p>Agrega el nombre de la lista que quieres usar.</p><input id="obn" placeholder="Nombre de tu lista" maxlength="40" autocomplete="off" aria-label="Nombre de la lista"><button class="pri" data-ob="create">Crear lista</button>`,
  more:()=>`<h2>¿Deseas agregar otra lista?</h2><p>Puedes crear las listas que necesites para organizar tus to-do.</p><div class="obr"><button class="pri" data-ob="add">Agregar nueva lista</button><button class="ghost" data-ob="later">Luego</button></div>`
};
function onbMount(){
  if($('#onb'))return;
  const d=document.createElement('div');d.id='onb';d.className='onb';
  d.innerHTML=`<div class="orb" role="dialog" aria-live="polite">${STAR}<div class="orb-body" id="orbBody">${ONB[S.ob.step]()}</div></div>`;
  document.body.appendChild(d);$('#orbBody input')?.focus({preventScroll:true});
}
function onbStep(step){
  const b=$('#orbBody');if(!b)return;S.ob.step=step;b.classList.add('out');
  setTimeout(()=>{const x=$('#orbBody');if(!x)return;x.innerHTML=ONB[step]();x.classList.remove('out');x.querySelector('input')?.focus({preventScroll:true})},220);
}
async function onbAct(a){
  if(S.ob.busy||S.fin)return;
  if(a==='add')return onbStep('list');
  if(a==='later')return finishOnb();
  const inp=$('#obn');if(!inp)return;const v=inp.value.trim();if(!v)return inp.focus();
  if(a==='saveName'){
    S.ob.busy=true;const {data,error}=await sb.auth.updateUser({data:{name:v}});S.ob.busy=false;
    if(error){console.error(error);return notify('No se pudo guardar tu nombre.')}
    S.user=data.user||S.user;return S.lists.length?finishOnb():onbStep('list');
  }
  if(a==='create'){
    if(S.lists.some(l=>l.name.toLowerCase()===v.toLowerCase())){notify('Ya existe una lista con ese nombre.');return inp.focus()}
    S.ob.busy=true;const list={name:v,secs:[]};
    if(!await saveList(list)){S.ob.busy=false;return}
    S.lists.push(list);S.ob.n++;flash();
    const st=$('#ostar');if(st){st.classList.remove('spin');void st.offsetWidth;st.classList.add('spin')}
    setTimeout(()=>{S.ob.busy=false;onbStep('more')},700);
  }
}
async function finishOnb(){
  if(S.fin)return;S.fin=true;
  try{const {data}=await sb.auth.updateUser({data:{onboarded:true}});if(data?.user)S.user=data.user}catch(e){console.error(e)}
  const o=$('#onb');if(o){o.classList.add('out');await new Promise(r=>setTimeout(r,320));o.remove()}
  S.onb=false;S.fin=false;S.view='home';render(true);
}

/* ---------- componentes ---------- */
function head(){return `<header><div><h1>Nova-List</h1><div class="sub">una app de INCOROVA</div>${S.view==='home'?`<div class="hi">${hello()}${getUserName()?', '+esc(getUserName()):''}</div>`:''}</div>
<div class="menu" id="menu"><div class="scrim"></div>${opts.map((o,i)=>`<button class="opt" style="--i:${i};--dx:${o[2]}" data-go="${o[0]}" aria-label="${o[1]}"><span class="lb">${o[1]}</span><span class="ln"></span><i></i></button>`).join('')}</div></header>`}

function calendar(pick){
  const n=new Date(),{y,m}=S.cal,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const due=new Set(S.todos.map(t=>t.due).filter(Boolean));
  if(S.calPick)return `<div class="cal cp"><div class="ch"><button data-cy="-1" aria-label="Año anterior">‹</button><b>${y}</b><button data-cy="1" aria-label="Año siguiente">›</button></div><div class="mg">${MN.map((x,i)=>`<button data-cmm="${i}" class="${i===m?'on':''}">${x}</button>`).join('')}</div></div>`;
  let c='';['D','L','M','M','J','V','S'].forEach(d=>c+=`<b>${d}</b>`);
  for(let i=0;i<first;i++)c+='<span></span>';
  for(let d=1;d<=dim;d++){const k=key(new Date(y,m,d)),td=y===n.getFullYear()&&m===n.getMonth()&&d===n.getDate();c+=`<button ${pick?'data-pd':'data-day'}="${k}" aria-label="Día ${d}" class="${td?'today':''} ${due.has(k)?'has':''} ${pick&&k===(S.pday||key(new Date()))?'sel':''}">${d}</button>`}
  return `<div class="cal"><div class="ch"><button data-cm="-1" aria-label="Mes anterior">‹</button><button class="ct" data-cpick aria-label="Elegir mes y año">${MN[m]} ${y}</button><button data-cm="1" aria-label="Mes siguiente">›</button></div><div class="grid">${c}</div></div>`;
}
const meta=t=>`${esc(t.list)}${t.sec?' › '+esc(t.sec):''}${t.due?' · '+fmtD(t.due)+(t.time?' · '+t.time:''):''}`;
const items=(a,empty)=>a.length?a.map(t=>`<div class="item"><button class="chk ${t.done?'on':''}" data-done="${esc(t.id)}" aria-label="Completar"></button>
<div class="grow"><span style="${t.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.title)}</span><small class="${isLate(t)?'late':''}">${isLate(t)?'Vencido · ':''}${meta(t)}</small></div>
<button class="x" data-del="${esc(t.id)}" aria-label="Eliminar">×</button></div>`).join(''):(empty?`<p class="empty">${empty}</p>`:'');
const page=(t,b)=>head()+`<div><button class="back" data-back>← ${NAMES[S.hist[S.hist.length-1]]||'Inicio'}</button><h2 class="t">${t}</h2>${b}</div>`;
const listSel=(id='tl')=>`<div class="todo-field"><label for="${id}">Lista</label><select id="${id}"><option value="" disabled selected>Selecciona la lista</option>${S.lists.map(l=>`<option value="${esc(l.name)}">${esc(l.name)}</option>`).join('')}</select></div>`;

/* ---------- vistas ---------- */
const V={
home:()=>{const ed=S.edit,o=overdue().length,hl=homeLists(),bd=o?`<b class="bdg" aria-label="${o} vencidos">${o>99?'99+':o}</b>`:'';
  const W={
   cal:()=>calendar(),
   lists:()=>`<button class="wbody" data-go="lists" aria-label="Abrir mis listas"><span class="h">Mis listas<span aria-hidden="true">›</span></span>${hl.map(l=>`<span class="r">${esc(l.name)}<em>${stat(l.name).total}</em></span>`).join('')}</button>`+(S.lists.length>5?`<button class="n2t" data-pickl>Elegir listas (${hl.length}/5)</button>`:''),
   today:()=>`<button class="wbody wl" data-go="today"><span class="lbl">Hoy${bd}</span><em>${today().length}</em></button>`,
   soon:()=>`<button class="wbody wl" data-go="soon"><span>Próximamente</span><em>${soon().length}</em></button>`
  };
  const ctl=i=>`<div class="wctl"><button data-wmv="${i}" data-d="-1" aria-label="Mover antes" ${i?'':'disabled'}>‹</button><button data-wmv="${i}" data-d="1" aria-label="Mover después" ${i<S.layout.length-1?'':'disabled'}>›</button><button data-wsz="${i}" aria-label="Cambiar tamaño">⤢</button></div>`;
  const ch=S.pickL?`<button class="sheet-bg" data-pickx aria-label="Cerrar"></button><div class="sheet" role="dialog"><b>Elige hasta 5 listas para tu panel (${S.homeIds.length}/5)</b>${S.lists.map(l=>`<button class="srow" data-hl="${esc(l.id)}">${esc(l.name)}<i>${S.homeIds.includes(l.id)?'✓':''}</i></button>`).join('')}<button class="pri" data-pickx>Listo</button></div>`:'';
  return head()+(ed?`<div class="edbar"><span>Mueve y ajusta tus paneles</span><div><button class="gpill" data-hreset>Restablecer</button><button class="gpill" data-hdone>Listo</button></div></div>`:'')
   +`<div class="hgrid ${ed?'edit':''}">${S.layout.map((w,i)=>`<div class="wdg w-${w.k} ${w.s==='W'?'w2':''}">${ed?ctl(i):''}${W[w.k]()}</div>`).join('')}</div>`+ch},
today:()=>{const o=overdue();return page('Hoy',(o.length?`<h3 class="sec late" style="margin-top:0">Vencidos</h3>${items(o)}`:'')+`<h3 class="sec" ${o.length?'':'style="margin-top:0"'}>Para hoy</h3>`+items(today(),'No tienes más pendientes para hoy.'))},
soon:()=>page('Próximamente',items(soon(),'Nada vence en las próximas 48 horas.')),
notes:()=>{if(S.nview==='grid')return V.notesGrid();
  const L=P(),i=Math.min(S.bi,L.length-1);S.bi=i;const cur=L[i];
  const sheet=S.sheet&&cur?`<button class="sheet-bg" data-sheetx aria-label="Cerrar"></button><div class="sheet" role="dialog"><b>${esc(noteLines(cur)[0]||'Nota')}</b><button data-sopen>Abrir nota</button><button data-stodo>Agregar a to-do</button><button class="dng" data-sdel>Eliminar</button><button data-sheetx>Cancelar</button></div>`:'';
  return page('Notas rápidas',`<div class="nbar"><button class="pri sm" data-wk="new">+ Nueva nota</button><button class="gpill" data-nview="grid">Índice</button></div>
<div class="book" id="book"><div class="pg" id="pgU"></div><div class="pg ${cur?'':'nw'}" id="pgT">${pgIn(cur,i,L.length)}</div></div>
<div class="bnav"><button class="gpill" data-bk="-1" aria-label="Hoja anterior" ${i?'':'disabled'}>‹</button><span>${i+1} / ${L.length}</span><button class="gpill" data-bk="1" aria-label="Hoja siguiente" ${i<L.length-1?'':'disabled'}>›</button></div>
<p class="lead" style="text-align:center;margin-top:14px">Desliza para pasar la hoja · toca la nota para elegir</p>${sheet}`)},
notesGrid:()=>{const sm=S.selMode,c=S.picked.length,ck='<span class="nchk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
  return page('Notas rápidas',`<div class="nbar"><button class="pri sm" data-wk="new">+ Nueva nota</button><button class="gpill" data-nview="book">Libro</button>${S.notes.length?`<button class="gpill" data-selmode>${sm?'Cancelar':'Seleccionar'}</button>`:''}</div>`
  +(S.notes.length?`<div class="ngrid">${S.notes.map(n=>{const l=noteLines(n),on=S.picked.includes(n.id);return `<button class="ncard ${on?'on':''}" ${sm?`data-pick="${esc(n.id)}" aria-pressed="${on}"`:`data-wk="${esc(n.id)}"`}>${sm?ck:''}<b>${esc(l[0]||'Nota vacía')}</b>${l.length>1?`<span class="tx">${esc(l.slice(1).join(' · '))}</span>`:''}</button>`}).join('')}</div>`:'<p class="empty">Aún no hay notas.</p>')
  +(sm?`<div class="sbar" role="toolbar"><span>${c?c+(c===1?' seleccionada':' seleccionadas'):'Elige notas'}</span><button data-selplan ${c===1?'':'disabled'}>Planificador</button><button class="dng" data-seldel ${c?'':'disabled'}>Eliminar</button></div>`:''))},
ws:()=>{const n=S.notes.find(x=>x.id===S.wk?.id);return page(n?'Editar nota':'Nueva nota',`<textarea id="ed" maxlength="5000" placeholder="Escribe aquí tu nota rápida">${n?esc(noteText(n).trim()):''}</textarea><div class="acts"><button class="pri" data-savewk>Guardar</button>${n?`<button class="n2t" data-toplan="${esc(n.id)}">Pasar al planificador</button><button class="n2t" data-delnote="${esc(n.id)}">Eliminar</button>`:''}</div>`,'notes','Notas')},
new:()=>page('Nuevo to-do',`<div class="todo-form"><input id="ti" class="todo-title" placeholder="¿Qué necesitas hacer?" maxlength="200" autocomplete="off"><div class="todo-fields">${listSel('tl')}<div class="todo-field"><label for="td">Fecha</label><input id="td" type="date" value="${esc(S.pre?.due||'')}"></div><div class="todo-field"><label for="tt">Hora</label><input id="tt" type="time" value="${esc(S.pre?.time||'')}"></div></div><div class="todo-actions"><button class="pri" data-addtodo>Agregar to-do</button></div></div>`),
plan:()=>{
  const A={today:today(),soon:soon(),late:overdue()},f=S.planFilter,m=S.planMode,tk=key(new Date()),pk=S.pday||tk,pd=parseK(pk);
  const T={today:'Tareas de hoy',soon:'Próximas tareas',late:'Tareas vencidas'};
  const E={today:'No tienes tareas para hoy.',soon:'Nada en las próximas 48 horas.',late:'No tienes tareas vencidas.'};
  const sub={today:['Pendientes para hoy','Todo despejado por hoy'],soon:['En las próximas 48 horas','No hay próximas tareas'],late:['Requieren atención','Todo al día']};
  const panel=k=>`<button class="plan-panel ${k==='late'?'late':''} ${f===k?'on':''}" data-pfilter="${k}"><b>${T[k]}</b><span class="pnumb">${A[k].length}</span><small>${sub[k][A[k].length?0:1]}</small></button>`;
  const detail=f?`<section class="pd"><h3 class="sec" style="margin-top:0">${T[f]}</h3>${items(A[f],E[f])}</section>`:'';
  const nn=S.notes.find(x=>x.id===S.planNote);
  const conv=nn?`<section class="pd" id="pn-${esc(nn.id)}"><h3 class="sec" style="margin-top:0">Agregar a to-do</h3><p class="lead" style="margin-bottom:12px">${esc(noteLines(nn)[0]||'Nota rápida')}</p><div class="todo-fields">${listSel('pnl')}<div class="todo-field"><label for="pnd">Fecha</label><input id="pnd" type="date" value="${esc(pk)}"></div><div class="todo-field"><label for="pnt">Hora</label><input id="pnt" type="time"></div></div><div class="todo-actions"><button class="pri sm" data-noteconvert="${esc(nn.id)}">Crear to-do</button><button class="n2t" data-close-note>Cancelar</button></div></section>`:'';
  const dl=cap(pd.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}));
  const nav=(n,l)=>`<div class="pnv"><button class="gpill" data-pdn="-${n}" aria-label="Anterior">‹</button><b>${l}</b><button class="gpill" data-pdn="${n}" aria-label="Siguiente">›</button></div>`;
  const nowB=pk!==tk?`<button class="n2t" data-pdt style="margin-bottom:10px">Ir a hoy</button>`:'';
  const task=t=>`<div class="tk"><button class="chk ${t.done?'on':''}" data-done="${esc(t.id)}" aria-label="Completar"></button><span class="${t.done?'dn':''}">${esc(t.title)}</span><small>${t.time||''}</small></div>`;
  const dayT=todosOn(pk),nh=dayT.filter(t=>!t.time);
  let hrs='';for(let h=0;h<24;h++){const H=String(h).padStart(2,'0');hrs+=`<div class="hr" data-h="${h}"><b>${H}:00</b><div class="hs">${dayT.filter(t=>t.time&&t.time.slice(0,2)===H).map(task).join('')}<button class="slot" data-slot="${H}" aria-label="Agregar a las ${H}:00">+</button></div></div>`}
  const bDay=nav(1,dl)+nowB+(nh.length?`<div class="nh"><small>Sin hora</small>${nh.map(task).join('')}</div>`:'')+`<div class="tl">${hrs}</div>`;
  const dayList=`<h3 class="sec">${dl}</h3>${items(dayT,'No hay pendientes este día.')}<button class="n2t" data-slot="" style="margin-top:8px">+ Agregar to-do</button>`;
  const mo=mon(pd),strip=[...Array(7)].map((_,i)=>{const d=addD(mo,i),k=key(d),n=todosOn(k).filter(x=>!x.done).length;return `<button class="wk ${k===pk?'sel':''} ${k===tk?'tod':''}" data-pd="${k}"><small>${DN[i].slice(0,3)}</small><b>${d.getDate()}</b>${n?'<i></i>':''}</button>`}).join('');
  const bWeek=nav(7,'Semana del '+mo.getDate()+' '+MN[mo.getMonth()])+nowB+`<div class="wstrip">${strip}</div>`+dayList;
  const bMonth=calendar(true)+dayList;
  const acc=(k,t,s,b)=>`<section class="acc ${m===k?'open':''}" data-acc="${k}"><button class="acc-h" data-organize="${k}" aria-expanded="${m===k}"><span><b>${t}</b><small>${s}</small></span><i>›</i></button><div class="acc-b"><div class="acc-in"><div class="acc-pad">${b}</div></div></div></section>`;
  return page('Planificador',conv+`<div class="plan-summary">${panel('today')}${panel('soon')}${panel('late')}</div>${detail}`
    +acc('day','Organiza tu día','Cronograma hora por hora',bDay)+acc('week','Organiza tu semana','Desplázate entre los días',bWeek)+acc('month','Organiza tu mes','Calendario minimalista',bMonth))
},
day:()=>{const [y,m,d]=S.day.split('-').map(Number);let l=new Date(y,m-1,d).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});l=l[0].toUpperCase()+l.slice(1);
  return page(l,items(todosOn(S.day),'No hay pendientes este día.')+`<h3 class="sec">Nuevo to-do para este día</h3><div class="todo-form"><input id="ti" class="todo-title" placeholder="¿Qué hay que hacer?" maxlength="200"><div class="todo-fields">${listSel('tl')}<div class="todo-field"><label for="tt">Hora</label><input id="tt" type="time"></div></div><div class="todo-actions"><button class="pri" data-addday>Agregar to-do</button></div></div>`)},
lists:()=>page('Mis listas',`<div class="mkl"><input id="nl" placeholder="Nombre de la nueva lista" maxlength="40" aria-label="Nombre de la lista"><button class="pri sm" data-newlist>Crear lista</button></div>`+S.lists.map((l,i)=>{const s=stat(l.name);return `<div class="lw" data-li="${i}" data-lid="${esc(l.id)}"><span class="dstar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3Q12 12 21 12Q12 12 12 21Q12 12 3 12Q12 12 12 3Z"/></svg></span><button class="lst" data-ol="${i}"><div>${esc(l.name)}<span>${s.done}/${s.total} · ${s.p}%</span></div>${bar(s.p)}</button></div>`}).join('')+(S.lists.length>1?'<p class="lead" style="text-align:center;margin-top:14px">Desliza una lista hacia la izquierda para eliminarla</p>':'')),
list:()=>{const l=S.lists[S.cur];if(!l){S.view='lists';return V.lists()}
  const s=stat(l.name),gs=['',...l.secs],ed=S.adding;
  return page(esc(l.name),`<div>${bar(s.p)}<p class="sub" style="text-transform:none;letter-spacing:0;font-size:13px">${s.done} de ${s.total} completadas · ${s.p}%</p></div><button class="pri sm" data-adding style="margin-top:18px">${ed?'Cerrar':'+ Nueva tarea'}</button>`
   +(!ed&&!s.total?'<p class="empty" style="margin-top:14px">Aún no hay tareas. Toca "Nueva tarea" para empezar.</p>':'')
   +gs.map((g,i)=>{const a=S.todos.filter(t=>t.list===l.name&&(t.sec||'')===g);
     return (g||l.secs.length||a.length||ed?`<h3 class="sec">${g?esc(g):'Sin subtítulo'}</h3>`:'')+items(a)+(ed?`<div class="add"><input placeholder="Agregar tarea" maxlength="200"><button data-addt="${i}" aria-label="Agregar tarea">Agregar</button></div>`:'')}).join('')
   +(ed?`<h3 class="sec">Nuevo subtítulo</h3><div class="add"><input placeholder="Ej. Esta semana" maxlength="40"><button data-addsec aria-label="Crear subtítulo">Crear</button></div>`:'')
   +`<p style="margin-top:32px"><button class="pri" data-back>Listo</button></p><p style="margin-top:28px"><button class="n2t" data-dellist>Eliminar esta lista</button></p>`)},
settings:()=>page('Ajustes',`<p><button class="n2t" data-changename>Cambiar nombre</button></p><p style="margin-top:28px"><button class="n2t" data-logout>Cerrar sesión</button></p>`),
about:()=>page('Acerca de',`<p style="line-height:1.55">Nova-List es una app de INCOROVA para ordenar notas, pendientes y planes en un solo lugar.</p>`)
};

function render(anim){
  if(S.onb){onbMount();return}
  try{$('#app').innerHTML=(V[S.view]||V.home)();window.scrollTo(0,0);if(anim){const a=$('#app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in')}}
  catch(e){console.error('RENDER:',e);$('#app').innerHTML='<div style="padding-top:60px;text-align:center"><h2>Nova-List</h2><p style="color:var(--mut);margin-top:12px">Ocurrió un problema al cargar la interfaz.</p><button class="pri" style="margin-top:24px" onclick="location.reload()">Recargar</button></div>'}
  const grp={home:'home',notes:'notes',ws:'notes',new:'new',plan:'plan'}[S.view];
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===grp));
  tlScroll();
}
const clr=()=>{S.adding=false;S.planNote=null;S.selMode=false;S.picked=[];S.sheet=null;S.pre=null;S.edit=false;S.pickL=false};
const go=(v,reset)=>{if(reset||v==='home')S.hist=[];else if(v!==S.view){S.hist.push(S.view);if(S.hist.length>20)S.hist.shift()}S.view=v;clr();render(true)};
const back=()=>{S.view=S.hist.pop()||'home';clr();render(true)};
const toPlan=id=>{S.hist.push(S.view);clr();S.view='plan';S.planNote=id;render(true);setTimeout(()=>document.getElementById('pn-'+id)?.scrollIntoView({block:'center',behavior:'smooth'}),60)};
const keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
async function addTodo(todo){S.todos.push(todo);const ok=await saveTodo(todo);if(ok)flash()}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'),menu=$('#menu'),open=menu&&menu.classList.contains('open');
  if(open&&!(t&&t.classList.contains('opt')))menu.classList.remove('open');
  if(!t)return;
  const D=t.dataset,has=a=>t.hasAttribute(a);
  if(S.noClick&&t.closest('.lw,.wdg'))return;
  if(has('data-hdone')){S.edit=false;return keep()}
  if(has('data-hreset')){S.layout=DEFL.map(d=>({...d}));S.homeIds=[];saveHome();return keep()}
  if(has('data-pickl')){if(!S.homeIds.length)S.homeIds=homeLists().map(l=>l.id);S.pickL=true;return keep()}
  if(has('data-pickx')){S.pickL=false;saveHome();return keep()}
  if(D.hl){const i=S.homeIds.indexOf(D.hl);if(i>=0)S.homeIds.splice(i,1);else{if(S.homeIds.length>=5)return notify('Máximo 5 listas en el panel.');S.homeIds.push(D.hl)}saveHome();return keep()}
  if(D.wmv!==undefined){const i=+D.wmv,j=i+(+D.d);if(j<0||j>=S.layout.length)return;[S.layout[i],S.layout[j]]=[S.layout[j],S.layout[i]];saveHome();return keep()}
  if(D.wsz!==undefined){const w=S.layout[+D.wsz];if(!w)return;w.s=w.s==='W'?'S':'W';saveHome();return keep()}
  if(D.ob)return onbAct(D.ob);
  if(has('data-entry-main')){closeEntry();return go('home')}
  if(has('data-entry-note')){closeEntry();S.wk={id:null};return go('ws')}
  if(t.id==='googleLogin')return signInWithGoogle(false);
  if(t.id==='googleOther')return signInWithGoogle(true);
  if(has('data-logout'))return signOut();
  if(has('data-changename'))return changeName();
  if(has('data-back'))return back();
  if(D.nview){S.nview=D.nview;S.selMode=false;S.picked=[];return keep()}
  if(D.bk)return flip(+D.bk);
  if(has('data-sheetx')){S.sheet=null;return keep()}
  if(has('data-sopen')){S.wk={id:S.sheet};return go('ws')}
  if(has('data-stodo'))return toPlan(S.sheet);
  if(has('data-sdel')){const id=S.sheet;if(!id||!confirm('¿Eliminar esta nota?'))return;S.notes=S.notes.filter(n=>n.id!==id);S.sheet=null;keep();if(S.user)await deleteNote(id);return}
  if(D.organize){S.planMode=S.planMode===D.organize?'':D.organize;document.querySelectorAll('.acc').forEach(a=>{const o=a.dataset.acc===S.planMode;a.classList.toggle('open',o);a.querySelector('.acc-h')?.setAttribute('aria-expanded',o)});if(S.planMode==='day')setTimeout(tlScroll,480);return}
  const sync=k=>{S.pday=k;const d=parseK(k);S.cal={y:d.getFullYear(),m:d.getMonth()};keep()};
  if(D.pd)return sync(D.pd);
  if(D.pdn){const d=parseK(S.pday||key(new Date()));d.setDate(d.getDate()+(+D.pdn));return sync(key(d))}
  if(has('data-pdt'))return sync(key(new Date()));
  if(D.slot!==undefined){S.hist.push(S.view);clr();S.pre={due:S.pday||key(new Date()),time:D.slot?D.slot+':00':''};S.view='new';return render(true)}
  if(has('data-selmode')){S.selMode=!S.selMode;S.picked=[];return keep()}
  if(D.pick){const i=S.picked.indexOf(D.pick);i<0?S.picked.push(D.pick):S.picked.splice(i,1);return keep()}
  if(has('data-selplan')){return S.picked.length===1?toPlan(S.picked[0]):undefined}
  if(D.toplan)return toPlan(D.toplan);
  if(has('data-seldel')){const ids=[...S.picked];if(!ids.length)return;
    if(!confirm(ids.length===1?'¿Eliminar esta nota?':'¿Eliminar '+ids.length+' notas?'))return;
    S.notes=S.notes.filter(n=>!ids.includes(n.id));S.selMode=false;S.picked=[];keep();
    if(S.user)await run(sb.from('notes').delete().in('id',ids).eq('user_id',S.user.id));return}
  if(t.classList.contains('opt')){if(!open){menu.classList.add('open');return}return go(D.go)}
  if(D.go)return go(D.go,!!t.closest('nav'));
  if(D.day){S.day=D.day;return go('day')}
  if(D.ol!==undefined){S.cur=+D.ol;return go('list')}
  if(D.done){const x=S.todos.find(i=>i.id===D.done);if(!x)return;x.done=!x.done;keep();await saveTodo(x);return}
  if(D.del){S.todos=S.todos.filter(i=>i.id!==D.del);keep();await deleteTodo(D.del);return}
  if(D.pfilter){S.planFilter=S.planFilter===D.pfilter?'':D.pfilter;return keep()}
  if(D.organize){S.planMode=D.organize;return keep()}
  if(D.noteopen){S.planNote=D.noteopen;return keep()}
  if(has('data-close-note')){S.planNote=null;return keep()}
  if(D.noteconvert){
    const n=S.notes.find(x=>x.id===D.noteconvert);if(!n)return;
    const list=$('#pnl')?.value||'',due=$('#pnd')?.value||'',time=$('#pnt')?.value||'';
    if(!list)return $('#pnl')?.focus();if(!due)return $('#pnd')?.focus();
    const title=(noteLines(n).join(' ')||'Nota rápida').slice(0,200);
    S.planNote=null;keep();return addTodo({id:uuid(),title,list,sec:'',due,time,done:false});
  }
  if(D.cm){S.cal.m+=+D.cm;if(S.cal.m<0){S.cal.m=11;S.cal.y--}if(S.cal.m>11){S.cal.m=0;S.cal.y++}return keep()}
  if(D.cy){S.cal.y+=+D.cy;return keep()}
  if(D.cmm!==undefined){S.cal.m=+D.cmm;S.calPick=false;return keep()}
  if(has('data-cpick')){S.calPick=!S.calPick;return keep()}
  if(D.wk){S.wk={id:D.wk==='new'?null:D.wk};return go('ws')}
  if(has('data-savewk')){
    const text=($('#ed')?.value||'').trim();if(!text)return $('#ed')?.focus();
    const id=S.wk?.id||uuid(),note={id,text},i=S.notes.findIndex(n=>n.id===id);
    if(i>=0)S.notes[i]=note;else{S.notes.unshift(note);S.bi=0}
    back();if(await saveNote(note))flash();return;
  }
  if(D.delnote){S.notes=S.notes.filter(i=>i.id!==D.delnote);back();await deleteNote(D.delnote);return}
  if(has('data-newlist')){
    const inp=$('#nl'),v=inp.value.trim();if(!v)return inp.focus();
    if(S.lists.some(l=>l.name.toLowerCase()===v.toLowerCase())){notify('Ya existe una lista con ese nombre.');return inp.focus()}
    const list={name:v,secs:[]};if(!await saveList(list))return;
    S.lists.push(list);if(S.homeIds.length&&S.homeIds.length<5){S.homeIds.push(list.id);saveHome()}flash();return floatList(list);
  }
  if(has('data-adding')){S.adding=!S.adding;return keep()}
  if(D.addt!==undefined){
    const l=S.lists[S.cur];if(!l)return;const inp=t.previousElementSibling,v=inp.value.trim();if(!v)return inp.focus();
    keep();return addTodo({id:uuid(),title:v,list:l.name,sec:['',...l.secs][+D.addt]||'',due:'',time:'',done:false});
  }
  if(has('data-addsec')){
    const l=S.lists[S.cur];if(!l)return;const inp=t.previousElementSibling,v=inp.value.trim();
    if(!v||l.secs.some(x=>x.toLowerCase()===v.toLowerCase()))return inp.focus();
    l.secs.push(v);keep();if(await saveList(l))flash();return;
  }
  if(has('data-dellist'))return void await delList(S.cur,false);
  if(has('data-addtodo')||has('data-addday')){
    const inDay=has('data-addday'),v=($('#ti')?.value||'').trim();if(!v)return $('#ti')?.focus();
    const list=$('#tl')?.value||'';if(!list)return $('#tl')?.focus();
    const due=inDay?S.day:($('#td')?.value||'');if(!due)return $('#td')?.focus();
    const todo={id:uuid(),title:v.slice(0,200),list,sec:'',due,time:$('#tt')?.value||'',done:false};
    S.todos.push(todo);inDay?render():back();
    if(await saveTodo(todo))flash();
    return;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='obn')return onbAct(S.ob.step==='welcome'?'saveName':'create');
  if(e.key==='Enter'&&e.target.matches('.add input,.mkl input'))e.target.nextElementSibling?.click();
});

/* ---------- libro de notas ---------- */
const P=()=>[...S.notes,null];
const pgIn=(n,i,t)=>{if(!n)return '<div class="plus">+</div><b>Nueva nota</b><span class="tx" style="flex:none">Toca para escribir</span><span class="pnum">'+(i+1)+'</span>';
  const l=noteLines(n);return `<b>${esc(l[0]||'Nota vacía')}</b><span class="tx">${esc(l.slice(1).join('\n'))}</span><span class="pnum">${i+1} / ${t}</span>`};
const tlScroll=()=>{if(S.view!=='plan'||S.planMode!=='day')return;const tl=$('.tl'),r=tl?.querySelector('[data-h="'+Math.max(0,new Date().getHours()-1)+'"]');if(tl&&r&&(!S.pday||S.pday===key(new Date())))tl.scrollTop=r.offsetTop};
function flip(dir){
  const L=P(),n=S.bi+dir;if(S.flip||n<0||n>=L.length)return;
  const T=$('#pgT'),U=$('#pgU');if(!T||!U||!T.animate)return;S.flip=true;
  const fin=()=>{S.bi=n;S.flip=false;keep()},o={duration:650,easing:'cubic-bezier(.5,0,.2,1)',fill:'both'};
  let a;
  if(dir>0){U.className='pg'+(L[n]?'':' nw');U.innerHTML=pgIn(L[n],n,L.length);
    a=T.animate([{transform:'rotateY(0)',opacity:1},{transform:'rotateY(-150deg)',opacity:0}],o)}
  else{U.className='pg'+(L[S.bi]?'':' nw');U.innerHTML=pgIn(L[S.bi],S.bi,L.length);T.className='pg'+(L[n]?'':' nw');T.innerHTML=pgIn(L[n],n,L.length);
    a=T.animate([{transform:'rotateY(-150deg)',opacity:0},{transform:'rotateY(0)',opacity:1}],o)}
  a.finished.then(fin,fin);
}
let px=null;
document.addEventListener('pointerdown',e=>{px=e.target.closest('#book')?{x:e.clientX,y:e.clientY}:null});
document.addEventListener('pointercancel',()=>{px=null});
document.addEventListener('pointerup',e=>{if(!px)return;const dx=e.clientX-px.x,dy=e.clientY-px.y;px=null;if(S.flip||S.view!=='notes')return;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))return flip(dx<0?1:-1);
  if(Math.abs(dx)<10&&Math.abs(dy)<10){const c=P()[S.bi];if(!c){S.wk={id:null};return go('ws')}S.sheet=c.id;keep()}});
document.addEventListener('keydown',e=>{if(S.view==='notes'&&S.nview==='book'&&!e.target.matches('input,textarea,select')){if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)}});

/* ---------- panel personalizable ---------- */
function initHome(){const md=S.user?.user_metadata||{};
  let L=Array.isArray(md.home_layout)?md.home_layout.filter(w=>w&&DEFL.some(d=>d.k===w.k)).map(w=>({k:w.k,s:w.s==='W'?'W':'S'})):[];
  L=L.filter((w,i)=>L.findIndex(x=>x.k===w.k)===i);DEFL.forEach(d=>{if(!L.some(w=>w.k===d.k))L.push({...d})});
  S.layout=L;S.homeIds=Array.isArray(md.home_lists)?md.home_lists.filter(x=>typeof x==='string').slice(0,5):[]}
const homeLists=()=>{const v=S.homeIds.map(id=>S.lists.find(l=>l.id===id)).filter(Boolean).slice(0,5);return v.length?v:S.lists.slice(0,5)};
let hT;
function saveHome(){clearTimeout(hT);hT=setTimeout(async()=>{if(!S.user)return;
  try{const {data,error}=await sb.auth.updateUser({data:{home_layout:S.layout,home_lists:S.homeIds}});if(error)throw error;if(data?.user)S.user=data.user}
  catch(e){console.error(e);notify('No se pudo guardar tu personalización.')}},500)}
/* presión larga sobre un panel: modo acomodar */
let lp=null;
document.addEventListener('pointerdown',e=>{const w=S.view==='home'&&!S.edit&&e.target.closest('.wdg');if(!w)return;
  lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{lp=null;S.edit=true;S.noClick=true;setTimeout(()=>S.noClick=false,600);if(navigator.vibrate)navigator.vibrate(12);keep()},520)}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.wdg,.lw'))e.preventDefault()});
/* eliminar lista */
async function delList(i,sw){const l=S.lists[i];if(!l)return false;
  if(S.lists.length<2){notify('Debes conservar al menos una lista.');return false}
  const n=S.todos.filter(x=>x.list===l.name).length;
  if((n||!sw)&&!confirm(n?'¿Eliminar "'+l.name+'" y sus '+n+(n===1?' tarea?':' tareas?'):'¿Eliminar "'+l.name+'"?'))return false;
  S.todos=S.todos.filter(x=>x.list!==l.name);S.lists.splice(i,1);
  if(S.homeIds.includes(l.id)){S.homeIds=S.homeIds.filter(x=>x!==l.id);saveHome()}
  if(S.view==='list')back();else keep();
  if(S.user)await run(sb.from('todos').delete().eq('user_id',S.user.id).eq('list',l.name));
  await deleteList(l.id);return true}
/* crear lista: la nueva se desprende del campo y flota a su lugar */
function floatList(list){render();
  const card=document.querySelector('.lw[data-lid="'+CSS.escape(String(list.id))+'"]');if(!card||!card.animate)return;
  card.style.opacity='0';card.scrollIntoView({block:'nearest'});
  setTimeout(()=>{const r1=card.getBoundingClientRect(),m=$('.mkl'),r2=m?m.getBoundingClientRect():r1,dy=r2.top-r1.top;card.style.opacity='';
    card.animate([{transform:`translateY(${dy}px) scale(.86)`,opacity:0},{transform:`translateY(${dy*.55}px) scale(.95)`,opacity:1,offset:.3},{transform:'none',opacity:1}],{duration:950,easing:'cubic-bezier(.3,.7,.2,1)'})},1000)}
/* deslizar para eliminar: la estrella gira hasta formar una X */
const TH=110;let dg=null;
document.addEventListener('pointerdown',e=>{const w=e.target.closest('.lw');dg=w?{w,x:e.clientX,y:e.clientY,dx:0,on:false}:null});
document.addEventListener('pointermove',e=>{
  if(lp&&(Math.abs(e.clientX-lp.x)>8||Math.abs(e.clientY-lp.y)>8)){clearTimeout(lp.t);lp=null}
  if(!dg)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;
  if(!dg.on){if(dx<-10&&Math.abs(dx)>Math.abs(dy)*1.5)dg.on=true;else{if(Math.abs(dy)>10)dg=null;return}}
  dg.dx=Math.min(0,dx);const p=Math.min(1,-dg.dx/TH),c=dg.w.querySelector('.lst'),s=dg.w.querySelector('.dstar');
  c.style.transition='none';c.style.transform=`translateX(${dg.dx}px)`;
  s.style.opacity=Math.min(1,p*1.6);s.style.transform=`scale(${.6+.4*p}) rotate(${p*405}deg)`;s.classList.toggle('rdy',p>=1)});
const endDrag=async cancel=>{if(lp){clearTimeout(lp.t);lp=null}if(!dg)return;const d=dg;dg=null;if(!d.on)return;
  S.noClick=true;setTimeout(()=>S.noClick=false,350);
  const c=d.w.querySelector('.lst'),s=d.w.querySelector('.dstar'),ok=!cancel&&-d.dx>=TH;
  if(ok){c.style.transition='transform .22s ease,opacity .22s';c.style.transform='translateX(-110%)';c.style.opacity='0';
    await new Promise(r=>setTimeout(r,230));
    if(!await delList(+d.w.dataset.li,true)){c.style.transform='';c.style.opacity='';s.style.opacity='0'}}
  else{c.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';c.style.transform='';s.style.opacity='0';s.style.transform=''}};
document.addEventListener('pointerup',()=>endDrag(false));
document.addEventListener('pointercancel',()=>endDrag(true));

/* ---------- inicio ---------- */
async function start(session){
  const same=S.user?.id===session.user.id;
  S.user=session.user;$('#auth').classList.remove('show');
  if(same&&(cloudReady||booting))return;
  booting=true;try{await loadCloud()}finally{booting=false}
}
sb.auth.onAuthStateChange((ev,session)=>{setTimeout(async()=>{
  try{if(session?.user)await start(session);else if(ev==='SIGNED_OUT'){S.user=null;cloudReady=false;$('#auth').classList.add('show');$('#app').innerHTML=''}}
  catch(e){console.error('AUTH:',e);render()}},0)});
(async()=>{
  try{const {data:{session}}=await sb.auth.getSession();
    if(session?.user)await start(session);else $('#auth').classList.add('show')}
  catch(e){console.error('INIT:',e);$('#auth').classList.add('show')}
  $('#loading').classList.add('hide');
})();
setInterval(()=>{if(S.view==='home'&&S.user&&!S.onb&&!S.entry&&!S.edit&&!S.pickL&&!$('#menu')?.classList.contains('open'))keep()},60000);
</script>
