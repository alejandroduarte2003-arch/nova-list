<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Nova List</title>

  <meta
    name="description"
    content="Nova List - una APP de Incorova"
  />

  <meta name="theme-color" content="#ffffff" />

  <link rel="manifest" href="manifest.json" />

  <link
    rel="apple-touch-icon"
    href="nova-icon.png"
  />

  <style>

    /* =====================================================
       NOVA LIST
       GEOMETRIC SANS
       BLACK / WHITE
    ===================================================== */

    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

    :root {
      --black: #000000;
      --white: #ffffff;
      --gray: #707070;
      --light-gray: #e8e8e8;
      --very-light: #f6f6f6;
      --red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #fff;
      color: #000;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: 'Montserrat', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input,
    textarea {
      outline: none;
    }


    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: min(920px, 100%);
      min-height: 100vh;
      margin: 0 auto;

      padding:
        clamp(22px, 4vw, 42px)
        clamp(18px, 4vw, 42px)
        100px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .main-header {
      position: relative;

      width: 100%;
      min-height: 92px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-left {
      position: relative;
      z-index: 2;
    }

    .brand {
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 600;
      letter-spacing: -1.5px;
      line-height: 1;
    }

    .brand-subtitle {
      margin-top: 7px;

      font-size: 10px;
      letter-spacing: 0.4px;
      font-weight: 500;
    }

    .greeting {
      margin-top: 22px;

      font-size: 13px;
      font-weight: 500;
    }


    /* =====================================================
       MENU — NUEVA ESTRUCTURA
    ===================================================== */

    .menu-container {
      position: relative;

      width: 150px;
      height: 115px;

      flex: 0 0 150px;

      z-index: 2000;
    }


    /* -----------------------------------------------------
       BOTÓN DE LOS 3 PUNTOS
    ----------------------------------------------------- */

    .dots-button {
      position: absolute;

      top: 0;
      right: 0;

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      z-index: 2020;
    }

    .dots {
      width: 19px;
      height: 8px;

      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;

      position: relative;
    }

    .dot {
      position: relative !important;

      display: block;

      width: 4px;
      height: 4px;

      min-width: 4px;
      min-height: 4px;

      border-radius: 50%;

      background: #000;

      margin: 0;
      padding: 0;

      transition:
        transform 0.30s ease,
        opacity 0.20s ease;
    }


    /* -----------------------------------------------------
       X
    ----------------------------------------------------- */

    .menu-close {
      position: absolute;

      top: 0;
      right: 0;

      width: 34px;
      height: 34px;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 0;

      font-size: 20px;
      font-weight: 400;

      z-index: 2030;
    }

    .menu-container.open .menu-close {
      display: flex;
    }

    .menu-container.open .dots-button {
      pointer-events: none;
    }


    /* =====================================================
       CADA FILA DEL MENÚ
    ===================================================== */

    .menu-row {
      position: absolute;

      right: 0;

      width: 145px;
      height: 22px;

      display: flex;
      align-items: center;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.15s ease;

      z-index: 2010;
    }


    /* POSICIÓN DE CADA FILA */

    .menu-row-1 {
      top: 27px;
    }

    .menu-row-2 {
      top: 57px;
    }

    .menu-row-3 {
      top: 87px;
    }


    /* -----------------------------------------------------
       PUNTO DEL MENÚ ABIERTO
    ----------------------------------------------------- */

    .menu-point {
      position: absolute;

      right: 10px;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #000;

      flex: 0 0 4px;
    }


    /* -----------------------------------------------------
       LÍNEA
    ----------------------------------------------------- */

    .menu-line {
      position: absolute;

      right: 14px;

      width: 0;
      height: 1px;

      background: #000;

      transition:
        width 0.25s ease;
    }


    /* -----------------------------------------------------
       TEXTO
    ----------------------------------------------------- */

    .menu-text {
      position: absolute;

      right: 0;

      font-size: 11px;
      font-weight: 500;

      opacity: 0;

      transform: translateX(5px);

      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }


    /* =====================================================
       ABRIR MENÚ
    ===================================================== */

    .menu-container.open .menu-row {
      opacity: 1;
      pointer-events: auto;
    }


    /*
      Primero aparece/crece la línea.
    */

    .menu-container.open .menu-line {
      width: 65px;
    }


    /*
      Después aparece el texto.
    */

    .menu-container.open .menu-text {
      opacity: 1;

      transform: translateX(0);

      transition-delay: 0.25s;
    }


    /* =====================================================
       POSICIÓN EXACTA DEL PUNTO DE CADA FILA
    ===================================================== */

    .menu-row-1 .menu-point {
      top: 9px;
    }

    .menu-row-2 .menu-point {
      top: 9px;
    }

    .menu-row-3 .menu-point {
      top: 9px;
    }


    /* =====================================================
       QUICK ACTIONS
    ===================================================== */

    .quick-actions {
      margin-top: 48px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 24px;
    }

    .quick-action {
      min-height: 105px;

      border: 1px solid #000;

      padding: 20px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;

      transition:
        background 0.2s ease;
    }

    .quick-action:hover {
      background: #f6f6f6;
    }

    .quick-action-icon {
      height: 32px;

      display: flex;
      align-items: center;

      margin-bottom: 10px;
    }

    .quick-action-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }


    /* POST IT */

    .post-it {
      position: relative;

      width: 24px;
      height: 24px;

      border: 1.5px solid #000;
    }

    .post-it::after {
      content: "";

      position: absolute;

      right: -1.5px;
      bottom: -1.5px;

      width: 8px;
      height: 8px;

      background: #fff;

      border-left: 1.5px solid #000;
      border-top: 1.5px solid #000;
    }


    /* STAR */

    .star-circle {
      width: 27px;
      height: 27px;

      border: 1.4px solid #000;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .star {
      font-size: 15px;
      line-height: 1;
    }


    /* =====================================================
       REMINDER PANEL
    ===================================================== */

    .reminder-panel {
      display: none;

      margin-top: 28px;

      border-top: 1px solid #000;
      border-bottom: 1px solid #000;

      padding: 25px 0;
    }

    .reminder-panel.visible {
      display: block;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 600;

      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;

      margin-bottom: 10px;

      font-size: 11px;
      font-weight: 600;
    }

    .text-input {
      width: 100%;

      border: none;
      border-bottom: 1px solid #000;

      border-radius: 0;

      padding: 10px 0;

      font-size: 14px;

      background: transparent;
      color: #000;
    }

    .text-input::placeholder {
      color: #8b8b8b;
    }


    /* =====================================================
       SELECTOR DE LISTA
    ===================================================== */

    .list-selector {
      position: relative;
    }

    .selected-list-row {
      min-height: 40px;

      border-bottom: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      cursor: pointer;
    }

    .selected-list {
      font-size: 13px;
      color: #000;
    }

    .list-arrow {
      font-size: 17px;
      line-height: 1;

      transition:
        transform 0.25s ease;
    }

    .list-selector.expanded .list-arrow {
      transform: rotate(90deg);
    }

    .list-options {
      display: none;

      border-bottom: 1px solid #000;
    }

    .list-selector.expanded .list-options {
      display: block;
    }

    .list-option {
      padding: 11px 0;

      font-size: 12px;

      border-bottom: 1px solid #e8e8e8;

      cursor: pointer;
    }

    .list-option:last-child {
      border-bottom: none;
    }

    .list-option:hover {
      font-weight: 600;
    }

    .create-list-option {
      padding: 12px 0;

      font-size: 11px;
      font-weight: 600;

      cursor: pointer;
    }


    /* =====================================================
       DATE / TIME
    ===================================================== */

    .date-input,
    .time-input {
      width: 100%;
      height: 42px;

      border: 1px solid #000;

      border-radius: 0;

      background: #fff;

      padding: 0 12px;

      font-size: 13px;
    }

    .time-wrapper {
      display: none;

      margin-top: 13px;
    }

    .time-wrapper.visible {
      display: block;
    }


    /* =====================================================
       YES / NO
    ===================================================== */

    .choice-row {
      display: flex;
      gap: 22px;
    }

    .choice-button {
      display: flex;
      align-items: center;

      gap: 8px;

      font-size: 12px;
    }

    .choice-circle {
      width: 17px;
      height: 17px;

      border: 1px solid #000;

      border-radius: 50%;

      position: relative;
    }

    .choice-button.selected .choice-circle::after {
      content: "";

      position: absolute;

      inset: 3px;

      background: #000;

      border-radius: 50%;
    }

    .save-reminder {
      width: 100%;
      height: 45px;

      border: 1px solid #000;

      margin-top: 8px;

      font-size: 12px;
      font-weight: 600;
    }

    .save-reminder:hover {
      background: #000;
      color: #fff;
    }

    .cancel-reminder {
      width: 100%;
      height: 40px;

      margin-top: 8px;

      font-size: 11px;

      color: #666;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .main-content {
      margin-top: 46px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;

      margin-bottom: 16px;
    }


    /* =====================================================
       CALENDAR
    ===================================================== */

    .calendar-section {
      margin-top: 34px;
    }

    .calendar-box {
      border: 1px solid #000;

      padding: 18px;
    }

    .calendar-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .calendar-month {
      font-size: 13px;
      font-weight: 600;
    }

    .calendar-controls {
      display: flex;
      gap: 10px;
    }

    .calendar-control {
      width: 25px;
      height: 25px;

      display: flex;

      justify-content: center;
      align-items: center;

      font-size: 14px;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;

      grid-template-columns: repeat(7, 1fr);

      gap: 4px;
    }

    .calendar-weekday {
      text-align: center;

      font-size: 8px;

      color: #666;

      padding-bottom: 8px;
    }

    .calendar-day {
      min-height: 31px;

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      font-size: 10px;

      cursor: pointer;

      border: 1px solid transparent;
    }

    .calendar-day:hover {
      border-color: #000;
    }

    .calendar-day.today {
      border: 1px solid #000;

      font-weight: 700;
    }

    .calendar-day.selected {
      background: #000;

      color: #fff;
    }

    .calendar-day.has-items::after {
      content: "";

      position: absolute;

      bottom: 4px;

      width: 3px;
      height: 3px;

      background: #000;

      border-radius: 50%;
    }

    .calendar-day.selected.has-items::after {
      background: #fff;
    }

    .calendar-day.empty {
      cursor: default;
    }


    /* =====================================================
       HOY / PROXIMAMENTE
    ===================================================== */

    .day-navigation {
      margin-top: 32px;

      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .day-button {
      min-height: 62px;

      border-top: 1px solid #000;
      border-bottom: 1px solid #000;

      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 0 5px;

      text-align: left;
    }

    .day-button-left {
      display: flex;

      align-items: center;

      gap: 9px;
    }

    .day-button-title {
      font-size: 13px;
      font-weight: 600;
    }

    .day-arrow {
      font-size: 18px;
    }


    /* =====================================================
       BADGE
    ===================================================== */

    .notification-badge {
      display: none;

      min-width: 18px;
      height: 18px;

      padding: 0 5px;

      background: #ff3b30;

      color: #fff;

      border-radius: 999px;

      font-size: 9px;
      font-weight: 700;

      align-items: center;
      justify-content: center;
    }

    .notification-badge.visible {
      display: inline-flex;
    }


    /* =====================================================
       VIEWS
    ===================================================== */

    .view {
      display: none;

      margin-top: 35px;
    }

    .view.active {
      display: block;
    }

    .view-header {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 24px;
    }

    .back-button {
      width: 30px;
      height: 30px;

      font-size: 19px;
    }

    .view-title {
      font-size: 18px;
      font-weight: 600;
    }

    .view-date {
      font-size: 10px;

      color: #666;

      margin-top: 4px;
    }


    /* =====================================================
       TASKS
    ===================================================== */

    .items-container {
      display: flex;
      flex-direction: column;
    }

    .task-item {
      min-height: 67px;

      border-top: 1px solid #000;

      display: flex;

      align-items: center;

      gap: 13px;

      padding: 10px 3px;
    }

    .task-item:last-child {
      border-bottom: 1px solid #000;
    }

    .task-check {
      width: 18px;
      height: 18px;

      border: 1px solid #000;

      flex: 0 0 18px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .task-check.completed::after {
      content: "✓";

      font-size: 11px;
    }

    .task-content {
      min-width: 0;
      flex: 1;
    }

    .task-title {
      font-size: 12px;

      font-weight: 500;

      line-height: 1.4;

      word-break: break-word;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;

      color: #777;
    }

    .task-meta {
      display: flex;

      gap: 9px;

      flex-wrap: wrap;

      margin-top: 4px;

      font-size: 8px;

      color: #777;
    }

    .task-delete {
      font-size: 15px;

      width: 25px;
      height: 25px;

      color: #777;
    }

    .reminder-mark {
      font-size: 8px;

      border: 1px solid #000;

      padding: 2px 5px;
    }

    .empty-state {
      padding: 35px 5px;

      text-align: center;

      font-size: 11px;

      color: #777;

      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }


    /* =====================================================
       LISTS
    ===================================================== */

    .lists-container {
      display: flex;
      flex-direction: column;
    }

    .list-card {
      min-height: 61px;

      border-top: 1px solid #000;

      display: flex;

      justify-content: space-between;
      align-items: center;

      padding: 0 5px;

      cursor: pointer;
    }

    .list-card:last-child {
      border-bottom: 1px solid #000;
    }

    .list-card-name {
      font-size: 12px;

      font-weight: 500;
    }

    .list-card-count {
      font-size: 9px;

      color: #777;
    }

    .new-list-button {
      width: 100%;
      height: 48px;

      border: 1px solid #000;

      margin-top: 16px;

      font-size: 11px;

      font-weight: 600;
    }


    /* =====================================================
       NOTES
    ===================================================== */

    .notes-area {
      width: 100%;

      min-height: 240px;

      border: 1px solid #000;

      padding: 15px;

      font-size: 13px;

      line-height: 1.6;

      resize: vertical;

      background: #fff;
    }

    .save-notes {
      width: 100%;
      height: 44px;

      border: 1px solid #000;

      margin-top: 10px;

      font-size: 11px;
      font-weight: 600;
    }

    .save-notes:hover {
      background: #000;
      color: #fff;
    }


    /* =====================================================
       DASHBOARD
    ===================================================== */

    .dashboard-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .dashboard-item {
      border: 1px solid #000;

      min-height: 105px;

      padding: 17px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;
    }

    .dashboard-number {
      font-size: 28px;

      font-weight: 600;

      letter-spacing: -1px;
    }

    .dashboard-label {
      font-size: 9px;

      font-weight: 500;
    }


    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {
      position: fixed;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      width: min(920px, 100%);

      height: 66px;

      background: rgba(255,255,255,0.97);

      border-top: 1px solid #000;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      z-index: 1000;
    }

    .bottom-nav-button {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 5px;
    }

    .bottom-nav-icon {
      font-size: 15px;

      line-height: 1;
    }

    .bottom-nav-label {
      font-size: 8px;

      font-weight: 500;
    }

    .bottom-nav-button.active .bottom-nav-label {
      font-weight: 700;
    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal-overlay {
      position: fixed;

      inset: 0;

      background: rgba(255,255,255,0.94);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 3000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: min(420px, 100%);

      border: 1px solid #000;

      background: #fff;

      padding: 25px;
    }

    .modal-title {
      font-size: 16px;

      font-weight: 600;

      margin-bottom: 20px;
    }

    .modal-input {
      width: 100%;

      border: none;

      border-bottom: 1px solid #000;

      padding: 10px 0;

      font-size: 13px;
    }

    .modal-buttons {
      display: flex;

      gap: 10px;

      margin-top: 22px;
    }

    .modal-button {
      flex: 1;

      height: 42px;

      border: 1px solid #000;

      font-size: 10px;

      font-weight: 600;
    }

    .modal-button.primary {
      background: #000;

      color: #fff;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .app {
        padding:
          22px
          18px
          90px;
      }

      .main-header {
        min-height: 88px;
      }

      /*
        El menú tiene suficiente espacio para que
        sus textos no se mezclen con el resto.
      */

      .menu-container {
        width: 150px;
        flex-basis: 150px;
      }

      .quick-actions {
        gap: 10px;

        margin-top: 38px;
      }

      .quick-action {
        min-height: 100px;

        padding: 16px;
      }

      .quick-action-title {
        font-size: 10px;
      }

      .calendar-box {
        padding: 14px 10px;
      }

      .calendar-day {
        min-height: 30px;
      }

      input[type="text"],
      input[type="date"],
      input[type="time"],
      textarea {
        font-size: 16px;
      }

    }


    @media (max-width: 390px) {

      .brand {
        font-size: 24px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .greeting {
        font-size: 12px;
      }

      .quick-action {
        min-height: 94px;

        padding: 13px;
      }

      .quick-action-title {
        font-size: 9px;
      }

      .calendar-day {
        min-height: 27px;

        font-size: 9px;
      }

      .bottom-nav-label {
        font-size: 7px;
      }

    }

  </style>
</head>


<body>

  <div class="app">


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header
      class="main-header"
      id="mainHeader"
    >

      <div class="header-left">

        <div class="brand">
          Nova-List
        </div>

        <div class="brand-subtitle">
          una APP de Incorova
        </div>

        <div
          class="greeting"
          id="greeting"
        >
          Buenos días
        </div>

      </div>

  <!-- =====================================================

  <script>

    /* =====================================================
       DATA
    ===================================================== */

    const STORAGE_KEY =
      "novaListData";


    let data = {

      lists: [],

      tasks: [],

      notes: ""

    };


    let selectedReminderList = null;

    let reminderHasTime = false;

    let reminderHasAlarm = false;

    let currentCalendarDate =
      new Date();

    let selectedCalendarDate =
      new Date();

    let currentListId = null;


    /* =====================================================
       DOM
    ===================================================== */

    const menuContainer =
      document.getElementById(
        "menuContainer"
      );

    const dotsButton =
      document.getElementById(
        "dotsButton"
      );

    const menuClose =
      document.getElementById(
        "menuClose"
      );

    const greeting =
      document.getElementById(
        "greeting"
      );


    const reminderPanel =
      document.getElementById(
        "reminderPanel"
      );

    const newReminderButton =
      document.getElementById(
        "newReminderButton"
      );

    const cancelReminder =
      document.getElementById(
        "cancelReminder"
      );

    const saveReminder =
      document.getElementById(
        "saveReminder"
      );


    const reminderTitle =
      document.getElementById(
        "reminderTitle"
      );

    const reminderDate =
      document.getElementById(
        "reminderDate"
      );

    const reminderTime =
      document.getElementById(
        "reminderTime"
      );


    const reminderListSelector =
      document.getElementById(
        "reminderListSelector"
      );

    const selectedListRow =
      document.getElementById(
        "selectedListRow"
      );

    const selectedListName =
      document.getElementById(
        "selectedListName"
      );

    const reminderListOptions =
      document.getElementById(
        "reminderListOptions"
      );

    const createListFromReminder =
      document.getElementById(
        "createListFromReminder"
      );


    const timeYes =
      document.getElementById(
        "timeYes"
      );

    const timeNo =
      document.getElementById(
        "timeNo"
      );

    const timeWrapper =
      document.getElementById(
        "timeWrapper"
      );


    const alarmYes =
      document.getElementById(
        "alarmYes"
      );

    const alarmNo =
      document.getElementById(
        "alarmNo"
      );


    const calendarMonth =
      document.getElementById(
        "calendarMonth"
      );

    const calendarDays =
      document.getElementById(
        "calendarDays"
      );


    const previousMonth =
      document.getElementById(
        "previousMonth"
      );

    const nextMonth =
      document.getElementById(
        "nextMonth"
      );


    const overdueBadge =
      document.getElementById(
        "overdueBadge"
      );


    const todayButton =
      document.getElementById(
        "todayButton"
      );

    const upcomingButton =
      document.getElementById(
        "upcomingButton"
      );


    const todayItems =
      document.getElementById(
        "todayItems"
      );

    const upcomingItems =
      document.getElementById(
        "upcomingItems"
      );


    const listsContainer =
      document.getElementById(
        "listsContainer"
      );


    const listDetailItems =
      document.getElementById(
        "listDetailItems"
      );

    const listDetailTitle =
      document.getElementById(
        "listDetailTitle"
      );

    const listDetailCount =
      document.getElementById(
        "listDetailCount"
      );


    const notesArea =
      document.getElementById(
        "notesArea"
      );


    const dashboardPending =
      document.getElementById(
        "dashboardPending"
      );

    const dashboardToday =
      document.getElementById(
        "dashboardToday"
      );

    const dashboardOverdue =
      document.getElementById(
        "dashboardOverdue"
      );

    const dashboardLists =
      document.getElementById(
        "dashboardLists"
      );


    const listModal =
      document.getElementById(
        "listModal"
      );

    const newListName =
      document.getElementById(
        "newListName"
      );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    function initialize() {

      loadData();

      updateGreeting();

      selectedReminderList =
        null;

      selectedListName.textContent =
        "Seleccionar lista";

      setDefaultReminderDate();

      notesArea.value =
        data.notes || "";

      renderCalendar();

      renderLists();

      updateOverdueBadge();

      updateDashboard();

      showHome();

    }


    /* =====================================================
       LOCAL STORAGE
    ===================================================== */

    function loadData() {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );


      if (!saved) {

        data.lists = [

          {
            id: createId(),
            name: "Personal"
          },

          {
            id: createId(),
            name: "Trabajo"
          }

        ];

        data.tasks = [];

        data.notes = "";

        saveData();

        return;

      }


      try {

        const parsed =
          JSON.parse(saved);


        data = {

          lists:
            Array.isArray(
              parsed.lists
            )
              ? parsed.lists
              : [],

          tasks:
            Array.isArray(
              parsed.tasks
            )
              ? parsed.tasks
              : [],

          notes:
            typeof parsed.notes ===
            "string"
              ? parsed.notes
              : ""

        };

      } catch (error) {

        console.error(
          "No se pudo cargar Nova List.",
          error
        );

      }

    }


    function saveData() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

    }


    function createId() {

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .substring(2, 8)
      );

    }


    /* =====================================================
       GREETING
    ===================================================== */

    function updateGreeting() {

      const hour =
        new Date().getHours();


      if (hour < 12) {

        greeting.textContent =
          "Buenos días";

      }

      else if (hour < 19) {

        greeting.textContent =
          "Buenas tardes";

      }

      else {

        greeting.textContent =
          "Buenas noches";

      }

    }


    /* =====================================================
       MENU
    ===================================================== */

    dotsButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        menuContainer.classList.add(
          "open"
        );

      }
    );


    menuClose.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        menuContainer.classList.remove(
          "open"
        );

      }
    );


    document
      .querySelectorAll(".menu-row")
      .forEach(
        function(row) {

          row.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();

              const menu =
                row.dataset.menu;


              menuContainer.classList.remove(
                "open"
              );


              if (
                menu === "lists"
              ) {

                renderLists();

                showView(
                  "listsView"
                );

                setBottomActive(
                  "lists"
                );

              }


              if (
                menu === "notes"
              ) {

                notesArea.value =
                  data.notes || "";

                showView(
                  "notesView"
                );

                setBottomActive(
                  "notes"
                );

              }


              if (
                menu === "dashboard"
              ) {

                updateDashboard();

                showView(
                  "dashboardView"
                );

                setBottomActive(
                  "dashboard"
                );

              }

            }
          );

        }
      );


    /* =====================================================
       CERRAR MENÚ FUERA
    ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        if (
          !menuContainer.contains(
            event.target
          )
        ) {

          menuContainer.classList.remove(
            "open"
          );

        }

      }
    );


    /* =====================================================
       RECORDATORIO
    ===================================================== */

    newReminderButton.addEventListener(
      "click",
      function() {

        reminderPanel.classList.add(
          "visible"
        );

        renderReminderLists();

        reminderTitle.focus();

      }
    );


    cancelReminder.addEventListener(
      "click",
      function() {

        closeReminderPanel();

      }
    );


    function closeReminderPanel() {

      reminderPanel.classList.remove(
        "visible"
      );


      reminderTitle.value = "";

      selectedReminderList =
        null;

      selectedListName.textContent =
        "Seleccionar lista";


      reminderListSelector.classList.remove(
        "expanded"
      );


      reminderHasTime =
        false;

      reminderHasAlarm =
        false;


      reminderTime.value = "";

      timeWrapper.classList.remove(
        "visible"
      );


      setChoice(
        timeYes,
        false
      );

      setChoice(
        timeNo,
        false
      );

      setChoice(
        alarmYes,
        false
      );

      setChoice(
        alarmNo,
        false
      );


      setDefaultReminderDate();

    }


    function setDefaultReminderDate() {

      reminderDate.value =
        formatDate(
          new Date()
        );

    }


    /* =====================================================
       LIST SELECTOR
    ===================================================== */

    selectedListRow.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        reminderListSelector.classList.toggle(
          "expanded"
        );

        renderReminderLists();

      }
    );


    function renderReminderLists() {

      reminderListOptions.innerHTML =
        "";


      data.lists.forEach(
        function(list) {

          const option =
            document.createElement(
              "div"
            );


          option.className =
            "list-option";


          option.textContent =
            list.name;


          option.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();


              selectedReminderList =
                list.id;


              selectedListName.textContent =
                list.name;


              reminderListSelector.classList.remove(
                "expanded"
              );

            }
          );


          reminderListOptions.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       CREAR LISTA DESDE RECORDATORIO
    ===================================================== */

    createListFromReminder.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        openListModal(
          true
        );

      }
    );


    /* =====================================================
       HORA
    ===================================================== */

    timeYes.addEventListener(
      "click",
      function() {

        reminderHasTime =
          true;


        setChoice(
          timeYes,
          true
        );

        setChoice(
          timeNo,
          false
        );


        timeWrapper.classList.add(
          "visible"
        );

      }
    );


    timeNo.addEventListener(
      "click",
      function() {

        reminderHasTime =
          false;

    /* =====================================================

    ===================================================== */

    function renderCalendar() {

      const year =
        currentCalendarDate.getFullYear();

      const month =
        currentCalendarDate.getMonth();


      const monthNames = [

        "Enero",
        "Febrero",
        "Marzo",
        "Abril",
        "Mayo",
        "Junio",
        "Julio",
        "Agosto",
        "Septiembre",
        "Octubre",
        "Noviembre",
        "Diciembre"

      ];


      calendarMonth.textContent =
        `${monthNames[month]} ${year}`;


      calendarDays.innerHTML =
        "";


      const firstDay =
        new Date(
          year,
          month,
          1
        );


      let startDay =
        firstDay.getDay();


      startDay =
        startDay === 0
          ? 6
          : startDay - 1;


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();


      for (
        let i = 0;
        i < startDay;
        i++
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "calendar-day empty";


        calendarDays.appendChild(
          empty
        );

      }


      const today =
        new Date();


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const cell =
          document.createElement(
            "button"
          );


        cell.className =
          "calendar-day";


        cell.textContent =
          day;


        const date =
          new Date(
            year,
            month,
            day
          );


        const dateString =
          formatDate(
            date
          );


        if (
          formatDate(today) ===
          dateString
        ) {

          cell.classList.add(
            "today"
          );

        }


        if (
          formatDate(
            selectedCalendarDate
          ) ===
          dateString
        ) {

          cell.classList.add(
            "selected"
          );

        }


        const hasItems =
          data.tasks.some(
            function(task) {

              return (
                task.date ===
                dateString
              );

            }
          );


        if (hasItems) {

          cell.classList.add(
            "has-items"
          );

        }


        cell.addEventListener(
          "click",
          function() {

            selectedCalendarDate =
              date;


            renderCalendar();


            openDateView(
              dateString
            );

          }
        );


        calendarDays.appendChild(
          cell
        );

      }

    }

    function renderUpcoming() {

      upcomingItems.innerHTML =
        "";


      const now =
        new Date();


      const end =
        new Date(
          now.getTime() +
          48 * 60 * 60 * 1000
        );


      const items =
        data.tasks
          .filter(
            function(task) {

              if (
                task.completed ||
                !task.date
              ) {

                return false;

              }


              const date =
                parseDate(
                  task.date
                );


              return (
                date >= startOfToday() &&
                date <= end
              );

            }
          )
          .sort(
            sortTasks
          );


      if (
        items.length === 0
      ) {

        upcomingItems.innerHTML = `

          <div class="empty-state">
            No hay pendientes para las próximas 48 horas.
          </div>

        `;

        return;

      items.forEach(
        function(task) {

          upcomingItems.appendChild(
            createTaskElement(
              task,
              true
            )
          );

        }
      );

    function createTaskElement(
      task,
      showDate = false

      const item =

          "div"
        );


      item.className =
        "task-item";


      if (
        task.completed
      ) {

        item.classList.add(
          "completed"
        );

      }


      const check =
        document.createElement(
          "button"
        );


      check.className =
        "task-check";


      if (
        task.completed
      ) {

        check.classList.add(
          "completed"
        );

      }


      check.addEventListener(
        "click",
        function() {

          task.completed =
            !task.completed;


          saveData();

          refreshEverything();

        }
      );


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "task-content";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "task-title";


      title.textContent =
        task.title;


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "task-meta";


      const list =
        data.lists.find(
          function(l) {

            return (
              l.id ===
              task.listId
            );

          }
        );


      if (list) {

        const listMeta =
          document.createElement(
            "span"
          );


        listMeta.textContent =
          list.name;


        meta.appendChild(
          listMeta
        );

      }


      if (
        task.type ===
        "reminder"
      ) {

        const mark =
          document.createElement(
            "span"
          );


        mark.className =
          "reminder-mark";


        mark.textContent =
          "RECORDATORIO";


        meta.appendChild(
          mark
        );


        if (
          task.time
        ) {

          const time =
            document.createElement(
              "span"
            );


          time.textContent =
            task.time;


          meta.appendChild(
            time
          );

        }

      }


      if (
        showDate
      ) {

        const date =
          document.createElement(
            "span"
          );


        date.textContent =
          formatReadableDate(
            task.date
          );


        meta.appendChild(
          date
        );

      }


      content.appendChild(
        title
      );


      content.appendChild(
        meta
      );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "task-delete";


      deleteButton.textContent =
        "×";


      deleteButton.addEventListener(
        "click",
        function() {

          if (
            !confirm(
              "¿Eliminar este elemento?"
            )
          ) {

            return;

          }


          data.tasks =
            data.tasks.filter(
              function(t) {

                return (
                  t.id !==
                  task.id
                );

              }
            );


          saveData();

          refreshEverything();

        }
      );


      item.appendChild(
        check
      );


      item.appendChild(
        content
      );


      item.appendChild(
        deleteButton
      );


      return item;

    }

    /* =====================================================
       OVERDUE
       SOLO TO-DO
    ===================================================== */

    function getOverdueTasks() {

      const today =
        startOfToday();


      return data.tasks.filter(
        function(task) {

          if (
            task.type !==
            "todo"
          ) {

            return false;

          }


          if (
            task.completed
          ) {

            return false;

          }


          if (
            !task.date
          ) {

            return false;

          }


          return (
            parseDate(
              task.date
            ) < today
          );

        }
      );

    }

    /* =====================================================
       SORT
    ===================================================== */

    function sortTasks(
      a,
      b
    ) {

      const dateA =
        a.date ||
        "9999-12-31";


      const dateB =
        b.date ||
        "9999-12-31";


      if (
        dateA !==
        dateB
      ) {

        return dateA.localeCompare(
          dateB
        );

      }


      const timeA =
        a.time ||
        "99:99";


      const timeB =
        b.time ||
        "99:99";


      return timeA.localeCompare(
        timeB
      );

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(
      date
    ) {

      const year =
        date.getFullYear();


      const month =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        );


      return `${year}-${month}-${day}`;

    }


    function parseDate(
      dateString
    ) {

      const [
        year,
        month,
        day
      ] =
        dateString
          .split("-")
          .map(Number);


      return new Date(
        year,
        month - 1,
        day
      );

    }


    function startOfToday() {

      const today =
        new Date();


      today.setHours(
        0,
        0,
        0,
        0
      );


      return today;

    }


    function formatReadableDate(
      dateString
    ) {

      const date =
        parseDate(
          dateString
        );


      const days = [

        "Domingo",
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado"

      ];


      const months = [

        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"

      ];


      return (
        days[date.getDay()] +
        " " +
        date.getDate() +
        " de " +
        months[date.getMonth()] +
        " de " +
        date.getFullYear()
      );

    }
