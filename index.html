<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Nova List - una APP de Incorova"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="/nova-icon.png"
    >

    <title>Nova-List</title>


    <style>

        /* =========================
           BASE
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #777777;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            background: var(--white);
            color: var(--black);

            /*
             * GEOMETRIC SANS
             *
             * Si la fuente está instalada en el dispositivo,
             * se utilizará directamente.
             *
             * Si no, se utiliza una alternativa geométrica.
             */
            font-family:
                "Geometric Sans",
                "Century Gothic",
                "Avenir Next",
                Avenir,
                Montserrat,
                Arial,
                sans-serif;

            overflow-x: hidden;
        }


        button {
            font-family: inherit;
        }


        /* =========================
           CONTENEDOR PRINCIPAL
        ========================= */

        .nova-page {
            position: relative;

            width: 100%;
            min-height: 100vh;

            background: #ffffff;

            overflow: hidden;
        }


        /* =========================
           PANEL DE NOTIFICACIONES
        ========================= */

        .notification-panel {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 300px;
            max-width: 80vw;

            padding: 0 0 30px 24px;

            z-index: 20;

            pointer-events: none;
        }


        .notification {

            position: relative;

            width: 250px;

            padding: 17px 20px;

            margin-top: 10px;

            background: #ffffff;

            border: 1px solid #e7e7e7;

            border-radius: 0;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.05);

            opacity: 0;

            transform:
                translateY(80px);

            animation:
                notificationIn
                0.8s cubic-bezier(.16,1,.3,1)
                forwards;
        }


        .notification:nth-child(1) {
            animation-delay: .2s;
        }


        .notification:nth-child(2) {
            animation-delay: .45s;
        }


        .notification:nth-child(3) {
            animation-delay: .7s;
        }


        .notification-small {
            font-size: 9px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #888888;

            margin-bottom: 7px;
        }


        .notification-title {
            font-size: 13px;

            font-weight: 600;

            letter-spacing: -.2px;
        }


        .notification-time {
            margin-top: 7px;

            font-size: 10px;

            color: #777777;
        }


        @keyframes notificationIn {

            from {
                opacity: 0;
                transform: translateY(80px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           IDENTIDAD CENTRAL
        ========================= */

        .brand {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            text-align: center;

            white-space: nowrap;
        }


        .brand-name {

            font-size: clamp(38px, 6vw, 76px);

            font-weight: 600;

            letter-spacing: -3px;

            line-height: .9;
        }


        .brand-subtitle {

            margin-top: 15px;

            font-size: clamp(9px, 1vw, 12px);

            letter-spacing: 2.5px;

            color: #777777;

            text-transform: lowercase;
        }


        /* =========================
           BOTÓN DE TRES PUNTOS
        ========================= */

        .menu-trigger {

            position: fixed;

            top: 0;
            left: 0;

            width: 58px;
            height: 58px;

            border: none;

            background: transparent;

            cursor: pointer;

            z-index: 50;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 0;
        }


        .dots {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            transition:
                gap .35s cubic-bezier(.16,1,.3,1);
        }


        .dot {

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #000000;

            transition:
                transform .45s cubic-bezier(.16,1,.3,1),
                width .45s cubic-bezier(.16,1,.3,1),
                height .45s cubic-bezier(.16,1,.3,1);
        }


        /* Efecto al pasar el mouse */

        .menu-trigger:hover .dots {

            gap: 7px;
        }


        .menu-trigger:hover .dot {

            width: 4px;
            height: 4px;
        }


        /* =========================
           MENÚ ABIERTO
        ========================= */

        .menu-panel {

            position: fixed;

            top: 58px;
            left: 0;

            z-index: 40;

            display: flex;

            flex-direction: column;

            width: 240px;

            pointer-events: none;
        }


        .menu-option {

            position: relative;

            height: 48px;

            display: flex;

            align-items: center;

            padding-left: 58px;

            background: #ffffff;

            color: #000000;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-decoration: none;

            opacity: 0;

            transform:
                translateY(-18px)
                translateX(-20px);

            border-bottom: 1px solid #eeeeee;

            transition:
                opacity .45s ease,
                transform .6s cubic-bezier(.16,1,.3,1);
        }


        .menu-option::before {

            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 1px;

            background: #000000;

            transition:
                width .65s cubic-bezier(.16,1,.3,1);
        }


        .menu-option:hover::before {

            width: 100%;
        }


        /* =========================
           ANIMACIÓN AL ABRIR
        ========================= */

        .nova-page.menu-open
        .menu-panel {

            pointer-events: auto;
        }


        .nova-page.menu-open
        .menu-option {

            opacity: 1;

            transform:
                translateY(0)
                translateX(0);
        }


        .nova-page.menu-open
        .menu-option:nth-child(1) {

            transition-delay: .05s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(2) {

            transition-delay: .15s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(3) {

            transition-delay: .25s;
        }


        /* =========================
           MOVIMIENTO DE LOS PUNTOS
        ========================= */

        .nova-page.menu-open
        .dot:nth-child(1) {

            transform:
                translateY(7px);
        }


        .nova-page.menu-open
        .dot:nth-child(2) {

            transform:
                translateY(0);
        }


        .nova-page.menu-open
        .dot:nth-child(3) {

            transform:
                translateY(-7px);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .brand-name {

                letter-spacing: -2px;

                font-size: 43px;
            }


            .brand-subtitle {

                margin-top: 12px;

                font-size: 9px;

                letter-spacing: 2px;
            }


            .notification-panel {

                width: 260px;

                padding-left: 16px;

                padding-bottom: 20px;
            }


            .notification {

                width: 225px;

                padding: 15px 17px;
            }


            .menu-panel {

                width: 210px;
            }


            .menu-option {

                height: 46px;

                padding-left: 48px;

                font-size: 10px;
            }

        }


        /* =========================
           REDUCIR ANIMACIONES
           SI EL DISPOSITIVO LO PIDE
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: .01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: .01ms !important;
            }

        }

    </style>

</head>


<body>


<div
    class="nova-page"
    id="novaPage"
>


    <!-- =========================
         BOTÓN MENÚ
    ========================== -->

    <button
        class="menu-trigger"
        id="menuTrigger"
        aria-label="Abrir menú"
        aria-expanded="false"
    >

        <span class="dots">

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </span>

    </button>


    <!-- =========================
         MENÚ
    ========================== -->

    <nav
        class="menu-panel"
        id="menuPanel"
    >

        <a
            href="#"
            class="menu-option"
            onclick="return false;"
        >
            Listas
        </a>


        <a
            href="#"
            class="menu-option"
            onclick="return false;"
        >
            Notas
        </a>


        <a
            href="#"
            class="menu-option"
            onclick="return false;"
        >
            Dashboard
        </a>

    </nav>


    <!-- =========================
         MARCA CENTRAL
    ========================== -->

    <main class="brand">

        <h1 class="brand-name">
            Nova-List
        </h1>


        <p class="brand-subtitle">
            una APP de Incorova
        </p>

    </main>


    <!-- =========================
         NOTIFICACIONES
    ========================== -->

    <aside
        class="notification-panel"
        aria-label="Notificaciones"
    >

        <div class="notification">

            <div class="notification-small">
                Próximo
            </div>

            <div class="notification-title">
                Revisar pendiente
            </div>

            <div class="notification-time">
                Requiere atención
            </div>

        </div>


        <div class="notification">

            <div class="notification-small">
                Hoy
            </div>

            <div class="notification-title">
                Tarea pendiente
            </div>

            <div class="notification-time">
                Próxima a vencer
            </div>

        </div>


        <div class="notification">

            <div class="notification-small">
                Atención
            </div>

            <div class="notification-title">
                Tienes un pendiente
            </div>

            <div class="notification-time">
                Revisar ahora
            </div>

        </div>

    </aside>


</div>


<script>


    const novaPage =
        document.getElementById(
            "novaPage"
        );


    const menuTrigger =
        document.getElementById(
            "menuTrigger"
        );


    menuTrigger.addEventListener(
        "click",
        function() {

            const isOpen =
                novaPage.classList.toggle(
                    "menu-open"
                );


            menuTrigger.setAttribute(
                "aria-expanded",
                isOpen
            );

        }
    );


    /*
     * Cerrar el menú al hacer clic
     * fuera de él.
     */

    document.addEventListener(
        "click",
        function(event) {

            if (
                !menuTrigger.contains(event.target) &&
                !document
                    .getElementById("menuPanel")
                    .contains(event.target)
            ) {

                novaPage.classList.remove(
                    "menu-open"
                );

                menuTrigger.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }

        }
    );


    /*
     * Service Worker
     */

    if (
        "serviceWorker"
        in navigator
    ) {

        window.addEventListener(
            "load",
            function() {

                navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            }
        );

    }

</script>


</body>

</html>
