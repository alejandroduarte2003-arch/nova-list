<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova-List</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/nova-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family:
        "Avenir Next",
        "Montserrat",
        "Helvetica Neue",
        Arial,
        sans-serif;
      min-height: 100vh;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    .app {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding-bottom: 100px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: relative;
      padding-top: 30px;
      padding-bottom: 34px;
    }

    .header-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo-title {
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -1px;
      line-height: 1;
    }

    .incorova {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 400;
    }

    .greeting {
      margin-top: 13px;
      font-size: 13px;
      font-weight: 400;
    }

    /* =========================
       MENU
    ========================= */

    .menu-container {
      position: absolute;
      top: 31px;
      right: 14px;
      width: 220px;
      min-height: 180px;
      pointer-events: none;
    }

    .menu-dots {
      position: absolute;
      top: 3px;
      right: 0;
      display: flex;
      gap: 5px;
      align-items: center;
      pointer-events: auto;
      z-index: 10;
    }

    .dot {
      width: 5px;
      height: 5px;
      background: #000;
      border-radius: 50%;
      transition:
        transform 0.45s cubic-bezier(.22,1,.36,1),
        opacity 0.3s ease;
    }

    .menu-container.open .dot:nth-child(1) {
      transform: translate(-110px, 48px);
    }

    .menu-container.open .dot:nth-child(2) {
      transform: translate(-110px, 90px);
    }

    .menu-container.open .dot:nth-child(3) {
      transform: translate(-110px, 132px);
    }

    .menu-options {
      position: absolute;
      top: 0;
      right: 0;
      width: 180px;
      height: 170px;
      pointer-events: none;
    }

    .menu-option {
      position: absolute;
      right: 0;
      width: 165px;
      display: flex;
      align-items: center;
      gap: 11px;
      opacity: 0;
      transform: translateX(-10px);
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .menu-option:nth-child(1) {
      top: 46px;
    }

    .menu-option:nth-child(2) {
      top: 88px;
    }

    .menu-option:nth-child(3) {
      top: 130px;
    }

    .menu-line {
      width: 0;
      height: 1px;
      background: #000;
      transition: width 0.35s ease;
      flex-shrink: 0;
    }

    .menu-text {
      font-size: 13px;
      white-space: nowrap;
    }

    .menu-container.open .menu-option {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .menu-container.open .menu-option:nth-child(1) {
      transition-delay: 0.48s;
    }

    .menu-container.open .menu-option:nth-child(2) {
      transition-delay: 0.58s;
    }

    .menu-container.open .menu-option:nth-child(3) {
      transition-delay: 0.68s;
    }

    .menu-container.open .menu-line {
      width: 45px;
    }

    .close-menu {
      position: absolute;
      top: 3px;
      right: 0;
      font-size: 17px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    .menu-container.open .close-menu {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-container.open .menu-dots {
      pointer-events: none;
    }

    .menu-container.open .menu-dots .dot {
      opacity: 0;
    }

    /* =========================
       OVERVIEW
    ========================= */

    .overview {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      padding: 18px 0;
      margin-bottom: 28px;
    }

    .overview-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .overview-number {
      font-size: 22px;
      font-weight: 500;
    }

    .overview-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* =========================
       CALENDAR
    ========================= */

    .calendar-section {
      margin-bottom: 34px;
    }

    .calendar {
      width: 44%;
      min-width: 245px;
      max-width: 310px;
      border: 1px solid #000;
      padding: 14px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .calendar-month {
      font-size: 13px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .calendar-arrow {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .calendar-weekdays {
      margin-bottom: 5px;
    }

    .calendar-weekday {
      text-align: center;
      font-size: 8px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .calendar-day {
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 10px;
      cursor: pointer;
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.today {
      border: 1px solid #000;
    }

    .calendar-day.selected {
      background: #000;
      color: #fff;
    }

    .calendar-day.has-task::after {
      content: "";
      position: absolute;
      bottom: 3px;
      width: 3px;
      height: 3px;
      background: #000;
      border-radius: 50%;
    }

    .calendar-day.selected.has-task::after {
      background: #fff;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-bottom: 34px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 13px;
    }

    .section-title h2 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .section-title span {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* =========================
       TASKS
    ========================= */

    .task {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 13px 0;
    }

    .task:first-child {
      border-top: 1px solid #000;
    }

    .task-name {
      font-size: 13px;
      line-height: 1.4;
    }

    .task-meta {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .task-overdue {
      font-size: 9px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .more {
      border-top: 1px solid #ddd;
      padding-top: 13px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(680px, calc(100% - 40px));
      background: #fff;
      border: 1px solid #000;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 30;
    }

    .nav-item {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .nav-item + .nav-item {
      border-left: 1px solid #000;
    }

    .nav-item.active {
      background: #000;
      color: #fff;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .app {
        width: calc(100% - 30px);
      }

      header {
        padding-top: 24px;
      }

      .logo-title {
        font-size: 24px;
      }

      .calendar {
        width: 44%;
        min-width: 225px;
        padding: 12px;
      }

      .calendar-day {
        height: 27px;
      }

      .overview-number {
        font-size: 19px;
      }

      .menu-container {
        right: 5px;
      }
    }

    @media (max-width: 400px) {

      .calendar {
        width: 48%;
        min-width: 215px;
      }

      .overview-number {
        font-size: 17px;
      }

      .overview-label {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header>

      <div class="header-info">
        <div class="logo-title">Nova-List</div>
        <div class="incorova">una APP de Incorova</div>
        <div class="greeting" id="greeting"></div>
      </div>

      <!-- MENU -->
      <div class="menu-container" id="menuContainer">

        <button class="menu-dots" id="menuButton" aria-label="Abrir menú">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </button>

        <button class="close-menu" id="closeMenu" aria-label="Cerrar menú">
          ×
        </button>

        <div class="menu-options">

          <button class="menu-option">
            <span class="menu-line"></span>
            <span class="menu-text">Listas</span>
          </button>

          <button class="menu-option">
            <span class="menu-line"></span>
            <span class="menu-text">Notas</span>
          </button>

          <button class="menu-option">
            <span class="menu-line"></span>
            <span class="menu-text">Dashboard</span>
          </button>

        </div>

      </div>

    </header>


    <!-- OVERVIEW -->
    <section class="overview">

      <div class="overview-item">
        <span class="overview-number">12</span>
        <span class="overview-label">Pendientes</span>
      </div>

      <div class="overview-item">
        <span class="overview-number">4</span>
        <span class="overview-label">Para hoy</span>
      </div>

      <div class="overview-item">
        <span class="overview-number">2</span>
        <span class="overview-label">Próximos</span>
      </div>

    </section>


    <!-- CALENDAR -->
    <section class="calendar-section">

      <div class="calendar">

        <div class="calendar-header">

          <button class="calendar-arrow" id="prevMonth">
            ‹
          </button>

          <div class="calendar-month" id="calendarMonth"></div>

          <button class="calendar-arrow" id="nextMonth">
            ›
          </button>

        </div>

        <div class="calendar-weekdays">
          <div class="calendar-weekday">L</div>
          <div class="calendar-weekday">M</div>
          <div class="calendar-weekday">X</div>
          <div class="calendar-weekday">J</div>
          <div class="calendar-weekday">V</div>
          <div class="calendar-weekday">S</div>
          <div class="calendar-weekday">D</div>
        </div>

        <div class="calendar-days" id="calendarDays"></div>

      </div>

    </section>


    <!-- TODAY -->
    <section class="section">

      <div class="section-title">
        <h2>Hoy</h2>
        <span>03 OCT</span>
      </div>

      <div class="task">
        <div class="task-name">
          Enviar documentos
        </div>

        <div class="task-overdue">
          Vencido
        </div>
      </div>

      <div class="task">
        <div class="task-name">
          Revisar propuesta
        </div>

        <div class="task-meta">
          16:00
        </div>
      </div>

      <div class="task">
        <div class="task-name">
          Comprar concentrado
        </div>

        <div class="task-meta">
          Hoy
        </div>
      </div>

      <div class="task">
        <div class="task-name">
          Llamar a cliente
        </div>

        <div class="task-meta">
          18:30
        </div>
      </div>

      <div class="more">
        + 8 pendientes más
      </div>

    </section>


    <!-- UPCOMING -->
    <section class="section">

      <div class="section-title">
        <h2>Próximamente</h2>
      </div>

      <div class="task">

        <div class="task-name">
          Pago mensual
        </div>

        <div class="task-meta">
          06 OCT
        </div>

      </div>

      <div class="task">

        <div class="task-name">
          Reunión de trabajo
        </div>

        <div class="task-meta">
          08 OCT · 09:00
        </div>

      </div>

    </section>

  </div>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="nav-item active">
      Listas
    </button>

    <button class="nav-item">
      Notas
    </button>

    <button class="nav-item">
      Agenda
    </button>

    <button class="nav-item">
      Dashboard
    </button>

  </nav>


  <script>

    /* =========================
       GREETING
    ========================= */

    function updateGreeting() {

      const hour = new Date().getHours();

      let greeting;

      if (hour >= 5 && hour < 12) {
        greeting = "Buenos días";
      } else if (hour >= 12 && hour < 19) {
        greeting = "Buenas tardes";
      } else {
        greeting = "Buenas noches";
      }

      document.getElementById("greeting").textContent = greeting;
    }

    updateGreeting();


    /* =========================
       MENU
    ========================= */

    const menuContainer =
      document.getElementById("menuContainer");

    const menuButton =
      document.getElementById("menuButton");

    const closeMenu =
      document.getElementById("closeMenu");

    menuButton.addEventListener("click", () => {
      menuContainer.classList.add("open");
    });

    closeMenu.addEventListener("click", () => {
      menuContainer.classList.remove("open");
    });


    /* =========================
       CALENDAR
    ========================= */

    const calendarMonth =
      document.getElementById("calendarMonth");

    const calendarDays =
      document.getElementById("calendarDays");

    const prevMonth =
      document.getElementById("prevMonth");

    const nextMonth =
      document.getElementById("nextMonth");


    const today = new Date();

    let currentMonth =
      today.getMonth();

    let currentYear =
      today.getFullYear();


    let selectedDate =
      today.getDate();


    const taskDays = {
      "2026-10-03": true,
      "2026-10-06": true,
      "2026-10-08": true,
      "2026-10-13": true,
      "2026-10-17": true
    };


    function formatDate(year, month, day) {

      const monthString =
        String(month + 1).padStart(2, "0");

      const dayString =
        String(day).padStart(2, "0");

      return `${year}-${monthString}-${dayString}`;
    }


    function renderCalendar() {

      calendarDays.innerHTML = "";

      const firstDay =
        new Date(
          currentYear,
          currentMonth,
          1
        ).getDay();

      const daysInMonth =
        new Date(
          currentYear,
          currentMonth + 1,
          0
        ).getDate();


      const adjustedFirstDay =
        firstDay === 0 ? 6 : firstDay - 1;


      const monthName =
        new Date(
          currentYear,
          currentMonth,
          1
        ).toLocaleDateString(
          "es-ES",
          {
            month: "long",
            year: "numeric"
          }
        );


      calendarMonth.textContent =
        monthName;


      for (
        let i = 0;
        i < adjustedFirstDay;
        i++
      ) {

        const empty =
          document.createElement("div");

        empty.className =
          "calendar-day empty";

        calendarDays.appendChild(empty);
      }


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const dayElement =
          document.createElement("button");

        dayElement.className =
          "calendar-day";

        dayElement.textContent =
          day;


        const dateKey =
          formatDate(
            currentYear,
            currentMonth,
            day
          );


        if (
          day === today.getDate() &&
          currentMonth === today.getMonth() &&
          currentYear === today.getFullYear()
        ) {

          dayElement.classList.add("today");

        }


        if (
          day === selectedDate &&
          currentMonth === today.getMonth() &&
          currentYear === today.getFullYear()
        ) {

          dayElement.classList.add("selected");

        }


        if (taskDays[dateKey]) {

          dayElement.classList.add("has-task");

        }


        dayElement.addEventListener(
          "click",
          () => {

            selectedDate = day;

            renderCalendar();

          }
        );


        calendarDays.appendChild(dayElement);

      }

    }


    prevMonth.addEventListener(
      "click",
      () => {

        currentMonth--;

        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }

        selectedDate = 1;

        renderCalendar();

      }
    );


    nextMonth.addEventListener(
      "click",
      () => {

        currentMonth++;

        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }

        selectedDate = 1;

        renderCalendar();

      }
    );


    renderCalendar();


    /* =========================
       SERVICE WORKER
    ========================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("/service-worker.js")
            .catch(() => {});

        }
      );

    }

  </script>

</body>
</html>
