<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="Nova-List - una APP de Incorova"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="/nova-icon.png"
    >

    <title>Nova-List</title>


    <style>

        /* =========================
           BASE
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #777777;
            --light-gray: #e8e8e8;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            background: var(--white);
            color: var(--black);

            font-family:
                "Geometric Sans",
                "Century Gothic",
                "Avenir Next",
                Avenir,
                Montserrat,
                Arial,
                sans-serif;

            overflow-x: hidden;
        }


        button {
            font-family: inherit;
        }


        /* =========================
           PÁGINA
        ========================= */

        .nova-page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            background: #ffffff;

            overflow: hidden;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        .header {

            position: absolute;

            top: 42px;

            left: 50%;

            transform:
                translateX(-50%);

            text-align: center;

            z-index: 10;

            white-space: nowrap;
        }


        .brand-name {

            font-size:
                clamp(34px, 5vw, 62px);

            font-weight: 500;

            letter-spacing: -3px;

            line-height: 1;
        }


        .brand-subtitle {

            margin-top: 10px;

            font-size: 10px;

            font-weight: 400;

            letter-spacing: 2.8px;

            color: #777777;

            text-transform: lowercase;
        }


        /* =========================
           NOTIFICACIONES
        ========================= */

        .notification-panel {

            position: absolute;

            top: 38px;

            right: 35px;

            width: 260px;

            z-index: 20;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .notification {

            width: 100%;

            padding: 16px 18px;

            background: #ffffff;

            border: 1px solid #e7e7e7;

            opacity: 0;

            transform:
                translateY(-35px);

            animation:
                notificationIn
                .8s cubic-bezier(.16,1,.3,1)
                forwards;
        }


        .notification:nth-child(1) {
            animation-delay: .15s;
        }


        .notification:nth-child(2) {
            animation-delay: .35s;
        }


        .notification:nth-child(3) {
            animation-delay: .55s;
        }


        .notification-label {

            font-size: 9px;

            letter-spacing: 2px;

            color: #888888;

            text-transform: uppercase;

            margin-bottom: 7px;
        }


        .notification-title {

            font-size: 13px;

            font-weight: 500;

            letter-spacing: -.1px;
        }


        .notification-time {

            margin-top: 7px;

            font-size: 10px;

            color: #777777;
        }


        @keyframes notificationIn {

            from {
                opacity: 0;
                transform:
                    translateY(-35px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        /* =========================
           MENÚ
        ========================= */

        .menu-container {

            position: fixed;

            top: 0;

            left: 0;

            z-index: 50;

            width: 100%;

            height: 230px;

            pointer-events: none;
        }


        /* =========================
           BOTÓN DE PUNTOS
        ========================= */

        .menu-trigger {

            position: absolute;

            top: 0;

            left: 0;

            width: 65px;

            height: 65px;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            pointer-events: auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .dots {

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: center;

            gap: 5px;

            transition:
                gap .35s cubic-bezier(.16,1,.3,1);
        }


        .dot {

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background: #000000;

            transition:
                transform .7s cubic-bezier(.16,1,.3,1),
                opacity .35s ease;
        }


        /* =========================
           HOVER
        ========================= */

        .menu-trigger:hover .dots {

            gap: 9px;
        }


        /* =========================
           OPCIONES
        ========================= */

        .menu-options {

            position: absolute;

            top: 65px;

            left: 0;

            width: 360px;

            pointer-events: none;
        }


        .menu-option {

            position: relative;

            height: 48px;

            width: 360px;

            display: flex;

            align-items: center;

            padding-left: 65px;

            overflow: hidden;

            opacity: 0;

            transform:
                translateX(-25px);

            transition:
                opacity .2s ease,
                transform .75s cubic-bezier(.16,1,.3,1);
        }


        /*
         * La línea empieza en el punto
         * y crece hacia la derecha.
         */

        .menu-line {

            position: absolute;

            left: 0;

            top: 50%;

            width: 0;

            height: 1px;

            background: #000000;

            transform:
                translateY(-50%);

            transition:
                width .8s cubic-bezier(.16,1,.3,1);
        }


        .menu-text {

            position: relative;

            margin-left: 15px;

            font-size: 10px;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transform:
                translateX(-10px);

            transition:
                opacity .4s ease .35s,
                transform .5s cubic-bezier(.16,1,.3,1) .35s;
        }


        /* =========================
           MENÚ ABIERTO
        ========================= */

        .nova-page.menu-open
        .menu-options {

            pointer-events: auto;
        }


        .nova-page.menu-open
        .menu-option {

            opacity: 1;

            transform:
                translateX(0);
        }


        .nova-page.menu-open
        .menu-option:nth-child(1) {

            transition-delay: .05s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(2) {

            transition-delay: .25s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(3) {

            transition-delay: .45s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(1)
        .menu-line {

            width: 230px;

            transition-delay: .25s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(2)
        .menu-line {

            width: 280px;

            transition-delay: .45s;
        }


        .nova-page.menu-open
        .menu-option:nth-child(3)
        .menu-line {

            width: 330px;

            transition-delay: .65s;
        }


        .nova-page.menu-open
        .menu-text {

            opacity: 1;

            transform:
                translateX(0);
        }


        /* =========================
           PUNTOS → VERTICAL
        ========================= */

        .nova-page.menu-open
        .dots {

            flex-direction: column;

            gap: 5px;
        }


        .nova-page.menu-open
        .dot:nth-child(1) {

            transform:
                translateY(0);
        }


        .nova-page.menu-open
        .dot:nth-child(2) {

            transform:
                translateY(0);
        }


        .nova-page.menu-open
        .dot:nth-child(3) {

            transform:
                translateY(0);
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .header {

                top: 32px;
            }


            .brand-name {

                font-size: 40px;

                letter-spacing: -2px;
            }


            .brand-subtitle {

                font-size: 8px;

                letter-spacing: 2px;
            }


            .notification-panel {

                top: 105px;

                right: 15px;

                width: 210px;
            }


            .notification {

                padding: 13px 15px;
            }


            .notification-title {

                font-size: 12px;
            }


            .menu-options {

                width: 300px;
            }


            .menu-option {

                width: 300px;
            }


            .menu-option:nth-child(1)
            .menu-line {

                width: 190px;
            }


            .menu-option:nth-child(2)
            .menu-line {

                width: 235px;
            }


            .menu-option:nth-child(3)
            .menu-line {

                width: 280px;
            }

        }


        /* =========================
           ANIMACIONES REDUCIDAS
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: .01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: .01ms !important;
            }

        }

    </style>

</head>


<body>


<div
    class="nova-page"
    id="novaPage"
>


    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header class="header">

        <h1 class="brand-name">
            Nova-List
        </h1>

        <p class="brand-subtitle">
            una APP de Incorova
        </p>

    </header>


    <!-- =========================
         NOTIFICACIONES
    ========================== -->

    <aside
        class="notification-panel"
    >

        <div class="notification">

            <div class="notification-label">
                Próximo
            </div>

            <div class="notification-title">
                Revisar pendiente
            </div>

            <div class="notification-time">
                Requiere atención
            </div>

        </div>


        <div class="notification">

            <div class="notification-label">
                Hoy
            </div>

            <div class="notification-title">
                Tarea pendiente
            </div>

            <div class="notification-time">
                Próxima a vencer
            </div>

        </div>


        <div class="notification">

            <div class="notification-label">
                Atención
            </div>

            <div class="notification-title">
                Tienes un pendiente
            </div>

            <div class="notification-time">
                Revisar ahora
            </div>

        </div>

    </aside>


    <!-- =========================
         MENÚ
    ========================== -->

    <div class="menu-container">


        <button
            class="menu-trigger"
            id="menuTrigger"
            aria-label="Abrir menú"
            aria-expanded="false"
        >

            <span class="dots">

                <span class="dot"></span>

                <span class="dot"></span>

                <span class="dot"></span>

            </span>

        </button>


        <nav
            class="menu-options"
            id="menuOptions"
        >


            <div class="menu-option">

                <span class="menu-line"></span>

                <span class="menu-text">
                    Listas
                </span>

            </div>


            <div class="menu-option">

                <span class="menu-line"></span>

                <span class="menu-text">
                    Notas
                </span>

            </div>


            <div class="menu-option">

                <span class="menu-line"></span>

                <span class="menu-text">
                    Dashboard
                </span>

            </div>


        </nav>

    </div>


</div>


<script>


    const novaPage =
        document.getElementById(
            "novaPage"
        );


    const menuTrigger =
        document.getElementById(
            "menuTrigger"
        );


    menuTrigger.addEventListener(
        "click",
        function() {

            const opened =
                novaPage.classList.toggle(
                    "menu-open"
                );


            menuTrigger.setAttribute(
                "aria-expanded",
                opened
            );

        }
    );


    /*
     * Service Worker
     */

    if (
        "serviceWorker"
        in navigator
    ) {

        window.addEventListener(
            "load",
            function() {

                navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            }
        );

    }

</script>


</body>

</html>
